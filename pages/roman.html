    if (hlCloseBtn) hlCloseBtn.addEventListener('click', closeHlPanel);
    hlTabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            hlTabs.forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            hlPanelTab = tab.dataset.tab;
            renderHighlightsList();
        });
    });

    function colorSwatch(color) {
        switch (color) {
            case 'red':   return 'rgba(220, 80, 80, 0.85)';
            case 'green': return 'rgba(120, 200, 100, 0.85)';
            case 'blue':  return 'rgba(80, 150, 220, 0.85)';
            default:      return 'rgba(255, 220, 80, 0.85)';
        }
    }
    function truncateText(s, n) {
        s = s || '';
        return s.length > n ? s.slice(0, n) + '…' : s;
    }

    function renderHighlightsList() {
        if (!hlList) return;
        var all = loadActiveHighlights();
        var items;
        if (hlPanelTab === 'chapter') {
            var ch = allChapters[currentChapterIdx];
            items = ch ? all.filter(function(h) { return h.chapterNum === ch.num; }) : [];
        } else {
            items = all.slice();
        }
        items.sort(function(a, b) {
            if (a.chapterNum !== b.chapterNum) return a.chapterNum - b.chapterNum;
            return a.start - b.start;
        });
        if (items.length === 0) {
            var msg = hlPanelTab === 'chapter'
                ? 'Aucun surlignage sur ce chapitre.<br><small>Sélectionne un passage du texte pour le surligner.</small>'
                : 'Aucun surlignage enregistré.<br><small>Sélectionne un passage pour le marquer en vue d’une modification future.</small>';
            hlList.innerHTML = '<div class="chron-highlights-empty">' + msg + '</div>';
            return;
        }
        var html = '';
        items.forEach(function(h) {
            html += '<div class="chron-highlight-item color-' + (h.color || DEFAULT_HL_COLOR) + '" data-id="' + h.id + '" data-chapter="' + h.chapterNum + '">';
            html += '<div class="chron-highlight-item-header">';
            html += '<span class="chron-highlight-item-color" style="background:' + colorSwatch(h.color) + '"></span>';
            html += '<span class="chron-highlight-item-chapter">Chapitre ' + h.chapterNum + ' — ' + escHtml(h.chapterTitle || '') + '</span>';
            html += '</div>';
            html += '<div class="chron-highlight-item-text">' + escHtml(truncateText(h.text, 240)) + '</div>';
            if (h.note) html += '<div class="chron-highlight-item-note">' + escHtml(h.note) + '</div>';
            html += '<div class="chron-highlight-item-actions">';
            html += '<button data-action="note">' + (h.note ? 'Modifier la note' : 'Ajouter une note') + '</button>';
            html += '<button data-action="delete">Supprimer</button>';
            html += '</div>';
            html += '</div>';
        });
        hlList.innerHTML = html;
        hlList.querySelectorAll('.chron-highlight-item').forEach(function(item) {
            item.addEventListener('click', function(e) {
                var action = e.target && e.target.dataset && e.target.dataset.action;
                var id = item.dataset.id;
                var h = loadHighlights().find(function(x) { return x.id === id; });
                if (!h) return;
                if (action === 'delete') {
                    e.stopPropagation();
                    if (!confirm('Supprimer ce surlignage ?')) return;
                    deleteHighlight(id);
                    return;
                }
                if (action === 'note') {
                    e.stopPropagation();
                    openNoteDialog('edit', h, h.text);
                    return;
                }
                jumpToHighlight(h);
            });
        });
    }

    function jumpToHighlight(h) {
        var doScroll = function() {
            var attempts = 0;
            var tryScroll = function() {
                attempts++;
                var mark = document.querySelector('mark[data-highlight-id="' + h.id + '"]');
                if (!mark && attempts < 20) { setTimeout(tryScroll, 100); return; }
                if (!mark) return;
                if (readMode === 'scroll') {
                    mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else if (readMode === 'page') {
                    var content = getContentEl();
                    if (!content) return;
                    var w = pagesWrapper.clientWidth;
                    var contentRect = content.getBoundingClientRect();
                    var markRect = mark.getBoundingClientRect();
                    var match = /translate3d\(([-\d.]+)px/.exec(content.style.transform || '');
                    var currentX = match ? parseFloat(match[1]) : 0;
                    var leftInContent = (markRect.left - contentRect.left) - currentX;
                    var page = Math.floor(leftInContent / w);
                    gotoPage(Math.max(0, Math.min(totalPages - 1, page)));
                }
                mark.classList.add('flash');
                setTimeout(function() { mark.classList.remove('flash'); }, 1500);
            };
            tryScroll();
        };
        if (currentChapterIdx >= 0 && allChapters[currentChapterIdx] && allChapters[currentChapterIdx].num === h.chapterNum) {
            doScroll();
        } else {
            openChapter(h.chapterNum);
            setTimeout(doScroll, 250);
        }
    }

    // ── Sync (Turso backend, password-gated) ──────────────
    function getStoredPassword() {
        try { return sessionStorage.getItem(SESSION_KEY_PASSWORD) || ''; } catch(e) { return ''; }
    }
    function setStoredPassword(pwd) {
        try { sessionStorage.setItem(SESSION_KEY_PASSWORD, pwd); } catch(e) {}
    }
    function clearStoredPassword() {
        try { sessionStorage.removeItem(SESSION_KEY_PASSWORD); } catch(e) {}
    }
    function showSyncInfo(msg, kind) {
        if (!hlSyncInfo) return;
        hlSyncInfo.textContent = msg;
        hlSyncInfo.classList.remove('error', 'success');
        if (kind) hlSyncInfo.classList.add(kind);
        hlSyncInfo.removeAttribute('hidden');
    }
    function setLastSync(ts) {
        try { localStorage.setItem(tomeStorageKey(STORAGE_KEY_HL_LAST_SYNC), String(ts)); } catch(e) {}
    }
    function getLastSync() {
        try {
            var v = localStorage.getItem(tomeStorageKey(STORAGE_KEY_HL_LAST_SYNC));
            return v ? parseInt(v, 10) : 0;
        } catch(e) { return 0; }
    }
    function formatRelativeTime(ts) {
        if (!ts) return 'jamais';
        var d = Date.now() - ts;
        if (d < 60000) return 'à l’instant';
        if (d < 3600000) return Math.floor(d / 60000) + ' min';
        if (d < 86400000) return Math.floor(d / 3600000) + ' h';
        return Math.floor(d / 86400000) + ' j';
    }
    function refreshSyncInfo() {
        if (!hlSyncInfo) return;
        var ts = getLastSync();
        if (ts) showSyncInfo('Dernière sync : ' + formatRelativeTime(ts), null);
        else hlSyncInfo.setAttribute('hidden', '');
    }

    function ensurePassword(silent) {
        var pwd = getStoredPassword();
        if (pwd) return Promise.resolve(pwd);
        if (silent) return Promise.reject(new Error('no-pwd'));
        var entered = prompt('Mot de passe éditeur :');
        if (!entered) return Promise.reject(new Error('annulé'));
        return fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: entered })
        }).then(function(r) {
            if (!r.ok) throw new Error('Mot de passe incorrect');
            setStoredPassword(entered);
            return entered;
        });
    }

    function reapplyHighlightsToCurrentChapter() {
        if (currentChapterIdx < 0) return;
        var content = getContentEl();
        if (!content) return;
        content.querySelectorAll('mark.chron-highlight').forEach(function(m) {
            var p = m.parentNode;
            while (m.firstChild) p.insertBefore(m.firstChild, m);
            p.removeChild(m);
            p.normalize();
        });
        applyAllHighlightsForCurrentChapter();
        if (readMode === 'page') rePaginate();
    }

    // ── Auto-sync : push debounced / pull silent ──────────────
    var SYNC_DEBOUNCE_MS = 800;
    var autoSyncTimer = null;
    var autoSyncInflight = false;
    var autoSyncPending = false;

    function setSyncState(state, msg) {
        // states: 'idle' | 'syncing' | 'synced' | 'error' | 'auth'
        if (hlToggleBtn) {
            hlToggleBtn.classList.remove('syncing', 'sync-error');
            if (state === 'syncing') hlToggleBtn.classList.add('syncing');
            if (state === 'error' || state === 'auth') hlToggleBtn.classList.add('sync-error');
        }
        if (state === 'syncing') showSyncInfo(msg || 'Synchronisation…', null);
        else if (state === 'synced') showSyncInfo(msg || ('Synchronisé · ' + formatRelativeTime(getLastSync())), 'success');
        else if (state === 'error') showSyncInfo(msg || 'Erreur de synchronisation', 'error');
        else if (state === 'auth') showSyncInfo(msg || 'Cliquer "Sync" pour activer la synchronisation', 'error');
        else refreshSyncInfo();
    }

    function pushHighlightsAPI(pwd) {
        var localAll = loadHighlights(); // inclut les tombstones
        return fetch('/api/highlights', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pwd, entries: localAll })
        }).then(function(r) {
            if (r.status === 403) {
                clearStoredPassword();
                var e = new Error('Mot de passe rejeté'); e.code = 'auth'; throw e;
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function(data) {
            var serverList = (data && data.highlights) || [];
            saveHighlights(serverList);
            setLastSync(Date.now());
            return serverList;
        });
    }

    function pullHighlightsAPI(pwd) {
        // Editor password as header (never query string — URLs leak via logs/referrers).
        return fetch('/api/highlights', { headers: { 'X-Editor-Password': pwd } })
            .then(function(r) {
                if (r.status === 403) {
                    clearStoredPassword();
                    var e = new Error('Mot de passe rejeté'); e.code = 'auth'; throw e;
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).then(function(data) {
                var serverList = (data && data.highlights) || [];
                // Merge server + local (par id, latest updatedAt gagne)
                var local = loadHighlights();
                var byId = {};
                serverList.forEach(function(h) { byId[h.id] = h; });
                local.forEach(function(h) {
                    if (!byId[h.id] || (h.updatedAt || 0) > (byId[h.id].updatedAt || 0)) {
                        byId[h.id] = h;
                    }
                });
                var merged = [];
                for (var k in byId) merged.push(byId[k]);
                saveHighlights(merged);
                setLastSync(Date.now());
                return merged;
            });
    }

    function scheduleAutoPush() {
        if (!getStoredPassword()) return;
        if (autoSyncTimer) clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(doAutoPush, SYNC_DEBOUNCE_MS);
    }

    function doAutoPush() {
        if (autoSyncInflight) { autoSyncPending = true; return; }
        var pwd = getStoredPassword();
        if (!pwd) return;
        autoSyncInflight = true;
        setSyncState('syncing');
        pushHighlightsAPI(pwd).then(function() {
            setSyncState('synced');
            renderHighlightsList();
            updateHighlightsCount();
            // Re-applique les highlights (server peut avoir résolu des conflits)
            reapplyHighlightsToCurrentChapter();
        }).catch(function(err) {
            setSyncState(err.code === 'auth' ? 'auth' : 'error', err.code === 'auth' ? null : ('Erreur : ' + err.message));
        }).finally(function() {
            autoSyncInflight = false;
            if (autoSyncPending) { autoSyncPending = false; scheduleAutoPush(); }
        });
    }

    function doAutoPull() {
        var pwd = getStoredPassword();
        if (!pwd) return;
        if (autoSyncInflight) { autoSyncPending = true; return; }
        autoSyncInflight = true;
        setSyncState('syncing', 'Récupération depuis le serveur…');
        pullHighlightsAPI(pwd).then(function() {
            setSyncState('synced');
            updateHighlightsCount();
            reapplyHighlightsToCurrentChapter();
            // Si le merge a généré du local plus récent que le serveur, repousser
            scheduleAutoPush();
        }).catch(function(err) {
            setSyncState(err.code === 'auth' ? 'auth' : 'error', err.code === 'auth' ? null : ('Erreur : ' + err.message));
        }).finally(function() {
            autoSyncInflight = false;
            if (autoSyncPending) { autoSyncPending = false; scheduleAutoPush(); }
        });
    }

    function syncHighlights() {
        // Manual sync : prompt password si nécessaire, push complet
        if (!hlSyncBtn) return;
        hlSyncBtn.disabled = true;
        setSyncState('syncing');
        ensurePassword(false).then(function(pwd) {
            return pushHighlightsAPI(pwd);
        }).then(function(serverList) {
            renderHighlightsList();
            updateHighlightsCount();
            reapplyHighlightsToCurrentChapter();
            setSyncState('synced', 'Synchronisé · ' + serverList.length + ' surlignages');
            setTimeout(function() { setSyncState('idle'); }, 3000);
        }).catch(function(err) {
            if (err && err.message === 'annulé') { setSyncState('idle'); }
            else { setSyncState(err.code === 'auth' ? 'auth' : 'error', err.code === 'auth' ? null : ('Erreur : ' + (err.message || 'inconnue'))); }
        }).finally(function() {
            hlSyncBtn.disabled = false;
        });
    }

    if (hlSyncBtn) hlSyncBtn.addEventListener('click', syncHighlights);

    if (hlExportBtn) {
        hlExportBtn.addEventListener('click', function() {
            var arr = loadHighlights();
            if (!arr.length) { alert('Aucun surlignage à exporter.'); return; }
            var json = JSON.stringify(arr, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            var date = new Date().toISOString().slice(0, 10);
            a.download = (currentTomeKey || 'roman') + '-surlignages-' + date + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    }

    // ── Utility ──────────────────────────────────────────────
    function escHtml(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }
})();
</script>
