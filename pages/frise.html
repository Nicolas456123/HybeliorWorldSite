/* =================================================================
   RENDER
   ================================================================= */
(function(){
  const svg = document.getElementById('frise-svg');
  const tooltip = document.getElementById('frise-tooltip');
  const ttType = document.getElementById('tt-type');
  const ttTitle = document.getElementById('tt-title');
  const ttDesc = document.getElementById('tt-desc');

  // Build nation lookup for connections
  const natLookup = {};
  let xCursor = ERA_AXIS_W + 20;
  const contRanges = [];

  CONTINENTS.forEach(cont => {
    const x0 = xCursor;
    cont.nations.forEach((nat, ni) => {
      nat._x = xCursor + ni * (STREAM_W + GAP);
      natLookup[nat.name] = nat;
    });
    xCursor += cont.nations.length * (STREAM_W + GAP) + CONT_GAP;
    contRanges.push({ name:cont.name, color:cont.color, x0, x1:xCursor - CONT_GAP });
  });

  const TOTAL_W = xCursor + 30;
  svg.setAttribute('width', TOTAL_W);
  svg.setAttribute('height', TOTAL_H);
  svg.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`);
  svg.classList.add('zl-1');

  // Legend
  const legend = document.getElementById('frise-legend');
  CONTINENTS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'frise-legend-item';
    d.innerHTML = `<div class="frise-legend-dot" style="background:${c.color}"></div>${c.name}`;
    legend.appendChild(d);
  });

  let s = '';

  // Defs: icons + markers
  s += `<defs>`;
  Object.entries(TYPES).forEach(([k,v]) => {
    s += `<symbol id="ico-${k}" viewBox="0 0 10 10"><path d="${v.icon}" fill="${v.c}" stroke="none"/></symbol>`;
  });
  s += `<marker id="arr-war" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10z" fill="#b03030" opacity="0.6"/></marker>`;
  s += `<marker id="arr-ally" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10z" fill="#3a7a4a" opacity="0.6"/></marker>`;
  // End markers
  s += `<symbol id="end-death" viewBox="0 0 12 12">
    <line x1="2" y1="2" x2="10" y2="10" stroke="#b03030" stroke-width="2"/>
    <line x1="10" y1="2" x2="2" y2="10" stroke="#b03030" stroke-width="2"/>
  </symbol>`;
  s += `</defs>`;

  // Era backgrounds
  ERAS.forEach(era => {
    s += `<rect x="0" y="${era.y0}" width="${TOTAL_W}" height="${era.h}" fill="${era.bg}"/>`;
    s += `<line x1="0" y1="${era.y0}" x2="${TOTAL_W}" y2="${era.y0}" stroke="rgba(100,70,20,0.12)" stroke-width="1"/>`;
  });

  // Era labels (left)
  ERAS.forEach(era => {
    const cy = era.y0 + era.h / 2;
    s += `<text x="28" y="${cy}" text-anchor="middle" dominant-baseline="middle"
           class="era-label" font-size="10" fill="rgba(80,50,10,0.35)"
           transform="rotate(-90,28,${cy})">${era.name}</text>`;
    s += `<text x="28" y="${era.y0 + 14}" text-anchor="middle"
           class="era-epoch d1" font-size="7" fill="rgba(80,50,10,0.25)">${era.epoch}</text>`;
  });

  // Continent labels (top)
  contRanges.forEach(r => {
    const cx = (r.x0 + r.x1) / 2;
    s += `<text x="${cx}" y="16" text-anchor="middle" class="cont-label"
           font-size="10" fill="${r.color}" opacity="0.8">${r.name}</text>`;
    s += `<rect x="${r.x0 - 3}" y="22" width="${r.x1 - r.x0 + 6}" height="${TOTAL_H - 22}"
           fill="${r.color}" opacity="0.025"/>`;
  });

  // Global events
  GLOBAL.forEach(g => {
    const col = TYPES[g.t]?.c || '#888';
    s += `<line x1="${ERA_AXIS_W}" y1="${g.y}" x2="${TOTAL_W}" y2="${g.y}"
           stroke="${col}" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.25" class="d1"/>`;
    s += `<text x="${ERA_AXIS_W + 6}" y="${g.y - 4}" class="evt-label d2"
           font-size="7.5" fill="${col}" opacity="0.65"
           data-type="${g.t}" data-title="${g.title.replace(/"/g,'&quot;')}"
           data-desc="${g.desc.replace(/"/g,'&quot;')}"
           style="cursor:pointer">${g.title}</text>`;
  });

  // Nation streams
  CONTINENTS.forEach(cont => {
    cont.nations.forEach(nat => {
      const bx = nat._x;
      const bw = STREAM_W;

      // Predecessors
      if (nat.predecessors) {
        nat.predecessors.forEach(p => {
          for (let i = 0; i < p.count; i++) {
            const off = (i - (p.count-1)/2) * 8;
            const px = bx + bw/2 + off;
            s += `<line x1="${px}" y1="${p.y0}" x2="${bx+bw/2}" y2="${nat.y0+20}"
                   stroke="${nat.color}" stroke-width="1.5" opacity="0.2" class="d2"/>`;
          }
          s += `<text x="${bx+bw/2}" y="${p.y0-3}" text-anchor="middle" class="evt-label d3"
                 font-size="6" fill="${nat.color}" opacity="0.5">${p.label}</text>`;
        });
      }

      // Stream: segments or simple rect
      if (nat.segments && nat.segments.length > 0) {
        // Build a path with variable width
        let pathD = '';
        nat.segments.forEach((seg, si) => {
          const w = bw * seg.w;
          const cx = bx + bw/2;
          const lx = cx - w/2;
          const rx = cx + w/2;
          if (si === 0) {
            pathD += `M${lx},${seg.y0} `;
          } else {
            const prev = nat.segments[si-1];
            const pw = bw * prev.w;
            const plx = cx - pw/2;
            // smooth transition
            pathD += `C${plx},${seg.y0-10} ${lx},${seg.y0+10} ${lx},${seg.y0} `;
          }
        });
        // Right side (bottom to top)
        for (let si = nat.segments.length - 1; si >= 0; si--) {
          const seg = nat.segments[si];
          const w = bw * seg.w;
          const cx = bx + bw/2;
          const rx = cx + w/2;
          if (si === nat.segments.length - 1) {
            const lx = cx - w/2;
            pathD += `L${lx},${seg.y1} L${rx},${seg.y1} `;
          } else {
            const next = nat.segments[si+1];
            const nw = bw * next.w;
            const nrx = cx + nw/2;
            pathD += `C${nrx},${seg.y1+10} ${rx},${seg.y1-10} ${rx},${seg.y1} `;
          }
        }
        // Close at top
        const first = nat.segments[0];
        const fw = bw * first.w;
        const fcx = bx + bw/2;
        pathD += `L${fcx + fw/2},${first.y0}Z`;

        s += `<path d="${pathD}" fill="${nat.color}" opacity="0.55"
               class="nation-stream" data-name="${nat.name}"
               data-desc="${nat.events?.[0]?.desc||''}"
               style="cursor:pointer"/>`;
      } else {
        const streamH = nat.y1 - nat.y0;
        s += `<rect x="${bx}" y="${nat.y0}" width="${bw}" height="${streamH}"
               rx="4" fill="${nat.color}" opacity="0.55"
               class="nation-stream" data-name="${nat.name}"/>`;
      }

      // End marker for destroyed nations
      if (nat.endType === 'death') {
        s += `<use href="#end-death" x="${bx+bw/2-6}" y="${nat.y1-6}" width="12" height="12" class="d1"/>`;
      }

      // Nation name label (horizontal, outside)
      const labelY = nat.y0 + 30;
      const labelX = bx + bw + 4;
      s += `<text x="${labelX}" y="${labelY}" class="nation-label d1"
             font-size="8" fill="${nat.color}" opacity="0.85"
             transform="rotate(-90,${labelX},${labelY})"
             style="pointer-events:none">${nat.name}</text>`;

      // Pulsing dot for active nations
      if (nat.y1 >= 3050) {
        s += `<circle cx="${bx+bw/2}" cy="${nat.y1-5}" r="3" fill="${nat.color}" opacity="0.8">
               <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
              </circle>`;
      }

      // Events
      let side = 1; // alternate label sides
      (nat.events || []).forEach((ev, ei) => {
        const col = TYPES[ev.t]?.c || '#888';
        const cx = bx + STREAM_W/2;
        const cy = ev.y;
        const dotX = side > 0 ? bx + bw + 3 : bx - 3;

        // Icon (visible zoom 2+)
        s += `<use href="#ico-${ev.t}" x="${dotX - 5}" y="${cy - 5}" width="10" height="10"
               class="d2 evt-dot" style="cursor:pointer"
               data-type="${ev.t}" data-title="${ev.title.replace(/"/g,'&quot;')}"
               data-desc="${ev.desc.replace(/"/g,'&quot;')}"/>`;

        // Colored dot (always visible at zoom 1+)
        s += `<circle cx="${dotX}" cy="${cy}" r="3" fill="${col}" opacity="0.85"
               stroke="#f5efe3" stroke-width="1"
               class="d1 evt-dot" style="cursor:pointer"
               data-type="${ev.t}" data-title="${ev.title.replace(/"/g,'&quot;')}"
               data-desc="${ev.desc.replace(/"/g,'&quot;')}"/>`;

        // Label (visible zoom 2+)
        const lx = side > 0 ? dotX + 8 : dotX - 8;
        const anchor = side > 0 ? 'start' : 'end';
        const truncTitle = ev.title.length > 20 ? ev.title.substring(0,19)+'…' : ev.title;
        s += `<text x="${lx}" y="${cy + 3}" text-anchor="${anchor}" class="evt-label d2"
               font-size="7" fill="${col}" opacity="0.75"
               style="pointer-events:none">${truncTitle}</text>`;

        // Full description (visible zoom 3 only)
        s += `<text x="${lx}" y="${cy + 12}" text-anchor="${anchor}" class="evt-label d3"
               font-size="6" fill="rgba(80,50,20,0.5)"
               style="pointer-events:none">${ev.desc.length > 40 ? ev.desc.substring(0,39)+'…' : ev.desc}</text>`;

        side *= -1;
      });
    });
  });

  // Connections between nations
  CONNECTIONS.forEach(conn => {
    const a = natLookup[conn.from];
    const b = natLookup[conn.to];
    if (!a || !b) return;
    const ax = a._x + STREAM_W/2;
    const bx = b._x + STREAM_W/2;
    const cy = conn.y;
    const col = TYPES[conn.type]?.c || '#888';
    const dash = conn.dashed ? 'stroke-dasharray="4,3"' : '';
    const marker = conn.type === 'conquete' ? 'marker-end="url(#arr-war)"' :
                   conn.type === 'alliance' ? 'marker-end="url(#arr-ally)"' : '';
    // Curved path
    const midY = cy - 20;
    s += `<path d="M${ax},${cy} C${ax},${midY} ${bx},${midY} ${bx},${cy}"
           class="conn-path d2" stroke="${col}" ${dash} ${marker}
           data-type="${conn.type}" data-title="${conn.label.replace(/"/g,'&quot;')}"
           data-desc="${conn.from} ↔ ${conn.to}" style="cursor:pointer"/>`;
    // Label
    const lx = (ax + bx) / 2;
    s += `<text x="${lx}" y="${midY - 3}" text-anchor="middle" class="evt-label d3"
           font-size="6" fill="${col}" opacity="0.6">${conn.label}</text>`;
  });

  svg.innerHTML = s;

  // Tooltip
  function showTip(e, el) {
    const t = el.dataset.type;
    const meta = TYPES[t] || {c:'#888',l:'?'};
    ttType.textContent = meta.l; ttType.style.color = meta.c;
    ttTitle.textContent = el.dataset.title;
    ttDesc.textContent = el.dataset.desc;
    tooltip.classList.add('visible');
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 8) + 'px';
  }
  svg.addEventListener('mousemove', e => {
    const dot = e.target.closest('.evt-dot,.conn-path');
    const stream = e.target.closest('.nation-stream');
    if (dot) showTip(e, dot);
    else if (stream) {
      ttType.textContent = ''; ttType.style.color = '';
      ttTitle.textContent = stream.dataset.name;
      ttDesc.textContent = stream.dataset.desc || '';
      tooltip.classList.add('visible');
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 8) + 'px';
    } else tooltip.classList.remove('visible');
  });
  svg.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

  // Zoom
  let zoomLevel = 1;
  document.querySelectorAll('.frise-zoom-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.frise-zoom-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const z = parseFloat(btn.dataset.zoom);
      const lvl = parseInt(btn.dataset.level);
      svg.style.width = (TOTAL_W * z) + 'px';
      svg.style.height = (TOTAL_H * z) + 'px';
      svg.className = `zl-${lvl}`;
      zoomLevel = lvl;
    });
  });
})();
</script>
