/* Connections */
const CONN = [
  {from:'Mosrack',to:'Tyndara',y:1750,t:'conquete',label:'Guerre des Cent-Jours'},
  {from:'Valoria',to:'Trinoria',y:1850,t:'conquete',label:'Invasion repoussée'},
  {from:'Tyndara',to:'Solena',y:1900,t:'alliance',label:'Routes commerciales'},

  {from:'Pyrtara',to:'Sylthara',y:1850,t:'conquete',label:'Occupation et famine'},
  {from:'Drakora',to:'Gryndor',y:1800,t:'conquete',label:'Raids et pillage'},
];

/* =================================================================
   LAYOUT ENGINE — Dynamic horizontal positioning
   ================================================================= */
(function(){
  const svg = document.getElementById('frise-svg');
  const tooltip = document.getElementById('frise-tooltip');
  const ttType = document.getElementById('tt-type');
  const ttTitle = document.getElementById('tt-title');
  const ttDesc = document.getElementById('tt-desc');

  // 1. Collect all Y breakpoints
  const bpSet = new Set([0, TOTAL_H]);
  CIV.forEach(c => { bpSet.add(c.y0); bpSet.add(c.y1); });
  const breakpoints = [...bpSet].sort((a,b) => a - b);

  // 2. At each breakpoint: find active civs, assign centered X
  // Maintain stable ordering: once a civ gets a slot, it stays in that relative position
  let order = []; // stable ordered list of active civ names
  const layout = {}; // civName -> [{y, x}]
  CIV.forEach(c => { layout[c.name] = []; });

  breakpoints.forEach(y => {
    const active = CIV.filter(c => c.y0 <= y && c.y1 >= y);
    const activeNames = new Set(active.map(c => c.name));

    // Remove dead
    order = order.filter(n => activeNames.has(n));

    // Insert new ones near continent siblings
    active.forEach(c => {
      if (!order.includes(c.name)) {
        // Find best insertion: near others from same continent
        let bestIdx = order.length;
        for (let i = 0; i < order.length; i++) {
          const existing = CIV.find(cc => cc.name === order[i]);
          if (existing && existing.cont === c.cont) {
            bestIdx = i + 1; // insert after sibling
          }
        }
        order.splice(bestIdx, 0, c.name);
      }
    });

    // Compute centered X positions
    const count = order.length;
    if (count === 0) return;

    // Get widths (with segments)
    const widths = order.map(name => {
      const civ = CIV.find(c => c.name === name);
      if (civ.segments) {
        const seg = civ.segments.find(s => y >= s.y0 && y <= s.y1);
        return seg ? SW * seg.w : SW;
      }
      return SW;
    });

    const totalW = widths.reduce((a,b) => a + b, 0) + (count - 1) * SG;
    const chartW = Math.max(totalW + MARGIN * 2, 600);
    let cursor = (chartW - totalW) / 2;

    order.forEach((name, i) => {
      layout[name].push({ y, x: cursor, w: widths[i] });
      cursor += widths[i] + SG;
    });
  });

  // Compute total width from max
  let maxW = 600;
  breakpoints.forEach(y => {
    const active = CIV.filter(c => c.y0 <= y && c.y1 >= y);
    const count = active.length;
    const w = count * (SW + SG) + MARGIN * 2;
    if (w > maxW) maxW = w;
  });
  const CHART_W = Math.max(maxW, 800);

  // Recompute with proper CHART_W
  order = [];
  CIV.forEach(c => { layout[c.name] = []; });

  breakpoints.forEach(y => {
    const active = CIV.filter(c => c.y0 <= y && c.y1 >= y);
    const activeNames = new Set(active.map(c => c.name));
    order = order.filter(n => activeNames.has(n));
    active.forEach(c => {
      if (!order.includes(c.name)) {
        let bestIdx = order.length;
        for (let i = 0; i < order.length; i++) {
          const ex = CIV.find(cc => cc.name === order[i]);
          if (ex && ex.cont === c.cont) bestIdx = i + 1;
        }
        order.splice(bestIdx, 0, c.name);
      }
    });

    const count = order.length;
    if (count === 0) return;

    const widths = order.map(name => {
      const civ = CIV.find(c => c.name === name);
      if (civ.segments) {
        const seg = civ.segments.find(s => y >= s.y0 && y <= s.y1);
        return seg ? SW * seg.w : SW;
      }
      return SW;
    });

    const totalW = widths.reduce((a,b) => a + b, 0) + (count - 1) * SG;
    let cursor = (CHART_W - totalW) / 2;

    order.forEach((name, i) => {
      layout[name].push({ y, x: cursor, w: widths[i] });
      cursor += widths[i] + SG;
    });
  });

  svg.setAttribute('width', CHART_W);
  svg.setAttribute('height', TOTAL_H);
  svg.setAttribute('viewBox', `0 0 ${CHART_W} ${TOTAL_H}`);
  svg.classList.add('zl-1');

  let s = '';

  // 3. Era backgrounds
  ERAS.forEach(era => {
    s += `<rect x="0" y="${era.y0}" width="${CHART_W}" height="${era.h}" fill="${era.bg}"/>`;
    s += `<line x1="0" y1="${era.y0}" x2="${CHART_W}" y2="${era.y0}" stroke="rgba(100,70,20,0.1)" stroke-width="1"/>`;
    const cy = era.y0 + era.h / 2;
    s += `<text x="${CHART_W / 2}" y="${era.y0 + 16}" text-anchor="middle"
           class="era-label" font-size="11" fill="rgba(80,50,10,0.2)"
           letter-spacing="3">${era.name.toUpperCase()}</text>`;
  });

  // 4. Global events (centered horizontal labels)
  GLOBAL.forEach(g => {
    const col = TYPES[g.t]?.c || '#888';
    s += `<line x1="20" y1="${g.y}" x2="${CHART_W - 20}" y2="${g.y}"
           stroke="${col}" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.2" class="d1"/>`;
    s += `<text x="${CHART_W / 2}" y="${g.y - 5}" text-anchor="middle"
           font-size="8" fill="${col}" opacity="0.55" class="d1"
           data-type="${g.t}" data-title="${g.title.replace(/"/g,'&quot;')}"
           data-desc="${g.desc.replace(/"/g,'&quot;')}"
           style="cursor:pointer">${g.title}</text>`;
  });

  // 5. Civilization streams
  const civLookup = {};
  CIV.forEach(civ => {
    const pts = layout[civ.name];
    if (!pts || pts.length < 2) return;
    civLookup[civ.name] = pts;

    // Build filled path: left edge down, right edge up
    let dL = `M${pts[0].x},${pts[0].y}`;
    let dR = `L${pts[pts.length-1].x + pts[pts.length-1].w},${pts[pts.length-1].y}`;

    for (let i = 1; i < pts.length; i++) {
      const p = pts[i-1], c = pts[i];
      const dy = (c.y - p.y) * 0.4;
      dL += ` C${p.x},${p.y+dy} ${c.x},${c.y-dy} ${c.x},${c.y}`;
    }

    dL += ` L${pts[pts.length-1].x + pts[pts.length-1].w},${pts[pts.length-1].y}`;

    for (let i = pts.length - 2; i >= 0; i--) {
      const p = pts[i+1], c = pts[i];
      const dy = (p.y - c.y) * 0.4;
      dL += ` C${p.x+p.w},${p.y-dy} ${c.x+c.w},${c.y+dy} ${c.x+c.w},${c.y}`;
    }
    dL += 'Z';

    s += `<path d="${dL}" fill="${civ.color}" opacity="0.5"
           class="stream-path" data-name="${civ.name}" data-cont="${civ.cont}"
           data-title="${civ.name}" data-desc="${civ.cont}" data-type=""
           style="cursor:pointer"/>`;

    // Dead marker
    if (civ.dead) {
      const last = pts[pts.length-1];
      const cx = last.x + last.w/2;
      s += `<line x1="${cx-5}" y1="${last.y-5}" x2="${cx+5}" y2="${last.y+5}" stroke="#b03030" stroke-width="2" class="d1"/>`;
      s += `<line x1="${cx+5}" y1="${last.y-5}" x2="${cx-5}" y2="${last.y+5}" stroke="#b03030" stroke-width="2" class="d1"/>`;
    }

    // Pulsing dot for active civs
    if (civ.y1 >= 3050) {
      const last = pts[pts.length-1];
      s += `<circle cx="${last.x + last.w/2}" cy="${last.y - 4}" r="3" fill="${civ.color}" opacity="0.8">
             <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
            </circle>`;
    }

    // Nation name — horizontal, near the start
    const nameP = pts[1] || pts[0];
    const nameX = nameP.x + nameP.w + 4;
    const nameY = civ.y0 + 12;
    s += `<text x="${nameX}" y="${nameY}" class="nation-name d1"
           font-size="8" fill="${civ.color}" opacity="0.8">${civ.name}</text>`;
    // Continent tag (small, zoom 2+)
    s += `<text x="${nameX}" y="${nameY + 10}" class="d2"
           font-size="6" fill="rgba(80,50,20,0.4)">${civ.cont}</text>`;

    // Events — horizontal labels alternating sides
    let side = 1;
    (civ.events || []).forEach(ev => {
      const col = TYPES[ev.t]?.c || '#888';
      // Find position at this Y
      let evPt = null;
      for (let i = 0; i < pts.length - 1; i++) {
        if (pts[i].y <= ev.y && pts[i+1].y >= ev.y) {
          const ratio = (ev.y - pts[i].y) / (pts[i+1].y - pts[i].y);
          evPt = {
            x: pts[i].x + (pts[i+1].x - pts[i].x) * ratio,
            w: pts[i].w + (pts[i+1].w - pts[i].w) * ratio
          };
          break;
        }
      }
      if (!evPt) evPt = { x: pts[0].x, w: pts[0].w };

      const dotX = side > 0 ? evPt.x + evPt.w + 4 : evPt.x - 4;

      // Dot (zoom 1+)
      s += `<circle cx="${dotX}" cy="${ev.y}" r="3" fill="${col}" opacity="0.8"
             stroke="#f5efe3" stroke-width="1" class="d1 evt-dot" style="cursor:pointer"
             data-type="${ev.t}" data-title="${ev.title.replace(/"/g,'&quot;')}"
             data-desc="${ev.desc.replace(/"/g,'&quot;')}"/>`;

      // Label horizontal (zoom 2+)
      const lx = side > 0 ? dotX + 6 : dotX - 6;
      const anchor = side > 0 ? 'start' : 'end';
      const trunc = ev.title.length > 22 ? ev.title.slice(0,21)+'…' : ev.title;
      s += `<text x="${lx}" y="${ev.y + 3}" text-anchor="${anchor}" class="d2"
             font-size="7" fill="${col}" opacity="0.7"
             style="pointer-events:none">${trunc}</text>`;

      // Description (zoom 3)
      s += `<text x="${lx}" y="${ev.y + 12}" text-anchor="${anchor}" class="d3"
             font-size="6" fill="rgba(80,50,20,0.45)"
             style="pointer-events:none">${ev.desc.length > 45 ? ev.desc.slice(0,44)+'…' : ev.desc}</text>`;

      side *= -1;
    });
  });

  // 6. Connections between civs
  CONN.forEach(conn => {
    const aPts = civLookup[conn.from];
    const bPts = civLookup[conn.to];
    if (!aPts || !bPts) return;

    // Find X at connection Y for each civ
    function xAt(pts, y) {
      for (let i = 0; i < pts.length - 1; i++) {
        if (pts[i].y <= y && pts[i+1].y >= y) {
          const r = (y - pts[i].y) / (pts[i+1].y - pts[i].y);
          return { x: pts[i].x + (pts[i+1].x - pts[i].x) * r, w: pts[i].w + (pts[i+1].w - pts[i].w) * r };
        }
      }
      return { x: pts[0].x, w: pts[0].w };
    }

    const a = xAt(aPts, conn.y);
    const b = xAt(bPts, conn.y);
    const ax = a.x + a.w/2;
    const bx = b.x + b.w/2;
    const col = TYPES[conn.t]?.c || '#888';
    const midY = conn.y - 15;

    s += `<path d="M${ax},${conn.y} C${ax},${midY} ${bx},${midY} ${bx},${conn.y}"
           fill="none" stroke="${col}" stroke-width="1.5" opacity="0.4"
           class="d2 evt-dot" style="cursor:pointer"
           data-type="${conn.t}" data-title="${conn.label.replace(/"/g,'&quot;')}"
           data-desc="${conn.from} ↔ ${conn.to}"/>`;
    s += `<text x="${(ax+bx)/2}" y="${midY - 3}" text-anchor="middle" class="d3"
           font-size="6" fill="${col}" opacity="0.5">${conn.label}</text>`;
  });

  svg.innerHTML = s;

  // Tooltip
  svg.addEventListener('mousemove', e => {
    const el = e.target.closest('.evt-dot,.stream-path');
    if (el) {
      const t = el.dataset.type;
      const meta = TYPES[t] || {c:'#6a5a4a',l:el.dataset.cont||''};
      ttType.textContent = meta.l; ttType.style.color = meta.c;
      ttTitle.textContent = el.dataset.title || el.dataset.name;
      ttDesc.textContent = el.dataset.desc || '';
      tooltip.classList.add('visible');
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 8) + 'px';
    } else tooltip.classList.remove('visible');
  });
  svg.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

  // Zoom
  document.querySelectorAll('.frise-zoom-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.frise-zoom-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const z = parseFloat(btn.dataset.zoom);
      const lvl = parseInt(btn.dataset.level);
      svg.style.width = (CHART_W * z) + 'px';
      svg.style.height = (TOTAL_H * z) + 'px';
      svg.className = `zl-${lvl}`;
    });
  });
})();
</script>
