// Tooltip civilisation
const civTooltip = document.getElementById('civ-tooltip');

function showCivTooltip(e, civ) {
    const y0Date = yToDateLabel(civ.y0);
    const y1Date = civ.dead ? yToDateLabel(civ.y1) : null;
    const ligneeInfo = civ.lignee && LIGNEES[civ.lignee] ? LIGNEES[civ.lignee].name : '';
    civTooltip.innerHTML = `<strong>${civ.name}</strong>${civ.reg ? `<span class="civ-tt-reg">${civ.reg}</span>` : ''}${ligneeInfo ? `<span class="civ-tt-lignee">${ligneeInfo}</span>` : ''}${civ.from ? `<span class="civ-tt-from">← ${civ.from}</span>` : ''}${civ.cont} · ${y0Date}${y1Date ? ` → ${y1Date}` : ' → présent'}${civ.dead ? ' ✝' : ''}`;
    civTooltip.classList.add('visible');
    moveCivTooltip(e);
}
function moveCivTooltip(e) {
    civTooltip.style.left = (e.clientX + 12) + 'px';
    civTooltip.style.top  = (e.clientY - 8) + 'px';
}
function hideCivTooltip() {
    civTooltip.classList.remove('visible');
}



function renderEraNav() {
    // Les liens d'ères vont dans le PANNEAU GAUCHE (#site-sidebar), pas en haut
    // de la page — cohérent avec « Dans cette branche » du lore.
    const sidebar = document.getElementById('site-sidebar');
    if (!sidebar) return;

    // Nettoie une éventuelle nav d'ères précédente.
    document.getElementById('sidebar-frise-eras')?.remove();

    const nav = document.createElement('nav');
    nav.id = 'sidebar-frise-eras';
    nav.className = 'sidebar-hub-tabs';
    nav.setAttribute('aria-label', 'Ères');
    const label = document.createElement('div');
    label.className = 'sidebar-hub-tabs-label';
    label.textContent = 'Ères';
    nav.appendChild(label);
    const ul = document.createElement('ul');
    ERAS.forEach(era => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'javascript:void(0)';
        a.dataset.eraId = era.id;
        a.textContent = `Ère ${era.num} — ${era.name}`;
        a.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById(`era-${era.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        li.appendChild(a);
        ul.appendChild(li);
    });
    nav.appendChild(ul);

    // Insère en haut du panneau, sous l'éventuelle nav de sous-onglets.
    const subtab = sidebar.querySelector('.subtab-nav');
    if (subtab && subtab.nextSibling) sidebar.insertBefore(nav, subtab.nextSibling);
    else if (subtab) sidebar.appendChild(nav);
    else sidebar.insertBefore(nav, sidebar.firstChild);

    // Retire la nav d'ères dès qu'on quitte la frise (listener global unique).
    if (!window._friseEraNavCleanup) {
        window._friseEraNavCleanup = true;
        window.addEventListener('hashchange', () => {
            if ((window.location.hash || '').slice(1).split('/')[0] !== 'frise') {
                document.getElementById('sidebar-frise-eras')?.remove();
            }
        });
    }
}

function renderLegend() {
    const legend = document.getElementById('frise-legend');
    Object.entries(TYPES).forEach(([key, type]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.dataset.typeKey = key;
        item.innerHTML = `<span class="legend-dot" style="background:${type.c}"></span>${type.l}`;
        item.addEventListener('click', () => toggleFilter(key));
        legend.appendChild(item);
    });

    document.getElementById('btn-filter-all').addEventListener('click', () => {
        const allActive = activeFilters.size === Object.keys(TYPES).length;
        if (allActive) {
            // Désactiver tout sauf catastrophe et fondation
            activeFilters.clear();
            activeFilters.add('catastrophe');
            activeFilters.add('fondation');
        } else {
            Object.keys(TYPES).forEach(k => activeFilters.add(k));
        }
        applyFilters();
    });
}

function toggleFilter(key) {
    if (activeFilters.has(key)) {
        if (activeFilters.size > 1) activeFilters.delete(key);
    } else {
        activeFilters.add(key);
    }
    applyFilters();
}

function applyFilters() {
    // Mettre à jour les légendes
    document.querySelectorAll('.legend-item').forEach(item => {
        const key = item.dataset.typeKey;
        item.classList.toggle('disabled', !activeFilters.has(key));
    });
    // Masquer/afficher les événements
    document.querySelectorAll('.event-row[data-type]').forEach(row => {
        const t = row.dataset.type;
        row.classList.toggle('hidden', !activeFilters.has(t));
    });
}


function renderCivBars(era, civs) {
    if (civs.length === 0) return '';

    const eraY0 = era.yMin;
    const eraY1 = era.yMax;
    const eraSpan = eraY1 - eraY0;

    // Group civs by lignee
    const groups = {};
    const groupOrder = [];
    civs.forEach(civ => {
        const key = civ.lignee || 'ind';
        if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
        groups[key].push(civ);
    });

    let html = `<div class="civ-section">
        <div class="civ-section-title">Civilisations actives pendant cette ère (${civs.length})</div>`;

    groupOrder.forEach(key => {
        const lignee = LIGNEES[key] || {name: key, desc: ''};
        const members = groups[key];

        html += `<div class="lignee-group">
            <div class="lignee-header">
                <span class="lignee-name">${lignee.name}</span>
                <span class="lignee-desc">${lignee.desc}</span>
            </div>
            <div class="civ-bars">`;

        members.forEach(civ => {
            const barStart = Math.max(civ.y0, eraY0);
            const barEnd   = Math.min(civ.y1, eraY1);
            const leftPct  = ((barStart - eraY0) / eraSpan * 100).toFixed(1);
            const widthPct = ((barEnd - barStart) / eraSpan * 100).toFixed(1);
            const isDead   = civ.dead || civ.y1 <= eraY1;
            const isAlive  = !civ.dead && civ.y1 > eraY1;

            const fillClass = isDead ? 'dead' : 'alive';
            const pulse = isAlive ? `<span class="civ-bar-pulse" style="background:${civ.color}"></span>` : '';
            const deadIcon = isDead && civ.dead ? '<span class="civ-dead-icon">✝</span>' : '';

            const regTag = civ.reg ? `<span class="civ-bar-regime">${civ.reg}</span>` : '';
            const fromTag = civ.from ? `<span class="civ-bar-from">← ${civ.from}</span>` : '';
            const noteTag = civ.note ? `<span class="civ-bar-note">${civ.note}</span>` : '';
            const isBranch = !!civ.from;

            html += `<div class="civ-bar-row${isBranch ? ' civ-branch' : ''}">
                <div class="civ-bar-name" title="${civ.name}${civ.reg ? ' — '+civ.reg : ''}${civ.from ? ' ← '+civ.from : ''}">${civ.name}${regTag}${fromTag}${noteTag}</div>
                <div class="civ-bar-track"
                     onmouseenter="showCivTooltip(event, ${JSON.stringify(civ).replace(/"/g, '&quot;')})"
                     onmouseleave="hideCivTooltip()"
                     onmousemove="moveCivTooltip(event)">
                    <div class="civ-bar-fill ${fillClass}"
                         style="left:${leftPct}%;width:${widthPct}%;background:${civ.color};opacity:${isDead ? 0.55 : 0.80}">
                        ${pulse}
                    </div>
                </div>
                <div class="civ-bar-cont">${civ.cont}</div>
                ${deadIcon}
            </div>`;
        });

        html += `</div></div>`;
    });

    html += `</div>`;
    return html;
}

function renderEventCard(evt, side, connMap, civName) {
    const type  = TYPES[evt.t] || { c:'#888', l: evt.t };
    const dl    = evt.dl === 2;
    const date  = yToDateLabel(evt.y);
    const conns = civName ? (connMap[`${civName}|${evt.y}`] || []) : [];

    const connHtml = conns.length > 0
        ? `<div class="event-connections">${conns.map(c => `<span class="conn-tag">${c}</span>`).join('')}</div>`
        : '';

    return `<div class="event-row ${side}${dl ? ' dl2-row' : ''}" data-type="${evt.t}">
        <div class="event-dot" style="background:${type.c}"></div>
        <div class="event-connector"></div>
        <div class="event-card${dl ? ' dl2' : ''}" onclick="toggleEventCard(this)">
            <div class="event-card-header">
                <span class="event-type-badge" style="background:${type.c}">${type.l}</span>
                <span class="event-date">${date}</span>
            </div>
            <div class="event-title">${evt.title}</div>
            <div class="event-expand-hint">▼ cliquer pour détails</div>
            <div class="event-desc">${evt.desc || ''}${connHtml}</div>
        </div>
    </div>`;
}

function toggleEventCard(card) {
    const desc = card.querySelector('.event-desc');
    const isOpen = desc.classList.toggle('open');
    card.classList.toggle('expanded', isOpen);
}

function renderFrise() {
    const connMap = buildConnMap();
    const content = document.getElementById('frise-content');
    let html = '';

    ERAS.forEach(era => {
        // Récupérer les événements globaux de cette ère
        const eraEvents = GLOBAL.filter(e => e.era === era.id);
        // Récupérer les civilisations actives
        const civs = getEraCivsForRange(era.yMin, era.yMax);

        html += `<div class="era-section" id="era-${era.id}">
            <div class="era-banner" style="background:${era.bg};border:1px solid rgba(0,0,0,0.06);">
                <div class="era-banner-num">Ère ${era.num}</div>
                <div class="era-banner-name" id="era-heading-${era.id}" style="color:${era.accent}">${era.name}</div>
                <div class="era-banner-dates">${era.dates}</div>
                <div class="era-banner-desc">${era.desc}</div>
            </div>`;

        // Barres de civilisations
        html += renderCivBars(era, civs);

        // Événements globaux
        if (eraEvents.length > 0) {
            html += `<div class="events-section">
                <div class="timeline-line"></div>`;
            eraEvents.forEach((evt, i) => {
                const side = i % 2 === 0 ? 'left' : 'right';
                html += renderEventCard(evt, side, connMap, null);
            });
            html += `</div>`;
        }

        // Événements notables des civilisations (seulement ceux de l'ère)
        const civEventsAll = [];
        civs.forEach(civ => {
            const relevantEvts = (civ.events || []).filter(e => e.y >= era.yMin && e.y <= era.yMax);
            relevantEvts.forEach(e => civEventsAll.push({ ...e, _civName: civ.name, _civColor: civ.color }));
        });
        // Trier par y
        civEventsAll.sort((a, b) => a.y - b.y);

        if (civEventsAll.length > 0) {
            html += `<div class="events-section" style="margin-top:8px;padding-top:16px;border-top:1px solid rgba(120,78,18,0.08);">
                <div style="font-family:'Raleway',sans-serif;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;padding-left:4px;">Événements des civilisations</div>
                <div class="timeline-line"></div>`;
            civEventsAll.forEach((evt, i) => {
                const side = i % 2 === 0 ? 'left' : 'right';
                const civTag = `<span style="font-family:Raleway;font-size:9px;font-weight:700;letter-spacing:0.5px;color:${evt._civColor};background:${evt._civColor}22;border-radius:3px;padding:1px 6px;margin-right:4px;">${evt._civName}</span>`;
                const type  = TYPES[evt.t] || { c:'#888', l: evt.t };
                const date  = yToDateLabel(evt.y);
                const conns = connMap[`${evt._civName}|${evt.y}`] || [];
                const connHtml = conns.length > 0
                    ? `<div class="event-connections">${conns.map(c => `<span class="conn-tag">${c}</span>`).join('')}</div>`
                    : '';
                const dl = evt.dl === 2;

                html += `<div class="event-row ${side}" data-type="${evt.t}">
                    <div class="event-dot" style="background:${type.c}"></div>
                    <div class="event-connector"></div>
                    <div class="event-card${dl ? ' dl2' : ''}" onclick="toggleEventCard(this)">
                        <div class="event-card-header">
                            ${civTag}
                            <span class="event-type-badge" style="background:${type.c}">${type.l}</span>
                            <span class="event-date">${date}</span>
                        </div>
                        <div class="event-title">${evt.title}</div>
                        <div class="event-expand-hint">▼ cliquer pour détails</div>
                        <div class="event-desc">${evt.desc || ''}${connHtml}</div>
                    </div>
                </div>`;
            });
            html += `</div>`;
        }

        html += `<div class="era-section-end"></div></div>`;
    });

    content.innerHTML = html;
}

// Intersection Observer pour mettre à jour le bouton actif
function setupEraObserver() {
    const buttons = document.querySelectorAll('#sidebar-frise-eras a');
    const sections = ERAS.map(e => document.getElementById(`era-${e.id}`));

    const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.id.replace('era-', '');
                buttons.forEach(b => b.classList.toggle('current', b.dataset.eraId === id));
            }
        });
    }, { threshold: 0.1, rootMargin: '-80px 0px -50% 0px' });

    sections.forEach(s => { if (s) obs.observe(s); });
}

// ── 1B. Year Explorer ──
(function() {
    const yearInput = document.getElementById('frise-year-input');
    const yearGoBtn = document.getElementById('frise-year-go');
    const yearMsg = document.getElementById('frise-year-msg');
    if (!yearInput || !yearGoBtn) return;

    const { mapYearToFriseY } = window.HYBELIOR_TIMELINE;

    function parseYearInput(raw) {
        raw = raw.trim();
        // Handle "An 0" or "an 0"
        if (/^an\s+/i.test(raw)) {
            const num = parseInt(raw.replace(/^an\s+/i, ''), 10);
            return isNaN(num) ? null : num;
        }
        // Handle negative numbers (av.A)
        const num = parseInt(raw, 10);
        return isNaN(num) ? null : num;
    }

    function doYearExplore() {
        const year = parseYearInput(yearInput.value);
        if (year === null) return;

        const targetY = mapYearToFriseY(year);

        // Find containing era
        let targetEra = null;
        for (const era of ERAS) {
            if (targetY >= era.yMin && targetY <= era.yMax) {
                targetEra = era;
                break;
            }
        }

        // Scroll to era section
        if (targetEra) {
            const section = document.getElementById('era-' + targetEra.id);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Highlight active civs at that year
        const activeCivs = CIV.filter(c => targetY >= c.y0 && targetY <= c.y1);
        const fills = document.querySelectorAll('.civ-bar-fill');
        let highlighted = 0;

        fills.forEach(fill => {
            const row = fill.closest('.civ-bar-row');
            if (!row) return;
            const nameEl = row.querySelector('.civ-bar-name');
            if (!nameEl) return;
            const name = nameEl.textContent.trim();
            const isActive = activeCivs.some(c => c.name === name);
            if (isActive) {
                fill.classList.add('year-highlight');
                highlighted++;
            }
        });

        // Remove glow after 3 seconds
        if (highlighted > 0) {
            setTimeout(() => {
                document.querySelectorAll('.civ-bar-fill.year-highlight').forEach(el => {
                    el.classList.remove('year-highlight');
                });
            }, 3000);
        }

        // Show message
        if (yearMsg) {
            const dateLabel = yToDateLabel(targetY);
            yearMsg.textContent = highlighted + ' civilisation' + (highlighted !== 1 ? 's' : '') + ' active' + (highlighted !== 1 ? 's' : '') + ' en ' + dateLabel;
            yearMsg.classList.add('visible');
            setTimeout(() => { yearMsg.classList.remove('visible'); }, 3000);
        }
    }

    yearGoBtn.addEventListener('click', doYearExplore);
    yearInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doYearExplore();
    });
})();

// ── 1C. Zoom Levels ──
(function() {
    const zoomBtns = document.querySelectorAll('.frise-zoom-btn');
    const friseContent = document.getElementById('frise-content');
    if (!friseContent || zoomBtns.length === 0) return;

    zoomBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const zoom = this.dataset.zoom;
            // Update active button
            zoomBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            // Update content class
            friseContent.classList.remove('zoom-collapsed', 'zoom-expanded');
            if (zoom === 'collapsed') friseContent.classList.add('zoom-collapsed');
            else if (zoom === 'expanded') friseContent.classList.add('zoom-expanded');
        });
    });
})();
</script>
