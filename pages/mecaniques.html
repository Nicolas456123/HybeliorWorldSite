<!-- Page Mécaniques : sous-onglets pilotés par NavConfig.subtabs.mecaniques -->
<div class="md-subtabs-wrapper">
    <div class="subtab-content" id="mecaniques-content"></div>
</div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.mecaniques;
    if (!cfg || !window.MdRenderer) return;
    MdRenderer.initTabs('mecaniques', null, '#mecaniques-content', cfg.tabs, cfg.defaultKey);
})();
</script>
