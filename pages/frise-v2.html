<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grande Fresque d'Hybélior</title>
<style>
/* ═══════════════════════════════════════════════════════
   GRANDE FRESQUE D'HYBÉLIOR — Museum-quality timeline
   ═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #b8860b;
  --gold-light: #d4a435;
  --gold-faint: rgba(184,134,11,0.15);
  --parchment: #f5edd8;
  --parchment-dark: #e8dcc0;
  --ink: #2a1f0e;
  --ink-muted: #6b5a3e;
  --ink-faint: rgba(42,31,14,0.08);
  --border: rgba(120,78,18,0.22);
  --border-strong: rgba(120,78,18,0.45);
  --red-alert: #8b0000;
  --shadow: 0 2px 8px rgba(42,31,14,0.15);
}

html, body {
  height: 100%;
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Raleway', 'Georgia', sans-serif;
  overflow: hidden;
}

/* ── Header ── */
#fresque-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 300;
  background: linear-gradient(to bottom, rgba(245,237,216,0.99), rgba(232,220,192,0.96));
  border-bottom: 2px solid var(--border-strong);
  backdrop-filter: blur(8px);
}

#fresque-title-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px 4px;
  border-bottom: 1px solid var(--border);
}

#fresque-title {
  font-family: 'Cinzel', 'Georgia', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 2px;
  white-space: nowrap;
}

#fresque-subtitle {
  font-size: 11px;
  color: var(--ink-muted);
  font-style: italic;
  letter-spacing: 0.4px;
}

#fresque-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 16px 6px;
  flex-wrap: wrap;
}

.ctrl-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

.ctrl-label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  font-weight: 700;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

.ctrl-btn {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.8px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: rgba(200,182,148,0.3);
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.ctrl-btn:hover { background: rgba(200,182,148,0.6); border-color: var(--border-strong); color: var(--ink); }
.ctrl-btn.active { background: rgba(122,76,10,0.18); border-color: var(--gold); color: var(--gold); }
.ctrl-btn.era-btn { font-size: 8px; padding: 2px 6px; }

#zoom-slider {
  width: 90px;
  accent-color: var(--gold);
  cursor: pointer;
}

#zoom-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  color: var(--gold);
  min-width: 32px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

#link-classic {
  font-family: 'Raleway', sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: var(--gold);
  text-decoration: none;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  margin-left: auto;
  transition: background 0.15s;
}
#link-classic:hover { background: var(--gold-faint); }

/* ── Main Viewport ── */
#fresque-outer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  cursor: grab;
  background: var(--parchment);
  user-select: none;
  -webkit-user-select: none;
}
#fresque-outer.grabbing { cursor: grabbing; }

#fresque-svg-container {
  position: absolute;
  top: 0; left: 0;
  transform-origin: top left;
  will-change: transform;
}

/* ── Tooltip ── */
#fresque-tooltip {
  position: fixed;
  z-index: 500;
  max-width: 280px;
  background: rgba(42,31,14,0.95);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 8px 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  font-size: 12px;
  color: var(--parchment);
  box-shadow: var(--shadow);
}
#fresque-tooltip.visible { opacity: 1; }
#fresque-tooltip .tt-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--gold-light);
  margin-bottom: 4px;
}
#fresque-tooltip .tt-type {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}
#fresque-tooltip .tt-desc {
  font-size: 11px;
  line-height: 1.5;
  color: rgba(245,237,216,0.85);
}
#fresque-tooltip .tt-date {
  font-size: 9px;
  color: var(--gold);
  margin-top: 4px;
  font-style: italic;
}

/* ── Minimap ── */
#minimap-wrap {
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 400;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: rgba(245,237,216,0.95);
  box-shadow: var(--shadow);
  overflow: hidden;
}
#minimap-canvas { display: block; cursor: pointer; }
#minimap-label {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  font-weight: 700;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  padding: 2px 0;
  border-bottom: 1px solid var(--border);
}

/* ── Empty state ── */
#empty-state {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 200;
  display: none;
}
#empty-state h2 {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  margin-bottom: 10px;
}
#empty-state p { color: var(--ink-muted); font-size: 14px; }
#empty-state a {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 20px;
  border: 1px solid var(--gold);
  border-radius: 4px;
  color: var(--gold);
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="fresque-header">
  <div id="fresque-title-bar">
    <div>
      <div id="fresque-title">GRANDE FRESQUE D'HYBÉLIOR</div>
      <div id="fresque-subtitle">Chronique universelle · Du Vide au Monde Actuel (8 ères canoniques)</div>
    </div>
    <a id="link-classic" href="#frise">← Vue classique</a>
  </div>
  <div id="fresque-controls">
    <span class="ctrl-label">Zoom</span>
    <input type="range" id="zoom-slider" min="20" max="400" value="100" step="5">
    <span id="zoom-label">1.0×</span>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Ères</span>
    <div id="era-nav"></div>
    <div class="ctrl-sep"></div>
    <button class="ctrl-btn active" id="btn-labels">Étiquettes</button>
    <button class="ctrl-btn active" id="btn-minor">Civs mineures</button>
    <button class="ctrl-btn active" id="btn-conn">Connexions</button>
    <button class="ctrl-btn active" id="btn-global">Événements</button>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Continents</span>
    <div id="cont-nav"></div>
  </div>
</div>

<div id="fresque-outer">
  <div id="fresque-svg-container">
    <svg id="fresque-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div id="fresque-tooltip">
  <div class="tt-type" id="tt-type"></div>
  <div class="tt-title" id="tt-title"></div>
  <div class="tt-desc" id="tt-desc"></div>
  <div class="tt-date" id="tt-date"></div>
</div>

<div id="minimap-wrap">
  <div id="minimap-label">Vue d'ensemble</div>
  <canvas id="minimap-canvas" width="200" height="100"></canvas>
</div>

<div id="empty-state">
  <h2>Données non chargées</h2>
  <p>Visitez d'abord la Frise Classique pour charger les civilisations.</p>
  <a href="#frise">Ouvrir la Frise Classique</a>
</div>

<script>
(function() {
'use strict';

/* ═══════════════════════════════════════════════════════
   CONSTANTS & CONFIG
   ═══════════════════════════════════════════════════════ */
const HEADER_H = () => document.getElementById('fresque-header').offsetHeight;
const Y_MAX = 3160;
const LEFT_SIDEBAR = 110; // px for continent labels
const ROW_H_MAJOR = 20;   // px height for civs with 3+ events
const ROW_H_MINOR = 12;   // px for minor civs
const ROW_GAP = 3;
const GROUP_GAP = 12;
const RULER_H = 32;
const GLOBAL_TRACK_H = 22;
const PADDING_TOP = RULER_H + GLOBAL_TRACK_H;
const PX_PER_Y = 3.5;     // base scale: timeline units → px

/* ═══════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════ */
let zoom = 1.0;
let panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, panAtDragX = 0, panAtDragY = 0;
let showLabels = true, showMinor = true, showConn = true, showGlobal = true;
let filterCont = null;
let svgWidth = 0, svgHeight = 0;
let groupData = [];   // computed layout groups
let civLayout = {};   // civId → {x, y, w, h, row}
let tooltip = null;

/* ═══════════════════════════════════════════════════════
   DATA ACCESS
   ═══════════════════════════════════════════════════════ */
function getData() {
  return window.HYBELIOR_TIMELINE || null;
}

function yToPx(y) {
  return LEFT_SIDEBAR + y * PX_PER_Y;
}

function pxToY(px) {
  return (px - LEFT_SIDEBAR) / PX_PER_Y;
}

/* ═══════════════════════════════════════════════════════
   SVG HELPERS
   ═══════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function elText(tag, attrs, text, parent) {
  const e = el(tag, attrs, parent);
  e.textContent = text;
  return e;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ═══════════════════════════════════════════════════════
   LAYOUT COMPUTATION
   ═══════════════════════════════════════════════════════ */
function computeLayout(data) {
  const { CIV } = data;
  if (!CIV || CIV.length === 0) return null;

  // Group civs by continent
  const continents = {};
  for (const civ of CIV) {
    const cont = civ.cont || 'Inconnu';
    if (!continents[cont]) continents[cont] = [];
    continents[cont].push(civ);
  }

  // Sort continents by number of civs descending
  const contOrder = Object.keys(continents).sort((a, b) => continents[b].length - continents[a].length);

  // Assign row positions
  groupData = [];
  let currentRow = 0;

  for (const cont of contOrder) {
    const civs = continents[cont].slice().sort((a, b) => (a.y0 || 0) - (b.y0 || 0));
    const groupStart = currentRow;

    const rows = [];
    for (const civ of civs) {
      const isMajor = (civ.events && civ.events.length >= 3);
      const h = isMajor ? ROW_H_MAJOR : ROW_H_MINOR;
      const rowY = PADDING_TOP + currentRow * (Math.max(ROW_H_MAJOR, ROW_H_MINOR) + ROW_GAP);
      civLayout[civ.name] = { rowY, h, isMajor, civ };
      rows.push({ civ, rowY, h });
      currentRow++;
    }

    groupData.push({
      cont, civs, rows,
      startRow: groupStart,
      endRow: currentRow - 1,
      topY: rows[0]?.rowY ?? 0,
      botY: (rows[rows.length-1]?.rowY ?? 0) + (rows[rows.length-1]?.h ?? 0),
    });

    currentRow += Math.ceil(GROUP_GAP / (ROW_H_MAJOR + ROW_GAP));
  }

  const totalRows = currentRow;
  svgHeight = PADDING_TOP + totalRows * (ROW_H_MAJOR + ROW_GAP) + GROUP_GAP * 2;
  svgWidth = yToPx(Y_MAX) + 60;

  return groupData;
}

/* ═══════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════ */
function render() {
  const data = getData();
  const svg = document.getElementById('fresque-svg');
  svg.innerHTML = '';

  if (!data || !data.CIV || data.CIV.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    return;
  }
  document.getElementById('empty-state').style.display = 'none';

  civLayout = {};
  computeLayout(data);

  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);
  svg.setAttribute('xmlns', NS);

  // Definitions (patterns, gradients)
  renderDefs(svg, data);

  // Background
  el('rect', { x: 0, y: 0, width: svgWidth, height: svgHeight, fill: '#f5edd8' }, svg);

  // Era bands (full height vertical)
  renderEraBands(svg, data);

  // Grid lines at date ticks
  renderGrid(svg, data);

  // Continent groups + civ bars
  renderContinents(svg, data);

  // Connection lines
  if (showConn) renderConnections(svg, data);

  // Global events (full-height markers)
  if (showGlobal) renderGlobalEvents(svg, data);

  // Date ruler (top, after everything so it's on top)
  renderRuler(svg, data);

  // Global event track (top band)
  renderGlobalTrack(svg, data);

  // Left sidebar overlay (continent labels sticky feel via redraw)
  renderSidebar(svg, data);

  // Update minimap
  requestAnimationFrame(drawMinimap);
}

/* ── Defs ── */
function renderDefs(svg, data) {
  const defs = el('defs', {}, svg);

  // Cross-hatch pattern for dead civs
  const pat = el('pattern', {
    id: 'dead-hatch', patternUnits: 'userSpaceOnUse',
    width: 6, height: 6,
    patternTransform: 'rotate(45)'
  }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'rgba(0,0,0,0.18)', 'stroke-width': 1.5 }, pat);

  // Parchment texture overlay gradient
  const paperGrad = el('linearGradient', { id: 'paper-grad', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el('stop', { offset: '0%', 'stop-color': '#f8f0de', 'stop-opacity': 0.6 }, paperGrad);
  el('stop', { offset: '100%', 'stop-color': '#ede0c4', 'stop-opacity': 0.3 }, paperGrad);

  // Era gradients
  for (const era of data.ERAS) {
    const gid = `era-grad-${era.id}`;
    const grad = el('linearGradient', { id: gid, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    el('stop', { offset: '0%', 'stop-color': era.color, 'stop-opacity': 0.04 }, grad);
    el('stop', { offset: '50%', 'stop-color': era.color, 'stop-opacity': 0.07 }, grad);
    el('stop', { offset: '100%', 'stop-color': era.color, 'stop-opacity': 0.03 }, grad);
  }
}

/* ── Era Bands ── */
function renderEraBands(svg, data) {
  const g = el('g', { id: 'era-bands' }, svg);

  for (const era of data.ERAS) {
    const x1 = yToPx(era.yMin);
    const x2 = yToPx(era.yMax);
    const w = x2 - x1;

    // Band fill
    el('rect', {
      x: x1, y: 0, width: w, height: svgHeight,
      fill: `url(#era-grad-${era.id})`
    }, g);

    // Watermark text (large, vertical, very faint)
    const tx = x1 + w / 2;
    const ty = svgHeight * 0.5;
    const txt = el('text', {
      x: tx, y: ty,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      'font-family': 'Cinzel, Georgia, serif',
      'font-size': Math.min(w * 0.12, 80),
      'font-weight': '900',
      fill: era.color,
      'fill-opacity': 0.055,
      'pointer-events': 'none',
      transform: `rotate(-90, ${tx}, ${ty})`
    }, g);
    txt.textContent = era.name.toUpperCase();

    // Right border (golden rule)
    if (era.id !== 'actuel') {
      el('line', {
        x1: x2, y1: 0, x2: x2, y2: svgHeight,
        stroke: '#b8860b', 'stroke-width': 0.8, 'stroke-opacity': 0.35,
        'stroke-dasharray': '4,4'
      }, g);
    }
  }
}

/* ── Grid Lines ── */
function renderGrid(svg, data) {
  const g = el('g', { id: 'grid', opacity: 0.5 }, svg);
  for (const tick of data.DATE_TICKS) {
    const x = yToPx(tick.y);
    el('line', {
      x1: x, y1: PADDING_TOP, x2: x, y2: svgHeight,
      stroke: 'rgba(120,78,18,0.08)', 'stroke-width': 0.5
    }, g);
  }
}

/* ── Date Ruler ── */
function renderRuler(svg, data) {
  const g = el('g', { id: 'ruler' }, svg);

  // Ruler background
  el('rect', {
    x: LEFT_SIDEBAR, y: 0, width: svgWidth - LEFT_SIDEBAR, height: RULER_H,
    fill: 'rgba(245,237,216,0.97)'
  }, g);

  // Bottom border
  el('line', {
    x1: LEFT_SIDEBAR, y1: RULER_H, x2: svgWidth, y2: RULER_H,
    stroke: '#b8860b', 'stroke-width': 1, 'stroke-opacity': 0.4
  }, g);

  for (const tick of data.DATE_TICKS) {
    const x = yToPx(tick.y);
    const isMajor = tick.y === 0 || tick.y === 800 || tick.y === 150 ||
                    tick.y === 300 || tick.y === 960 || tick.y === 1560 || tick.y === 2560;
    const tickH = isMajor ? 12 : 7;

    // Tick line
    el('line', {
      x1: x, y1: RULER_H - tickH, x2: x, y2: RULER_H,
      stroke: '#b8860b', 'stroke-width': isMajor ? 1.5 : 0.8, 'stroke-opacity': isMajor ? 0.7 : 0.4
    }, g);

    // Label
    const labelEl = el('text', {
      x: x + 2, y: RULER_H - tickH - 2,
      'text-anchor': 'start',
      'dominant-baseline': 'auto',
      'font-family': 'Cinzel, Georgia, serif',
      'font-size': isMajor ? 8 : 7,
      'font-weight': isMajor ? '700' : '400',
      fill: isMajor ? '#8b6914' : '#a08040',
      'fill-opacity': isMajor ? 0.9 : 0.65,
      'pointer-events': 'none',
      transform: `rotate(-50, ${x + 2}, ${RULER_H - tickH - 2})`
    }, g);
    labelEl.textContent = tick.label;
  }
}

/* ── Global Events Track ── */
function renderGlobalTrack(svg, data) {
  const g = el('g', { id: 'global-track' }, svg);
  const trackY = RULER_H;

  el('rect', {
    x: LEFT_SIDEBAR, y: trackY, width: svgWidth - LEFT_SIDEBAR, height: GLOBAL_TRACK_H,
    fill: 'rgba(245,237,216,0.95)'
  }, g);

  el('line', {
    x1: LEFT_SIDEBAR, y1: trackY + GLOBAL_TRACK_H, x2: svgWidth, y2: trackY + GLOBAL_TRACK_H,
    stroke: 'rgba(120,78,18,0.15)', 'stroke-width': 0.8
  }, g);

  if (!showGlobal) return;

  const types = data.TYPES || {};
  const placed = []; // track label x positions to avoid overlap

  for (const ev of (data.GLOBAL || [])) {
    const x = yToPx(ev.y);
    const isCata = ev.t === 'catastrophe';
    const isDl2 = ev.dl === 2;
    const typeColor = types[ev.t]?.c || '#8b6914';

    const dotR = isCata ? 5 : isDl2 ? 3 : 4;

    // Diamond marker in track
    const diamond = el('polygon', {
      points: `${x},${trackY+2} ${x+dotR},${trackY+GLOBAL_TRACK_H/2} ${x},${trackY+GLOBAL_TRACK_H-2} ${x-dotR},${trackY+GLOBAL_TRACK_H/2}`,
      fill: typeColor,
      'fill-opacity': isDl2 ? 0.5 : 0.9,
      stroke: isCata ? '#8b0000' : 'none',
      'stroke-width': 1,
      cursor: 'pointer',
      'data-ev': JSON.stringify({title: ev.title, type: ev.t, desc: ev.desc, y: ev.y})
    }, g);

    addTooltipEvents(diamond, { title: ev.title, type: ev.t, desc: ev.desc, y: ev.y }, data);
  }
}

/* ── Global Full-Height Event Lines ── */
function renderGlobalEvents(svg, data) {
  const g = el('g', { id: 'global-events' }, svg);
  const types = data.TYPES || {};

  // Sort by priority: catastrophe first, then non-dl2
  const evs = (data.GLOBAL || []).slice().sort((a, b) => {
    if (a.t === 'catastrophe' && b.t !== 'catastrophe') return -1;
    if (b.t === 'catastrophe' && a.t !== 'catastrophe') return 1;
    return 0;
  });

  for (const ev of evs) {
    const isCata = ev.t === 'catastrophe';
    const isDl2 = ev.dl === 2;
    if (isDl2 && !showLabels) continue;

    const x = yToPx(ev.y);
    const typeColor = types[ev.t]?.c || '#8b6914';

    // Full-height line
    const lineAttrs = {
      x1: x, y1: PADDING_TOP, x2: x, y2: svgHeight,
      'stroke-width': isCata ? 1.2 : 0.6,
      'stroke-opacity': isCata ? 0.55 : isDl2 ? 0.15 : 0.28,
    };
    if (isCata) {
      lineAttrs.stroke = '#8b0000';
      lineAttrs['stroke-dasharray'] = '6,3';
    } else {
      lineAttrs.stroke = typeColor;
      lineAttrs['stroke-dasharray'] = isDl2 ? '2,4' : 'none';
    }
    el('line', lineAttrs, g);

    // Label banner for major events
    if (showLabels && !isDl2) {
      const labelY = PADDING_TOP + 6;
      const textEl = el('text', {
        x: x + 3, y: labelY,
        'text-anchor': 'start',
        'dominant-baseline': 'hanging',
        'font-family': 'Cinzel, Georgia, serif',
        'font-size': isCata ? 7.5 : 7,
        'font-weight': isCata ? '700' : '600',
        fill: isCata ? '#8b0000' : typeColor,
        'fill-opacity': isCata ? 0.85 : 0.7,
        'pointer-events': 'none',
        transform: `rotate(90, ${x + 3}, ${labelY})`
      }, g);
      textEl.textContent = ev.title;
    }
  }
}

/* ── Continents & Civ Bars ── */
function renderContinents(svg, data) {
  const types = data.TYPES || {};
  const mainG = el('g', { id: 'continents' }, svg);

  for (const group of groupData) {
    if (filterCont && group.cont !== filterCont) continue;

    const groupG = el('g', { 'data-cont': group.cont }, mainG);

    // Continent separator line
    if (group !== groupData[0]) {
      el('line', {
        x1: LEFT_SIDEBAR, y1: group.topY - GROUP_GAP/2,
        x2: svgWidth, y2: group.topY - GROUP_GAP/2,
        stroke: 'rgba(120,78,18,0.12)', 'stroke-width': 0.8
      }, groupG);
    }

    // Render each civ
    for (const { civ, rowY, h } of group.rows) {
      if (!showMinor && !civ.events?.length) continue;

      const x0 = yToPx(civ.y0 ?? 0);
      const x1 = yToPx(civ.y1 ?? Y_MAX);
      const w = Math.max(x1 - x0, 4);
      const isDead = !!civ.dead;
      const isMajor = civ.events && civ.events.length >= 3;
      const baseColor = civ.color || '#8b6914';
      const alpha = isDead ? 0.45 : 0.72;

      // Civ bar
      const civRect = el('rect', {
        x: x0, y: rowY, width: w, height: h,
        rx: 3, ry: 3,
        fill: hexToRgba(baseColor, alpha),
        stroke: baseColor,
        'stroke-width': isMajor ? 0.8 : 0.4,
        'stroke-opacity': 0.6,
        cursor: 'pointer',
      }, groupG);

      addTooltipEvents(civRect, {
        title: civ.name,
        type: civ.cont,
        desc: `${civ.reg || ''} · ${civ.dead ? 'Disparue' : 'Active'}`,
        y: civ.y0,
        y1: civ.y1,
        data: civ
      }, data, true);

      // Dead hatch overlay at end
      if (isDead && w > 20) {
        const deadW = Math.min(30, w * 0.25);
        el('rect', {
          x: x1 - deadW, y: rowY, width: deadW, height: h,
          rx: 3, ry: 3,
          fill: 'url(#dead-hatch)',
          'fill-opacity': 0.4,
          'pointer-events': 'none'
        }, groupG);
      }

      // Civ name label on bar
      if (showLabels && w > 40 && isMajor) {
        const labelX = Math.max(x0 + 4, LEFT_SIDEBAR + 4);
        const fontSize = h >= ROW_H_MAJOR ? 8 : 6.5;
        const nameEl = el('text', {
          x: labelX, y: rowY + h/2,
          'dominant-baseline': 'middle',
          'font-family': 'Raleway, sans-serif',
          'font-size': fontSize,
          'font-weight': '700',
          fill: isDead ? 'rgba(42,31,14,0.55)' : 'rgba(42,31,14,0.8)',
          'pointer-events': 'none',
          'clip-path': `inset(0 0 0 ${labelX - x0}px)`
        }, groupG);
        nameEl.textContent = civ.name;
        // Clip to bar width
        nameEl.setAttribute('textLength', Math.min(civ.name.length * fontSize * 0.6, w - 8));
        nameEl.setAttribute('lengthAdjust', 'spacingAndGlyphs');
      } else if (showLabels && w > 14 && !isMajor && h >= 10) {
        const nameEl = el('text', {
          x: x0 + w/2, y: rowY + h/2,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-family': 'Raleway, sans-serif',
          'font-size': 6,
          'font-weight': '600',
          fill: 'rgba(42,31,14,0.65)',
          'pointer-events': 'none',
        }, groupG);
        nameEl.textContent = civ.name;
      }

      // Events on the bar
      renderCivEvents(groupG, civ, rowY, h, data);
    }
  }
}

/* ── Civ Event Markers ── */
function renderCivEvents(parent, civ, rowY, barH, data) {
  const types = data.TYPES || {};
  if (!civ.events || civ.events.length === 0) return;

  for (const ev of civ.events) {
    const x = yToPx(ev.y ?? 0);
    const typeColor = types[ev.t]?.c || '#8b6914';
    const isDl2 = ev.dl === 2;
    const r = barH >= ROW_H_MAJOR ? (isDl2 ? 2.5 : 3.5) : 2;
    const cy = rowY + barH / 2;

    // Diamond marker
    const pts = `${x},${cy-r} ${x+r},${cy} ${x},${cy+r} ${x-r},${cy}`;
    const marker = el('polygon', {
      points: pts,
      fill: typeColor,
      stroke: 'rgba(245,237,216,0.7)',
      'stroke-width': 0.5,
      'fill-opacity': isDl2 ? 0.6 : 1,
      cursor: 'pointer',
    }, parent);

    addTooltipEvents(marker, {
      title: ev.title || ev.t,
      type: ev.t,
      desc: ev.desc || '',
      y: ev.y,
      civ: civ.name
    }, data);

    // Label for major events
    if (showLabels && !isDl2 && barH >= ROW_H_MAJOR) {
      const labelEl = el('text', {
        x: x + 2, y: rowY - 1,
        'text-anchor': 'start',
        'dominant-baseline': 'auto',
        'font-family': 'Raleway, sans-serif',
        'font-size': 6.5,
        'font-weight': '600',
        fill: typeColor,
        'fill-opacity': 0.8,
        'pointer-events': 'none',
        transform: `rotate(-45, ${x + 2}, ${rowY - 1})`
      }, parent);
      const shortTitle = (ev.title || '').substring(0, 24);
      labelEl.textContent = shortTitle;
    }
  }
}

/* ── Connection Lines ── */
function renderConnections(svg, data) {
  const g = el('g', { id: 'connections', opacity: 0.7 }, svg);
  const types = data.TYPES || {};

  if (!data.CONN) return;

  for (const conn of data.CONN) {
    const fromLayout = civLayout[conn.from];
    const toLayout = civLayout[conn.to];
    if (!fromLayout || !toLayout) continue;

    const typeColor = types[conn.t]?.c || '#8b6914';
    const connY = conn.y ?? 0;
    const x = yToPx(connY);

    const fromMidY = fromLayout.rowY + fromLayout.h / 2;
    const toMidY = toLayout.rowY + toLayout.h / 2;

    // Bezier curve connecting the two civ rows at the connection point
    const ctrlOffset = Math.abs(toMidY - fromMidY) * 0.4;
    const path = `M ${x} ${fromMidY} C ${x + ctrlOffset} ${fromMidY}, ${x + ctrlOffset} ${toMidY}, ${x} ${toMidY}`;

    const isConqete = conn.t === 'conquete';
    const isAlliance = conn.t === 'alliance';

    const pathEl = el('path', {
      d: path,
      fill: 'none',
      stroke: typeColor,
      'stroke-width': isConqete ? 1.5 : 1,
      'stroke-opacity': 0.65,
      'stroke-dasharray': isConqete ? '4,2' : isAlliance ? '2,3' : 'none',
      cursor: 'pointer'
    }, g);

    if (conn.label) {
      addTooltipEvents(pathEl, {
        title: conn.label,
        type: conn.t,
        desc: `${conn.from} → ${conn.to}`,
        y: connY
      }, data);
    }

    // Arrow head
    const arrowSize = 4;
    const arrowPts = `${x},${toMidY - arrowSize} ${x + arrowSize},${toMidY} ${x},${toMidY + arrowSize}`;
    el('polygon', {
      points: arrowPts,
      fill: typeColor,
      'fill-opacity': 0.7,
      'pointer-events': 'none'
    }, g);
  }
}

/* ── Left Sidebar (continent labels, fixed-ish via SVG) ── */
function renderSidebar(svg, data) {
  const g = el('g', { id: 'sidebar' }, svg);

  // Sidebar background
  el('rect', {
    x: 0, y: 0, width: LEFT_SIDEBAR, height: svgHeight,
    fill: 'rgba(245,237,216,0.97)'
  }, g);

  // Right border
  el('line', {
    x1: LEFT_SIDEBAR, y1: 0, x2: LEFT_SIDEBAR, y2: svgHeight,
    stroke: '#b8860b', 'stroke-width': 1, 'stroke-opacity': 0.3
  }, g);

  for (const group of groupData) {
    if (filterCont && group.cont !== filterCont) continue;

    const midY = (group.topY + group.botY) / 2;
    const bandH = group.botY - group.topY;

    // Colored left accent bar
    const accentColor = group.rows[0]?.civ?.color || '#8b6914';
    el('rect', {
      x: 0, y: group.topY, width: 3, height: bandH,
      fill: accentColor, 'fill-opacity': 0.6
    }, g);

    // Continent name
    const nameEl = el('text', {
      x: LEFT_SIDEBAR - 6, y: midY,
      'text-anchor': 'end',
      'dominant-baseline': 'middle',
      'font-family': 'Cinzel, Georgia, serif',
      'font-size': Math.min(10, bandH * 0.12),
      'font-weight': '700',
      fill: '#6b5a3e',
      'pointer-events': 'none'
    }, g);
    nameEl.textContent = group.cont;

    // Civ count
    const countEl = el('text', {
      x: LEFT_SIDEBAR - 6, y: midY + 12,
      'text-anchor': 'end',
      'dominant-baseline': 'middle',
      'font-family': 'Raleway, sans-serif',
      'font-size': 8,
      fill: accentColor,
      'fill-opacity': 0.7,
      'pointer-events': 'none'
    }, g);
    countEl.textContent = `${group.civs.length} civ.`;
  }

  // Ruler corner (top-left background)
  el('rect', {
    x: 0, y: 0, width: LEFT_SIDEBAR, height: PADDING_TOP,
    fill: 'rgba(245,237,216,0.99)'
  }, g);

  // "FRESQUE" corner label
  const cornerEl = el('text', {
    x: LEFT_SIDEBAR / 2, y: PADDING_TOP / 2,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    'font-family': 'Cinzel, Georgia, serif',
    'font-size': 8,
    'font-weight': '700',
    fill: '#b8860b',
    'fill-opacity': 0.6,
    'pointer-events': 'none'
  }, g);
  cornerEl.textContent = 'CIVILISATIONS';

  // Era labels in ruler area at continent label side
  el('rect', {
    x: 0, y: 0, width: LEFT_SIDEBAR, height: RULER_H,
    fill: 'rgba(245,237,216,0.99)'
  }, g);

  el('line', {
    x1: 0, y1: RULER_H, x2: LEFT_SIDEBAR, y2: RULER_H,
    stroke: '#b8860b', 'stroke-width': 1, 'stroke-opacity': 0.4
  }, g);
}

/* ═══════════════════════════════════════════════════════
   TOOLTIP
   ═══════════════════════════════════════════════════════ */
function addTooltipEvents(el, info, data, isCiv) {
  el.addEventListener('mouseenter', (e) => showTooltip(e, info, data, isCiv));
  el.addEventListener('mousemove', (e) => moveTooltip(e));
  el.addEventListener('mouseleave', hideTooltip);
}

function showTooltip(e, info, data, isCiv) {
  const tt = document.getElementById('fresque-tooltip');
  const types = data.TYPES || {};
  const TL = data;

  let typeLabel = types[info.type]?.l || info.type || '';
  let dateStr = '';

  if (info.y !== undefined) {
    try { dateStr = TL.yToDateLabel ? TL.yToDateLabel(info.y) : ''; } catch(ex) {}
    if (!dateStr && TL.DATE_TICKS) {
      // fallback: find closest tick
      let best = TL.DATE_TICKS[0];
      for (const t of TL.DATE_TICKS) {
        if (Math.abs(t.y - info.y) < Math.abs(best.y - info.y)) best = t;
      }
      dateStr = best.label;
    }
  }

  if (isCiv && info.data) {
    const civ = info.data;
    const y0Label = TL.DATE_TICKS ? (() => { let b = TL.DATE_TICKS[0]; for (const t of TL.DATE_TICKS) if (Math.abs(t.y-(civ.y0||0)) < Math.abs(b.y-(civ.y0||0))) b = t; return b.label; })() : '';
    const y1Label = TL.DATE_TICKS ? (() => { let b = TL.DATE_TICKS[0]; for (const t of TL.DATE_TICKS) if (Math.abs(t.y-(civ.y1||Y_MAX)) < Math.abs(b.y-(civ.y1||Y_MAX))) b = t; return b.label; })() : '';
    typeLabel = civ.cont || '';
    dateStr = `${y0Label} → ${y1Label}`;
  }

  document.getElementById('tt-type').textContent = typeLabel;
  document.getElementById('tt-title').textContent = info.title || '';
  document.getElementById('tt-desc').textContent = info.desc || '';
  document.getElementById('tt-date').textContent = dateStr;

  if (info.civ) {
    document.getElementById('tt-type').textContent += ` · ${info.civ}`;
  }

  tt.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById('fresque-tooltip');
  const x = e.clientX + 14;
  const y = e.clientY + 14;
  const maxX = window.innerWidth - tt.offsetWidth - 10;
  const maxY = window.innerHeight - tt.offsetHeight - 10;
  tt.style.left = Math.min(x, maxX) + 'px';
  tt.style.top = Math.min(y, maxY) + 'px';
}

function hideTooltip() {
  document.getElementById('fresque-tooltip').classList.remove('visible');
}

/* ═══════════════════════════════════════════════════════
   MINIMAP
   ═══════════════════════════════════════════════════════ */
function drawMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  const cw = canvas.width, ch = canvas.height;
  const data = getData();
  if (!data) return;

  ctx.clearRect(0, 0, cw, ch);

  // Background
  ctx.fillStyle = '#f5edd8';
  ctx.fillRect(0, 0, cw, ch);

  // Era bands
  const scaleX = cw / svgWidth;
  const scaleY = ch / Math.max(svgHeight, 1);

  for (const era of data.ERAS) {
    const x1 = yToPx(era.yMin) * scaleX;
    const x2 = yToPx(era.yMax) * scaleX;
    ctx.fillStyle = hexToRgbaStr(era.color, 0.15);
    ctx.fillRect(x1, 0, x2 - x1, ch);
  }

  // Civ bars
  for (const group of groupData) {
    for (const { civ, rowY, h } of group.rows) {
      const x0 = yToPx(civ.y0 ?? 0) * scaleX;
      const x1 = yToPx(civ.y1 ?? Y_MAX) * scaleX;
      const y = rowY * scaleY;
      const barH = Math.max(h * scaleY, 1);
      ctx.fillStyle = hexToRgbaStr(civ.color || '#8b6914', 0.6);
      ctx.fillRect(x0, y, Math.max(x1 - x0, 1), barH);
    }
  }

  // Global catastrophes
  for (const ev of (data.GLOBAL || [])) {
    if (ev.t !== 'catastrophe') continue;
    const x = yToPx(ev.y) * scaleX;
    ctx.strokeStyle = 'rgba(139,0,0,0.5)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, ch);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Viewport rectangle
  const outer = document.getElementById('fresque-outer');
  const vw = outer.clientWidth;
  const vh = outer.clientHeight - HEADER_H();

  const vpX = (-panX / zoom) * scaleX;
  const vpY = ((-panY + HEADER_H()) / zoom) * scaleY;
  const vpW = (vw / zoom) * scaleX;
  const vpH = (vh / zoom) * scaleY;

  ctx.strokeStyle = 'rgba(184,134,11,0.8)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  ctx.strokeRect(Math.max(0, vpX), Math.max(0, vpY), Math.min(vpW, cw), Math.min(vpH, ch));
}

function hexToRgbaStr(hex, alpha) {
  if (!hex || hex[0] !== '#') return `rgba(139,134,11,${alpha})`;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ═══════════════════════════════════════════════════════
   VIEWPORT TRANSFORM
   ═══════════════════════════════════════════════════════ */
function applyTransform() {
  const container = document.getElementById('fresque-svg-container');
  const hh = HEADER_H();
  container.style.transform = `translate(${panX}px, ${panY + hh}px) scale(${zoom})`;
  drawMinimap();
}

function clampPan() {
  const outer = document.getElementById('fresque-outer');
  const hh = HEADER_H();
  const vw = outer.clientWidth;
  const vh = outer.clientHeight - hh;
  const scaledW = svgWidth * zoom;
  const scaledH = svgHeight * zoom;

  const minX = Math.min(0, vw - scaledW);
  const minY = Math.min(0, vh - scaledH) - hh;
  panX = Math.max(minX, Math.min(0, panX));
  panY = Math.max(minY, Math.min(0, panY));
}

/* ═══════════════════════════════════════════════════════
   CONTROLS SETUP
   ═══════════════════════════════════════════════════════ */
function setupEraNav(data) {
  const nav = document.getElementById('era-nav');
  nav.innerHTML = '';
  for (const era of data.ERAS) {
    const btn = document.createElement('button');
    btn.className = 'ctrl-btn era-btn';
    btn.textContent = `${era.num} · ${era.name}`;
    btn.title = era.dates;
    btn.addEventListener('click', () => {
      const x = -(yToPx(era.yMin) * zoom);
      panX = x;
      clampPan();
      applyTransform();
    });
    nav.appendChild(btn);
  }
}

function setupContNav(data) {
  const nav = document.getElementById('cont-nav');
  nav.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'ctrl-btn active';
  allBtn.textContent = 'Tous';
  allBtn.addEventListener('click', () => {
    filterCont = null;
    nav.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
    render();
  });
  nav.appendChild(allBtn);

  const conts = [...new Set((data.CIV || []).map(c => c.cont).filter(Boolean))].sort();
  for (const cont of conts) {
    const btn = document.createElement('button');
    btn.className = 'ctrl-btn';
    btn.textContent = cont;
    btn.addEventListener('click', () => {
      filterCont = filterCont === cont ? null : cont;
      nav.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
      (filterCont ? btn : allBtn).classList.add('active');
      render();
    });
    nav.appendChild(btn);
  }
}

function setupToggles() {
  function setupToggle(id, getter, setter) {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      setter(!getter());
      btn.classList.toggle('active', getter());
      render();
    });
  }

  setupToggle('btn-labels',
    () => showLabels,
    v => { showLabels = v; }
  );
  setupToggle('btn-minor',
    () => showMinor,
    v => { showMinor = v; }
  );
  setupToggle('btn-conn',
    () => showConn,
    v => { showConn = v; }
  );
  setupToggle('btn-global',
    () => showGlobal,
    v => { showGlobal = v; }
  );
}

/* ═══════════════════════════════════════════════════════
   INTERACTION: PAN & ZOOM
   ═══════════════════════════════════════════════════════ */
function setupInteraction() {
  const outer = document.getElementById('fresque-outer');

  // Mouse drag pan
  outer.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panAtDragX = panX;
    panAtDragY = panY;
    outer.classList.add('grabbing');
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    panX = panAtDragX + (e.clientX - dragStartX);
    panY = panAtDragY + (e.clientY - dragStartY);
    clampPan();
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    outer.classList.remove('grabbing');
  });

  // Wheel: ctrl+wheel = zoom, wheel = horizontal pan
  outer.addEventListener('wheel', e => {
    e.preventDefault();

    if (e.ctrlKey || e.metaKey) {
      // Zoom centered on mouse position
      const rect = outer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      const oldZoom = zoom;
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      zoom = Math.max(0.2, Math.min(5, zoom * delta));

      // Adjust pan to zoom toward mouse
      panX = mouseX - (mouseX - panX) * (zoom / oldZoom);
      panY = mouseY - (mouseY - panY) * (zoom / oldZoom);
    } else {
      // Horizontal pan
      panX -= e.deltaX || e.deltaY;
      panY -= (e.shiftKey ? 0 : e.deltaY * 0) || 0;
      // If shift, pan vertical
      if (e.shiftKey) panY -= e.deltaY;
    }

    zoom = Math.max(0.2, Math.min(5, zoom));
    clampPan();
    document.getElementById('zoom-slider').value = Math.round(zoom * 100);
    document.getElementById('zoom-label').textContent = zoom.toFixed(1) + '×';
    applyTransform();
  }, { passive: false });

  // Touch support
  let lastTouchDist = 0;
  let lastTouchX = 0, lastTouchY = 0;

  outer.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    } else if (e.touches.length === 1) {
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
    e.preventDefault();
  }, { passive: false });

  outer.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const scale = dist / lastTouchDist;
      zoom = Math.max(0.2, Math.min(5, zoom * scale));
      lastTouchDist = dist;
    } else if (e.touches.length === 1) {
      panX += e.touches[0].clientX - lastTouchX;
      panY += e.touches[0].clientY - lastTouchY;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
    clampPan();
    applyTransform();
    e.preventDefault();
  }, { passive: false });

  // Zoom slider
  document.getElementById('zoom-slider').addEventListener('input', e => {
    const newZoom = parseInt(e.target.value) / 100;
    const outer = document.getElementById('fresque-outer');
    const cx = outer.clientWidth / 2;
    const cy = (outer.clientHeight - HEADER_H()) / 2;
    panX = cx - (cx - panX) * (newZoom / zoom);
    panY = cy - (cy - panY) * (newZoom / zoom);
    zoom = newZoom;
    clampPan();
    document.getElementById('zoom-label').textContent = zoom.toFixed(1) + '×';
    applyTransform();
  });

  // Minimap click to navigate
  const minimap = document.getElementById('minimap-canvas');
  minimap.addEventListener('click', e => {
    const rect = minimap.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / minimap.width;
    const my = (e.clientY - rect.top) / minimap.height;
    const targetX = mx * svgWidth;
    const targetY = my * svgHeight;
    const outer = document.getElementById('fresque-outer');
    panX = -(targetX * zoom) + outer.clientWidth / 2;
    panY = -(targetY * zoom) + (outer.clientHeight - HEADER_H()) / 2;
    clampPan();
    applyTransform();
  });
}

/* ═══════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════ */
function init() {
  const data = getData();

  if (!data || !data.CIV || data.CIV.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    // Try again shortly (data may load asynchronously)
    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      const d = getData();
      if (d && d.CIV && d.CIV.length > 0) {
        clearInterval(interval);
        document.getElementById('empty-state').style.display = 'none';
        fullInit(d);
      } else if (attempts > 20) {
        clearInterval(interval);
      }
    }, 300);
    return;
  }

  fullInit(data);
}

function fullInit(data) {
  setupEraNav(data);
  setupContNav(data);
  setupToggles();
  setupInteraction();

  // Initial render
  render();

  // Initial pan: start at beginning of timeline
  panX = 0;
  panY = 0;
  applyTransform();

  // Resize handler
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      clampPan();
      applyTransform();
      drawMinimap();
    }, 150);
  });
}

// Wait for DOM + data
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
