<!-- Page Vision : sous-onglets pilotés par NavConfig.subtabs.vision (rendus depuis Docs/GDD/01 - Vision/) -->
<div class="md-subtabs-wrapper">
    <div class="subtab-content" id="vision-content"></div>
</div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.vision;
    if (!cfg || !window.MdRenderer) return;
    MdRenderer.initTabs('vision', null, '#vision-content', cfg.tabs, cfg.defaultKey);
})();
</script>
