<!-- Page Systèmes : sous-onglets pilotés par NavConfig.subtabs.systemes -->
<div class="md-subtabs-wrapper">
    <div class="subtab-content" id="systemes-content"></div>
</div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.systemes;
    if (!cfg || !window.MdRenderer) return;
    MdRenderer.initTabs('systemes', null, '#systemes-content', cfg.tabs, cfg.defaultKey);
})();
</script>
