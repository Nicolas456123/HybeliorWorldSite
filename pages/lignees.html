<style>
/* =============================================
   LIGNEES — Arbre des Lignées d'Hybélior

    padding: 24px 20px 60px;

/* ── Lignee pills ── */

.lignee-pill {

/* ── Column headers in SVG ── */
.col-header-text {

}

/* ── Mobile ── */
@media (max-width: 700px) {

    .lignees-nav { gap: 4px; }

}
</style>

<div class="lignees-page">
    <h1 class="lignees-title">Arbre des Lign&eacute;es d&rsquo;Hyb&eacute;lior</h1>
    <p class="lignees-subtitle">Filiation des civilisations &mdash; des empires fondateurs aux nations actuelles</p>

    <div class="lignees-nav" id="lignees-nav"></div>

    <div id="lignees-fallback" class="lignees-fallback" style="display:none;">
        Les donn&eacute;es de civilisations ne sont pas encore charg&eacute;es.<br>
        Visitez d&rsquo;abord la <a href="#frise">Frise chronologique</a> pour initialiser les donn&eacute;es, puis revenez ici.
    </div>

    <div class="lignees-svg-wrap" id="lignees-svg-wrap">
        <svg id="lignees-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
</div>

<!-- Tooltip -->
<div class="lignees-tooltip" id="lignees-tooltip"></div>

<!-- Detail panel -->
<div class="lignees-detail" id="lignees-detail">
    <button class="lignees-detail-close" id="lignees-detail-close">&times;</button>
    <div id="lignees-detail-content"></div>
</div>

<script>
(function () {
    'use strict';

    const TL = window.HYBELIOR_TIMELINE;
    if (!TL) return;

    /* ── Constants ── */
    const NODE_W = 160, NODE_H = 40, NODE_RX = 6;
    const H_GAP = 30;        // horizontal gap between siblings
    const COL_GAP = 60;      // gap between lignee columns
    const V_SCALE = 0.35;    // y-coordinate to pixel scale
    const MIN_V_GAP = 60;    // minimum vertical gap parent->child
    const HEADER_H = 60;     // height reserved for column headers
    const PAD = 40;           // padding around the SVG content

    /* ── DOM refs ── */
    const navEl = document.getElementById('lignees-nav');
    const svgEl = document.getElementById('lignees-svg');
    const wrapEl = document.getElementById('lignees-svg-wrap');
    const fallbackEl = document.getElementById('lignees-fallback');
    const tooltipEl = document.getElementById('lignees-tooltip');
    const detailEl = document.getElementById('lignees-detail');
    const detailContent = document.getElementById('lignees-detail-content');
    const detailClose = document.getElementById('lignees-detail-close');

    let activeLignee = 'all'; // 'all' or a lignee key
    let allTrees = {};        // key -> tree data
    let nodeMap = {};         // civ name -> node data (with x, y, civ)
    let highlightedChain = new Set();

    /* ══════════════════════════════════════════
       INIT
       ══════════════════════════════════════════ */
    function init() {
        const CIV = TL.CIV;
        if (!CIV || CIV.length === 0) {
            fallbackEl.style.display = 'block';
            wrapEl.style.display = 'none';
            buildNav();
            // Retry when data might be loaded later
            const check = setInterval(() => {
                if (TL.CIV && TL.CIV.length > 0) {
                    clearInterval(check);
                    fallbackEl.style.display = 'none';
                    wrapEl.style.display = '';
                    buildTrees();
                    render();
                }
            }, 500);
            return;
        }
        buildNav();
        buildTrees();
        render();
    }

    /* ── Build navigation pills ── */
    function buildNav() {
        const LIGNEES = TL.LIGNEES;
        let html = '';
        html += `<button class="lignee-pill ${activeLignee === 'all' ? 'active' : ''}" data-key="all">Toutes</button>`;
        for (const key of Object.keys(LIGNEES)) {
            html += `<button class="lignee-pill ${activeLignee === key ? 'active' : ''}" data-key="${key}">${LIGNEES[key].name}</button>`;
        }
        navEl.innerHTML = html;
        navEl.querySelectorAll('.lignee-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                activeLignee = btn.dataset.key;
                navEl.querySelectorAll('.lignee-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            });
        });
    }

    /* ══════════════════════════════════════════
       BUILD TREE STRUCTURES
       ══════════════════════════════════════════ */
    function buildTrees() {
        const CIV = TL.CIV;
        nodeMap = {};
        allTrees = {};

        // Group civs by lignee
        const byLignee = {};
        CIV.forEach(c => {
            const lig = c.lignee || 'ind';
            if (!byLignee[lig]) byLignee[lig] = [];
            byLignee[lig].push(c);
        });

        for (const key of Object.keys(TL.LIGNEES)) {
            const civs = byLignee[key] || [];
            const civByName = {};
            civs.forEach(c => { civByName[c.name] = c; });

            // Build parent-child relationships
            const children = {};  // parentName -> [childCiv]
            const roots = [];

            civs.forEach(c => {
                if (!c.from || !civByName[c.from]) {
                    roots.push(c);
                } else {
                    if (!children[c.from]) children[c.from] = [];
                    children[c.from].push(c);
                }
            });

            // Sort roots and children by y0
            roots.sort((a, b) => a.y0 - b.y0);
            for (const k of Object.keys(children)) {
                children[k].sort((a, b) => a.y0 - b.y0);
            }

            // Build tree nodes recursively
            function buildNode(civ) {
                const kids = (children[civ.name] || []).map(c => buildNode(c));
                const node = { civ, children: kids, width: 0, x: 0, y: 0 };
                // Width = max(own, sum of children widths + gaps)
                const childrenWidth = kids.length > 0
                    ? kids.reduce((s, k) => s + k.width, 0) + (kids.length - 1) * H_GAP
                    : 0;
                node.width = Math.max(NODE_W, childrenWidth);
                return node;
            }

            const treeroots = roots.map(r => buildNode(r));
            allTrees[key] = treeroots;
        }
    }

    /* ══════════════════════════════════════════
       LAYOUT & RENDER
       ══════════════════════════════════════════ */
    function render() {
        if (!TL.CIV || TL.CIV.length === 0) return;

        const LIGNEES = TL.LIGNEES;
        const keys = activeLignee === 'all'
            ? Object.keys(LIGNEES)
            : [activeLignee];

        nodeMap = {};

        // First pass: compute Y range across all visible civs to normalize
        let globalMinY = Infinity, globalMaxY = -Infinity;
        keys.forEach(key => {
            (allTrees[key] || []).forEach(root => {
                walkTree(root, node => {
                    if (node.civ.y0 < globalMinY) globalMinY = node.civ.y0;
                    if (node.civ.y1 > globalMaxY) globalMaxY = node.civ.y1;
                });
            });
        });
        if (globalMinY === Infinity) { globalMinY = 0; globalMaxY = 3200; }

        // Compute column positions
        const columns = [];
        let totalW = PAD;

        keys.forEach(key => {
            const roots = allTrees[key] || [];
            // Total width for this lignee column
            const colW = roots.length > 0
                ? roots.reduce((s, r) => s + r.width, 0) + (roots.length - 1) * H_GAP
                : NODE_W;
            columns.push({ key, roots, x: totalW, width: colW });
            totalW += colW + COL_GAP;
        });
        totalW += PAD - COL_GAP;

        // Layout each column
        columns.forEach(col => {
            let cx = col.x;
            col.roots.forEach(root => {
                layoutX(root, cx);
                cx += root.width + H_GAP;
            });
            col.roots.forEach(root => {
                layoutY(root, globalMinY);
            });
        });

        // Compute total height
        let maxPxY = HEADER_H;
        columns.forEach(col => {
            col.roots.forEach(root => {
                walkTree(root, node => {
                    const ny = node.y + NODE_H;
                    if (ny > maxPxY) maxPxY = ny;
                });
            });
        });
        const totalH = maxPxY + PAD;

        // Build SVG
        let svg = '';

        // Defs for filters
        svg += `<defs>
            <filter id="glow-alive" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="glow-highlight" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feFlood flood-color="#d4a017" flood-opacity="0.5" result="color"/>
                <feComposite in="color" in2="blur" operator="in" result="shadow"/>
                <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
            </filter>
        </defs>`;

        // Column headers and separators
        columns.forEach((col, i) => {
            const lig = LIGNEES[col.key];
            if (!lig) return;
            const midX = col.x + col.width / 2;
            svg += `<text x="${midX}" y="${24}" text-anchor="middle" class="col-header-text" font-size="13">${esc(lig.name)}</text>`;
            svg += `<text x="${midX}" y="${40}" text-anchor="middle" class="col-desc-text" font-size="9" font-style="italic">${esc(lig.desc)}</text>`;
            // Separator line
            if (i < columns.length - 1) {
                const sepX = col.x + col.width + COL_GAP / 2;
                svg += `<line x1="${sepX}" y1="${12}" x2="${sepX}" y2="${totalH - 10}" stroke="rgba(120,78,18,0.10)" stroke-width="1"/>`;
            }
        });

        // Edges
        columns.forEach(col => {
            col.roots.forEach(root => {
                svg += renderEdges(root);
            });
        });

        // Cross-lignee connections (CONN)
        svg += renderCrossConnections(columns);

        // Nodes (rendered after edges so they appear on top)
        columns.forEach(col => {
            col.roots.forEach(root => {
                walkTree(root, node => {
                    svg += renderNode(node);
                    nodeMap[node.civ.name] = node;
                });
            });
        });

        svgEl.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
        svgEl.innerHTML = svg;

        // Set wrap height
        const aspect = totalH / totalW;
        const wrapWidth = wrapEl.clientWidth;
        wrapEl.style.height = Math.min(Math.max(aspect * wrapWidth, 500), window.innerHeight * 0.85) + 'px';

        // Attach event listeners
        attachNodeEvents();
        initPanZoom(totalW, totalH);
    }

    /* ── Layout X positions ── */
    function layoutX(node, startX) {
        // Center this node within its allocated width
        node.x = startX + (node.width - NODE_W) / 2;

        if (node.children.length > 0) {
            const childrenTotalW = node.children.reduce((s, k) => s + k.width, 0) + (node.children.length - 1) * H_GAP;
            let cx = startX + (node.width - childrenTotalW) / 2;
            node.children.forEach(child => {
                layoutX(child, cx);
                cx += child.width + H_GAP;
            });
        }
    }

    /* ── Layout Y positions (based on y0, with minimum spacing) ── */
    function layoutY(node, globalMinY, parentPxY) {
        const rawY = HEADER_H + (node.civ.y0 - globalMinY) * V_SCALE;
        if (parentPxY !== undefined) {
            node.y = Math.max(rawY, parentPxY + MIN_V_GAP);
        } else {
            node.y = rawY;
        }
        node.children.forEach(child => {
            layoutY(child, globalMinY, node.y + NODE_H);
        });
    }

    /* ── Render a single node ── */
    function renderNode(node) {
        const c = node.civ;
        const x = node.x, y = node.y;
        const fillOpacity = c.dead ? 0.08 : 0.14;
        const strokeDash = c.dead ? 'stroke-dasharray="4 2"' : '';
        const strokeOpacity = c.dead ? 0.45 : 0.8;
        const filter = c.dead ? '' : 'filter="url(#glow-alive)"';

        const dateLabel = `${TL.yToDateLabel(c.y0)} — ${TL.yToDateLabel(c.y1)}`;
        const truncName = c.name.length > 22 ? c.name.slice(0, 20) + '...' : c.name;

        let s = `<g class="lignee-node" data-name="${esc(c.name)}" style="cursor:pointer">`;
        s += `<rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="${NODE_RX}" `;
        s += `fill="${c.color}" fill-opacity="${fillOpacity}" `;
        s += `stroke="${c.color}" stroke-width="1.5" stroke-opacity="${strokeOpacity}" ${strokeDash} ${filter}/>`;
        // Name
        s += `<text x="${x + NODE_W / 2}" y="${y + 16}" text-anchor="middle" `;
        s += `font-family="'Cinzel', serif" font-size="9.5" font-weight="700" fill="${c.color}" fill-opacity="${c.dead ? 0.6 : 0.9}">`;
        s += `${esc(truncName)}</text>`;
        // Dates
        s += `<text x="${x + NODE_W / 2}" y="${y + 30}" text-anchor="middle" `;
        s += `font-family="'Raleway', sans-serif" font-size="7.5" font-style="italic" fill="var(--text-muted, #6a5438)" fill-opacity="0.7">`;
        s += `${esc(dateLabel)}</text>`;
        s += `</g>`;
        return s;
    }

    /* ── Render edges (parent -> children) ── */
    function renderEdges(node) {
        let s = '';
        const px = node.x + NODE_W / 2;
        const py = node.y + NODE_H;

        node.children.forEach(child => {
            const cx = child.x + NODE_W / 2;
            const cy = child.y;
            const midY = py + (cy - py) * 0.5;

            s += `<path d="M${px},${py} C${px},${midY} ${cx},${midY} ${cx},${cy}" `;
            s += `fill="none" stroke="${node.civ.color}" stroke-width="1.5" stroke-opacity="0.35" class="lignee-edge" `;
            s += `data-from="${esc(node.civ.name)}" data-to="${esc(child.civ.name)}"/>`;

            s += renderEdges(child);
        });
        return s;
    }

    /* ── Cross-lignee connections ── */
    function renderCrossConnections(columns) {
        const CONN = TL.CONN;
        if (!CONN || CONN.length === 0) return '';

        let s = '';
        CONN.forEach(conn => {
            const fromNode = nodeMap[conn.from];
            const toNode = nodeMap[conn.to];
            if (!fromNode || !toNode) return;

            // Check if they're in different lignees
            if (fromNode.civ.lignee === toNode.civ.lignee) return;

            const fx = fromNode.x + NODE_W / 2;
            const fy = fromNode.y + NODE_H / 2;
            const tx = toNode.x + NODE_W / 2;
            const ty = toNode.y + NODE_H / 2;
            const midX = (fx + tx) / 2;
            const arcY = Math.min(fy, ty) - 30;

            const tColor = (TL.TYPES[conn.t] && TL.TYPES[conn.t].c) || '#888';

            s += `<path d="M${fx},${fy} Q${midX},${arcY} ${tx},${ty}" `;
            s += `fill="none" stroke="${tColor}" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="5 3" `;
            s += `class="lignee-cross-conn" data-label="${esc(conn.label || '')}" data-from="${esc(conn.from)}" data-to="${esc(conn.to)}"/>`;
        });
        return s;
    }

    /* ══════════════════════════════════════════
       INTERACTIONS
       ══════════════════════════════════════════ */
    function attachNodeEvents() {
        // Node hover & click
        svgEl.querySelectorAll('.lignee-node').forEach(g => {
            const name = g.dataset.name;

            g.addEventListener('mouseenter', (e) => {
                highlightChain(name);
                showTooltip(e, name);
            });
            g.addEventListener('mousemove', (e) => {
                moveTooltip(e);
            });
            g.addEventListener('mouseleave', () => {
                clearHighlight();
                hideTooltip();
            });
            g.addEventListener('click', () => {
                showDetail(name);
            });
        });

        // Cross-connection hover
        svgEl.querySelectorAll('.lignee-cross-conn').forEach(path => {
            path.addEventListener('mouseenter', (e) => {
                const label = path.dataset.label;
                if (label) {
                    tooltipEl.innerHTML = `<span style="font-weight:600">${esc(label)}</span><br><span style="font-size:10px;opacity:0.7">${esc(path.dataset.from)} → ${esc(path.dataset.to)}</span>`;
                    tooltipEl.classList.add('visible');
                    moveTooltip(e);
                }
                path.setAttribute('stroke-opacity', '0.8');
                path.setAttribute('stroke-width', '2.5');
            });
            path.addEventListener('mousemove', (e) => moveTooltip(e));
            path.addEventListener('mouseleave', () => {
                hideTooltip();
                path.setAttribute('stroke-opacity', '0.4');
                path.setAttribute('stroke-width', '1.2');
            });
        });
    }

    /* ── Highlight ancestor/descendant chain ── */
    function highlightChain(name) {
        highlightedChain.clear();
        // Walk up ancestors
        let current = name;
        while (current) {
            highlightedChain.add(current);
            const node = nodeMap[current];
            if (!node || !node.civ.from) break;
            current = node.civ.from;
        }
        // Walk down descendants
        function walkDown(n) {
            highlightedChain.add(n);
            const node = nodeMap[n];
            if (!node) return;
            // Find children of this node
            Object.values(nodeMap).forEach(nd => {
                if (nd.civ.from === n) {
                    walkDown(nd.civ.name);
                }
            });
        }
        walkDown(name);

        // Apply visual styling
        svgEl.querySelectorAll('.lignee-node').forEach(g => {
            const n = g.dataset.name;
            const rect = g.querySelector('rect');
            if (highlightedChain.has(n)) {
                rect.setAttribute('filter', 'url(#glow-highlight)');
                rect.setAttribute('stroke-width', '2.5');
                g.style.opacity = '1';
            } else {
                rect.removeAttribute('filter');
                g.style.opacity = '0.2';
            }
        });

        svgEl.querySelectorAll('.lignee-edge').forEach(path => {
            const from = path.dataset.from;
            const to = path.dataset.to;
            if (highlightedChain.has(from) && highlightedChain.has(to)) {
                path.setAttribute('stroke-opacity', '0.8');
                path.setAttribute('stroke-width', '2.5');
            } else {
                path.setAttribute('stroke-opacity', '0.08');
            }
        });
    }

    function clearHighlight() {
        highlightedChain.clear();
        svgEl.querySelectorAll('.lignee-node').forEach(g => {
            g.style.opacity = '1';
            const rect = g.querySelector('rect');
            const name = g.dataset.name;
            const node = nodeMap[name];
            if (node && !node.civ.dead) {
                rect.setAttribute('filter', 'url(#glow-alive)');
            } else {
                rect.removeAttribute('filter');
            }
            rect.setAttribute('stroke-width', '1.5');
        });
        svgEl.querySelectorAll('.lignee-edge').forEach(path => {
            path.setAttribute('stroke-opacity', '0.35');
            path.setAttribute('stroke-width', '1.5');
        });
    }

    /* ── Tooltip ── */
    function showTooltip(e, name) {
        const node = nodeMap[name];
        if (!node) return;
        const c = node.civ;
        const dateLabel = `${TL.yToDateLabel(c.y0)} — ${TL.yToDateLabel(c.y1)}`;
        tooltipEl.innerHTML = `<div class="tt-name">${esc(c.name)}</div>`
            + `<div class="tt-dates">${esc(dateLabel)}</div>`
            + `<div class="tt-regime">${esc(c.reg || '')}${c.cont ? ' — ' + esc(c.cont) : ''}</div>`
            + `<div style="margin-top:3px;font-size:10px;opacity:0.6">${c.dead ? 'Disparue' : 'Active'}</div>`;
        tooltipEl.classList.add('visible');
        moveTooltip(e);
    }
    function moveTooltip(e) {
        const tx = e.clientX + 14;
        const ty = e.clientY + 14;
        tooltipEl.style.left = Math.min(tx, window.innerWidth - 280) + 'px';
        tooltipEl.style.top = Math.min(ty, window.innerHeight - 100) + 'px';
    }
    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    /* ── Detail panel ── */
    function showDetail(name) {
        const node = nodeMap[name];
        if (!node) return;
        const c = node.civ;
        const LIGNEES = TL.LIGNEES;
        const CONN = TL.CONN || [];

        const dateLabel = `${TL.yToDateLabel(c.y0)} — ${TL.yToDateLabel(c.y1)}`;
        const ligInfo = LIGNEES[c.lignee] || { name: c.lignee };
        const statusClass = c.dead ? 'dead' : 'alive';
        const statusLabel = c.dead ? 'Disparue' : 'Active';

        let html = `<h2>${esc(c.name)}</h2>`;
        html += `<div class="detail-meta"><strong>Dates :</strong> ${esc(dateLabel)}</div>`;
        html += `<div class="detail-meta"><strong>R&eacute;gime :</strong> ${esc(c.reg || 'Inconnu')}</div>`;
        html += `<div class="detail-meta"><strong>Continent :</strong> ${esc(c.cont || 'Inconnu')}</div>`;
        html += `<div class="detail-meta"><strong>Lign&eacute;e :</strong> ${esc(ligInfo.name || c.lignee)}</div>`;
        if (c.from) {
            html += `<div class="detail-meta"><strong>Issue de :</strong> ${esc(c.from)}</div>`;
        }
        html += `<div class="detail-status ${statusClass}">${statusLabel}</div>`;

        // Events
        if (c.events && c.events.length > 0) {
            html += `<h3>&Eacute;v&eacute;nements</h3>`;
            c.events.forEach(ev => {
                const evDate = TL.yToDateLabel(ev.y);
                const typeInfo = TL.TYPES[ev.t] || {};
                html += `<div class="event-item">`;
                html += `<div class="ev-title" style="color:${typeInfo.c || 'inherit'}">${esc(ev.title)}</div>`;
                html += `<div class="ev-date">${esc(evDate)} — ${esc(typeInfo.l || ev.t)}</div>`;
                if (ev.desc) html += `<div class="ev-desc">${esc(ev.desc)}</div>`;
                html += `</div>`;
            });
        }

        // Connections
        const relatedConns = CONN.filter(cn => cn.from === c.name || cn.to === c.name);
        if (relatedConns.length > 0) {
            html += `<h3>Connexions</h3>`;
            relatedConns.forEach(cn => {
                const other = cn.from === c.name ? cn.to : cn.from;
                const dir = cn.from === c.name ? '→' : '←';
                html += `<div class="conn-item">${dir} <strong>${esc(other)}</strong> : ${esc(cn.label || '')}</div>`;
            });
        }

        // Descendants
        const descendants = Object.values(nodeMap).filter(n => n.civ.from === c.name);
        if (descendants.length > 0) {
            html += `<h3>Successeurs</h3>`;
            descendants.forEach(d => {
                html += `<div class="conn-item" style="cursor:pointer" onclick="document.querySelector('.lignee-node[data-name=\\'${esc(d.civ.name)}\\']')?.dispatchEvent(new Event('click'))">→ <strong>${esc(d.civ.name)}</strong></div>`;
            });
        }

        detailContent.innerHTML = html;
        detailEl.classList.add('open');
    }

    detailClose.addEventListener('click', () => {
        detailEl.classList.remove('open');
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
        if (detailEl.classList.contains('open') &&
            !detailEl.contains(e.target) &&
            !e.target.closest('.lignee-node')) {
            detailEl.classList.remove('open');
        }
    });

    /* ══════════════════════════════════════════
       PAN / ZOOM
       ══════════════════════════════════════════ */
    function initPanZoom(contentW, contentH) {
        let vb = { x: 0, y: 0, w: contentW, h: contentH };
        let isPanning = false;
        let startX, startY, startVB;

        function applyVB() {
            svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
        }

        // Remove old listeners by replacing element references (handled by re-render)
        wrapEl.onmousedown = (e) => {
            if (e.target.closest('.lignee-node') || e.target.closest('.lignee-cross-conn')) return;
            isPanning = true;
            startX = e.clientX;
            startY = e.clientY;
            startVB = { ...vb };
            wrapEl.classList.add('grabbing');
            e.preventDefault();
        };

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            const dx = (e.clientX - startX) * (vb.w / wrapEl.clientWidth);
            const dy = (e.clientY - startY) * (vb.h / wrapEl.clientHeight);
            vb.x = startVB.x - dx;
            vb.y = startVB.y - dy;
            applyVB();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            wrapEl.classList.remove('grabbing');
        });

        wrapEl.onwheel = (e) => {
            e.preventDefault();
            const scale = e.deltaY > 0 ? 1.12 : 1 / 1.12;
            const rect = wrapEl.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * vb.w + vb.x;
            const my = ((e.clientY - rect.top) / rect.height) * vb.h + vb.y;

            const newW = vb.w * scale;
            const newH = vb.h * scale;
            // Clamp zoom
            if (newW < 200 || newW > contentW * 5) return;

            vb.x = mx - (mx - vb.x) * scale;
            vb.y = my - (my - vb.y) * scale;
            vb.w = newW;
            vb.h = newH;
            applyVB();
        };

        // Touch support
        let lastTouchDist = 0;
        let lastTouchMid = null;

        wrapEl.ontouchstart = (e) => {
            if (e.touches.length === 1) {
                isPanning = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startVB = { ...vb };
            } else if (e.touches.length === 2) {
                isPanning = false;
                lastTouchDist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                lastTouchMid = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            }
        };

        wrapEl.ontouchmove = (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isPanning) {
                const dx = (e.touches[0].clientX - startX) * (vb.w / wrapEl.clientWidth);
                const dy = (e.touches[0].clientY - startY) * (vb.h / wrapEl.clientHeight);
                vb.x = startVB.x - dx;
                vb.y = startVB.y - dy;
                applyVB();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                const scale = lastTouchDist / dist;
                const rect = wrapEl.getBoundingClientRect();
                const mid = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                const mx = ((mid.x - rect.left) / rect.width) * vb.w + vb.x;
                const my = ((mid.y - rect.top) / rect.height) * vb.h + vb.y;

                vb.w *= scale;
                vb.h *= scale;
                vb.x = mx - (mx - vb.x) * scale;
                vb.y = my - (my - vb.y) * scale;

                lastTouchDist = dist;
                lastTouchMid = mid;
                applyVB();
            }
        };

        wrapEl.ontouchend = () => { isPanning = false; };
    }

    /* ══════════════════════════════════════════
       UTILITIES
       ══════════════════════════════════════════ */
    function walkTree(node, fn) {
        fn(node);
        node.children.forEach(c => walkTree(c, fn));
    }

    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ── Start ── */
    init();
})();
</script>
