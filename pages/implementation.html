<!-- Page Implémentation : sous-onglets pilotés par NavConfig.subtabs.implementation -->
<div class="md-subtabs-wrapper">
    <div class="subtab-content" id="implementation-content"></div>
</div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.implementation;
    if (!cfg || !window.MdRenderer) return;
    MdRenderer.initTabs('implementation', null, '#implementation-content', cfg.tabs, cfg.defaultKey);
})();
</script>
