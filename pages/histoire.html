<!-- ===== Page Histoire : le RÉCIT (chronique) d'une nation — côté Chroniques ===== -->
<div class="nation-page">
    <div class="nation-page-crumbs">
        <a href="#histoires/histoires" class="nation-page-back">← Toutes les histoires</a>
        <span class="nation-page-crumbs-sep">·</span>
        <span class="nation-page-continent" id="histoire-page-continent"></span>
    </div>

    <div class="nation-page-body" id="histoire-page-body">
        <div class="nation-page-loading">Sélectionnez une nation.</div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var continentEl = document.getElementById('histoire-page-continent');
    var bodyEl      = document.getElementById('histoire-page-body');

    var _cache = {};

    function currentSlug() {
        var raw = window.location.hash.slice(1);
        var parts = raw.split('/');
        if (parts[0] !== 'histoire') return null;
        return parts.slice(1).join('/') || null;
    }

    function getInfo(slug) {
        if (!window.NavConfig || typeof NavConfig.findNationBySlug !== 'function') return null;
        var meta = NavConfig.findNationBySlug(slug);
        if (!meta) return null;
        var paths = window.LoreReader && LoreReader.NATIONS && LoreReader.NATIONS[meta.nation];
        if (!paths) return null;
        return { nation: meta.nation, continent: meta.continent, histoires: paths.histoires };
    }

    function renderMarkdown(text) {
        var src = (window.LoreContent ? LoreContent.stripInternalSections(text) : text);
        var clean = src.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (_, file, display) {
            var name  = (file.split('/').pop() || file).trim();
            var label = (display || name).trim();
            var href  = (window.NavConfig && NavConfig.linkHrefForName) ? NavConfig.linkHrefForName(name) : null;
            return href ? '[' + label + '](' + href + ')' : label;
        });
        if (typeof marked !== 'undefined') {
            var html = marked.parse(clean, { breaks: true });
            return window.LoreContent ? LoreContent.sanitizeHtml(html) : html;
        }
        return '<pre>' + clean.replace(/[<>&]/g, function (c) {
            return ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c];
        }) + '</pre>';
    }

    function paint(text) {
        bodyEl.innerHTML = '<div class="lore-md-content">' + renderMarkdown(text) + '</div>';
        window.scrollTo({ top: 0, behavior: 'instant' });
        var sidebar = document.getElementById('site-sidebar');
        var content = document.querySelector('.page-content');
        if (sidebar && content && window.SidebarTOC) {
            SidebarTOC.build(sidebar, content);
        }
    }

    function renderForCurrentSlug() {
        var slug = currentSlug();
        if (!slug) return;
        var info = getInfo(slug);
        if (!info || !info.histoires) {
            continentEl.textContent = info ? info.continent : '';
            bodyEl.innerHTML = '<div class="nation-page-error">Aucune histoire pour cette nation.</div>';
            return;
        }
        continentEl.textContent = info.continent;
        if (_cache[info.histoires]) { paint(_cache[info.histoires]); return; }
        bodyEl.innerHTML = '<div class="nation-page-loading">Chargement…</div>';
        fetch('/lore/' + info.histoires).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        }).then(function (text) {
            _cache[info.histoires] = text;
            paint(text);
        }).catch(function (err) {
            bodyEl.innerHTML = '<div class="nation-page-error">Impossible de charger l\'histoire.<br><small>' +
                (err && err.message ? err.message : err) + '</small></div>';
        });
    }

    if (window._histoirePageHandler) {
        window.removeEventListener('hashchange', window._histoirePageHandler);
    }
    window._histoirePageHandler = renderForCurrentSlug;
    window.addEventListener('hashchange', renderForCurrentSlug);

    renderForCurrentSlug();
})();
</script>
