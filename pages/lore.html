<h1>Lore d'Hybelior</h1>
<p class="page-subtitle">Le monde, son souffle, ses présences, ses récits</p>
<div class="divider"><div class="divider-gem"></div></div>

<div class="lore-landing" id="lore-landing-container"></div>

<script>
(function () {
    var container = document.getElementById('lore-landing-container');
    if (!container || !window.NavConfig || !Array.isArray(NavConfig.loreCategories)) return;

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    var html = '';
    NavConfig.loreCategories.forEach(function (cat) {
        var firstHref = cat.links[0] ? cat.links[0].href : '#lore';
        html += '<div class="lore-card" data-href="' + escapeHtml(firstHref) + '">';
        html += '  <div class="lore-card-icon">' + cat.icon + '</div>';
        html += '  <h2 class="lore-card-title"><a href="' + escapeHtml(firstHref) + '">' +
                escapeHtml(cat.label) + '</a></h2>';
        html += '  <p class="lore-card-intro">' + escapeHtml(cat.intro) + '</p>';
        html += '  <ul class="lore-card-links">';
        cat.links.forEach(function (link) {
            html += '<li><a href="' + escapeHtml(link.href) + '">' +
                    escapeHtml(link.label) + '</a></li>';
        });
        html += '  </ul>';
        html += '</div>';
    });
    container.innerHTML = html;

    // Toute la carte cliquable (sauf les sous-liens) → utilise le href de tête.
    container.querySelectorAll('.lore-card[data-href]').forEach(function (card) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', function (e) {
            if (e.target.closest('a')) return;
            var href = card.getAttribute('data-href');
            if (href) window.location.hash = href.replace(/^#/, '');
        });
    });
})();
</script>
