<h1>Histoires</h1>
<p class="page-subtitle">Le récit de Sorin Valthen et les histoires des nations d'Hybélior</p>
<div class="divider"><div class="divider-gem"></div></div>

<div class="subtab-content" id="lore-subtab-content"></div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.lore;
    if (!cfg || !window.SubTabs) return;
    SubTabs.init(
        'lore',
        '',                              // pas de nav locale : remplacée par dropdown
        '#lore-subtab-content',
        cfg.tabs,
        cfg.defaultKey,
        function (html, key) {
            var sidebar = document.getElementById('site-sidebar');
            var content = document.getElementById('lore-subtab-content');
            if (sidebar && content && window.SidebarTOC) {
                SidebarTOC.build(sidebar, content);
            }
        }
    );
})();
</script>
