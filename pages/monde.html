<!-- Page Monde : sous-onglets pilotés par NavConfig.subtabs.monde -->
<div class="md-subtabs-wrapper">
    <div class="subtab-content" id="monde-content"></div>
</div>

<script>
(function () {
    var cfg = window.NavConfig && NavConfig.subtabs.monde;
    if (!cfg || !window.MdRenderer) return;
    MdRenderer.initTabs('monde', null, '#monde-content', cfg.tabs, cfg.defaultKey);
})();
</script>
