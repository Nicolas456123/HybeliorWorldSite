<!-- pages/livre.html — Lecture continue d'un tome + lecture a voix haute (Web Speech API).
     Route : #livre/t1 , #livre/t2 , ou #livre (menu). Autonome : ne depend pas de roman.html. -->
<style>
  .livre { max-width: 46rem; margin: 0 auto; padding: 0 1.1rem 6rem; }
  .livre-menu { display: flex; flex-direction: column; gap: 1rem; max-width: 34rem; margin: 2rem auto; }
  .livre-menu h1 { text-align: center; }
  .livre-tome-card {
    display: block; padding: 1.2rem 1.4rem; border: 1px solid var(--border-color, #d8cdbb);
    border-radius: 12px; text-decoration: none; color: inherit;
    background: var(--card-bg, rgba(255,255,255,.04)); transition: transform .12s, box-shadow .12s;
  }
  .livre-tome-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .livre-tome-card .t { font-size: 1.25rem; font-weight: 700; }
  .livre-tome-card .s { opacity: .7; font-size: .95rem; margin-top: .2rem; }
  .livre-tome-card .go { margin-top: .5rem; font-size: .9rem; opacity: .85; }

  /* Barre de controle flottante, en bas de l'ecran (accessible au pouce sur mobile) */
  .livre-bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(.7rem, env(safe-area-inset-bottom)); z-index: 3000;
    display: flex; align-items: center; gap: .5rem; padding: .5rem .6rem; flex-wrap: nowrap;
    background: var(--bg-color, #f4ecdb); border: 1px solid var(--border-color, #d8cdbb);
    border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.22);
    max-width: calc(100vw - 1.4rem);
  }
  .livre-btn {
    font: inherit; cursor: pointer; border: 1px solid var(--border-color, #cbb997);
    background: var(--accent, #8a5a2b); color: #fff; padding: .5rem .9rem; border-radius: 999px;
    font-weight: 600; display: inline-flex; align-items: center; gap: .4rem; line-height: 1;
  }
  .livre-btn.secondary { background: transparent; color: inherit; }
  .livre-btn:active { transform: scale(.97); }
  .livre-btn[disabled] { opacity: .5; cursor: default; }
  .livre-status { font-size: .8rem; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 7rem; }
  .livre-select {
    font: inherit; font-size: .82rem; max-width: 8.5rem; padding: .35rem .5rem; border-radius: 999px;
    border: 1px solid var(--border-color, #cbb997); background: transparent; color: inherit;
  }
  .livre-size { display: inline-flex; gap: .2rem; }
  .livre-size button { width: 2rem; height: 2rem; border-radius: 8px; }
  .livre-hint {
    font-size: .82rem; opacity: .7; margin: -.6rem 0 1.6rem; padding: .6rem .8rem;
    border-left: 3px solid var(--accent, #8a5a2b); background: rgba(138,90,43,.06); border-radius: 4px;
  }

  /* Corps du livre */
  .livre-body { font-size: var(--livre-fs, 1.12rem); line-height: 1.75; }
  .livre-body h1 { font-size: 1.5rem; margin: 2.6rem 0 1rem; line-height: 1.25; }
  .livre-body h2 { font-size: 1.2rem; margin: 2rem 0 .8rem; }
  .livre-body p { margin: 0 0 1.05rem; }
  .livre-body blockquote {
    margin: 1.2rem 0; padding: .3rem 0 .3rem 1rem; border-left: 3px solid var(--accent, #8a5a2b);
    opacity: .92; font-style: italic;
  }
  .livre-part {
    text-align: center; margin: 3.5rem 0 1rem; padding-top: 2rem;
    border-top: 1px solid var(--border-color, #d8cdbb); font-variant: small-caps;
    letter-spacing: .04em; font-size: 1.3rem; font-weight: 700; opacity: .9;
  }
  .livre-chap { scroll-margin-top: 4.5rem; }
  /* bloc en cours de lecture */
  .livre-body .speaking {
    background: linear-gradient(transparent 55%, rgba(138,90,43,.28) 0);
    border-radius: 3px;
  }
  .livre-body p, .livre-body blockquote, .livre-body li { cursor: pointer; }
  .livre-loading { text-align: center; padding: 3rem 0; opacity: .7; }
</style>

<div class="livre" id="livre-root">
  <div class="livre-loading">Chargement du livre…</div>
</div>

<script>
(function () {
  'use strict';
  // Stoppe toute lecture d'une visite precedente
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}

  var TOMES = {
    t1: { titre: 'La Septième Heure', sousTitre: 'Les Trois Coups · Tome 1 — l’Arrachement',
          dossier: 'Lore/Romans/Les Trois Coups/T1 - La Septième Heure' },
    t2: { titre: 'L’Heure qui se Referme', sousTitre: 'Les Trois Coups · Tome 2 — le Fléau des Failles',
          dossier: "Lore/Romans/Les Trois Coups/T2 - L'Heure qui se Referme" },
    t3: { titre: 'L’Heure qui Naît', sousTitre: 'Les Trois Coups · Tome 3 — le Sillage',
          dossier: "Lore/Romans/Les Trois Coups/T3 - L'Heure qui Naît" }
  };

  var root = document.getElementById('livre-root');
  if (!root) return;

  var tome = null, mdDossier = null, currentSub = null;

  // Le router ne relance pas ce script quand seul le sous-tome change (#livre/t1 -> #livre/t2) :
  // on gere nous-memes le hashchange.
  function currentTomeKey(){ return (location.hash.split('/')[1] || '').toLowerCase(); }

  function route(){
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    var sub = currentTomeKey();
    if (sub === currentSub && root.querySelector('#lv-body, .livre-menu')) return; // deja rendu
    currentSub = sub;
    if (!TOMES[sub]) { tome = null; mdDossier = null; renderMenu(); return; }
    tome = TOMES[sub]; mdDossier = tome.dossier;
    root.innerHTML = '<div class="livre-loading">Chargement du livre…</div>';
    loadBook();
  }

  // Un seul handler global (evite l'accumulation si le script est re-execute).
  if (window._livreHashHandler) window.removeEventListener('hashchange', window._livreHashHandler);
  window._livreHashHandler = function(){
    if ((location.hash.replace('#','').split('/')[0]) === 'livre') route();
    else { try { speechSynthesis.cancel(); } catch(e){} }
  };
  window.addEventListener('hashchange', window._livreHashHandler);
  window.addEventListener('pagehide', function(){ try{ speechSynthesis.cancel(); }catch(e){} });

  route();
  return;

  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function renderMenu() {
    var h = '<div class="livre-menu"><h1>Lire un livre</h1>';
    ['t1','t2','t3'].forEach(function(k){
      var t = TOMES[k];
      h += '<a class="livre-tome-card" href="#livre/' + k + '">' +
           '<div class="t">' + escapeHtml(t.titre) + '</div>' +
           '<div class="s">' + escapeHtml(t.sousTitre) + '</div>' +
           '<div class="go">▶ Ouvrir en lecture continue &amp; audio</div></a>';
    });
    h += '</div>';
    root.innerHTML = h;
  }

  function mdUrl(file){ return '/Docs/' + mdDossier + '/' + encodeURIComponent(file); }

  function stripFrontmatter(md){ return md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, ''); }

  function renderMd(md){
    var clean = stripFrontmatter(md);
    if (window.LoreContent && LoreContent.stripInternalSections) clean = LoreContent.stripInternalSections(clean);
    var html = (window.marked && marked.parse) ? marked.parse(clean, { breaks: true }) : ('<pre>' + escapeHtml(clean) + '</pre>');
    if (window.LoreContent && LoreContent.sanitizeHtml) html = LoreContent.sanitizeHtml(html);
    return html;
  }

  // Charge l'index puis tous les chapitres, dans l'ordre.
  function loadBook(){
    var reqSub = currentSub;
    fetch('/Docs/' + mdDossier + '/roman-index.json')
      .then(function(r){ if(!r.ok) throw new Error('index'); return r.json(); })
      .then(function(idx){
        var chapters = [];
        (idx.parties || []).forEach(function(p){
          (p.chapitres || []).forEach(function(c){ chapters.push({ partie: p.titre, file: c.file, label: c.label }); });
        });
        return Promise.all(chapters.map(function(c){
          return fetch(mdUrl(c.file)).then(function(r){ return r.ok ? r.text() : ''; })
            .then(function(txt){ return { partie: c.partie, html: renderMd(txt) }; });
        })).then(function(parts){ if (reqSub === currentSub) build(idx, parts); });
      })
      .catch(function(){ if (reqSub === currentSub) root.innerHTML = '<div class="livre-loading">Impossible de charger le livre.</div>'; });
  }

  function prettyPart(t){ return (t||'').replace(/^prologue$/i,'Prologue').replace(/^coda$/i,'Coda'); }

  function build(idx, parts){
    var bar =
      '<div class="livre-bar">' +
        '<button class="livre-btn" id="lv-play">▶ Écouter</button>' +
        '<button class="livre-btn secondary" id="lv-stop" disabled>■ Stop</button>' +
        '<select class="livre-select" id="lv-voice" title="Voix" aria-label="Choix de la voix"></select>' +
        '<span class="livre-status" id="lv-status"></span>' +
        '<span class="livre-size"><button class="livre-btn secondary" id="lv-minus" title="Plus petit">A−</button>' +
        '<button class="livre-btn secondary" id="lv-plus" title="Plus grand">A+</button></span>' +
      '</div>';

    var head = '<h1 style="text-align:center;margin:.4rem 0 0">' + escapeHtml(idx.titre || tome.titre) + '</h1>' +
               '<p style="text-align:center;opacity:.7;margin:.2rem 0 1rem">' + escapeHtml(idx.sousTitre || '') + '</p>' +
               '<div class="livre-hint"><b>Meilleure voix :</b> la voix par défaut est basique. Sur iPhone, installe une voix ' +
               '<b>« Améliorée »</b> ou <b>« Siri »</b> dans <b>Réglages ▸ Accessibilité ▸ Contenu énoncé ▸ Voix ▸ Français</b> ' +
               '(télécharge par ex. <i>Aurélie (Améliorée)</i> ou une voix <i>Siri</i>), puis choisis-la dans le menu déroulant ' +
               'de la barre du bas. Le bouton <b>▶ Écouter</b> l’utilisera. Pour la lecture écran verrouillé, tu peux aussi ' +
               'balayer vers le bas à deux doigts (<b>Lire l’écran</b>).</div>';

    var body = '<div class="livre-body" id="lv-body">';
    var lastPart = null;
    parts.forEach(function(p){
      var pp = prettyPart(p.partie);
      if (pp && pp !== lastPart) { body += '<div class="livre-part">' + escapeHtml(pp) + '</div>'; lastPart = pp; }
      body += '<article class="livre-chap">' + p.html + '</article>';
    });
    body += '</div>';

    root.innerHTML = bar + head + body;
    wireReader();
    wireSize();
  }

  // ---------- Lecture a voix haute ----------
  function wireReader(){
    var body = document.getElementById('lv-body');
    var playBtn = document.getElementById('lv-play');
    var stopBtn = document.getElementById('lv-stop');
    var status = document.getElementById('lv-status');
    if (!body || !window.speechSynthesis) {
      if (playBtn) { playBtn.disabled = true; if (status) status.textContent = 'Lecture vocale non disponible sur ce navigateur.'; }
      return;
    }

    // Blocs lisibles, dans l'ordre du document.
    var blocks = Array.prototype.slice.call(body.querySelectorAll('p, h1, h2, h3, blockquote, li'))
      .filter(function(el){ return el.textContent.trim().length > 0; });

    var idx = 0, playing = false, paused = false, keepAlive = null;
    var voiceSel = document.getElementById('lv-voice');
    var VKEY = 'livre-voice';

    // Score de qualite : les voix "neuronales/enhanced/Siri/Google" sonnent bien mieux
    // que les voix "compact" par defaut.
    function voiceScore(v){
      var n = (v.name || '') + ' ' + (v.voiceURI || '');
      var s = 0;
      if (/^fr/i.test(v.lang)) s += 100;
      if (/fr[-_]FR/i.test(v.lang)) s += 10;
      if (/siri/i.test(n)) s += 60;
      if (/enhanced|premium|neural|natural|amelie|aurelie|aurélie|amélie/i.test(n)) s += 40;
      if (/google/i.test(n)) s += 30;
      if (/eloquence|compact/i.test(n)) s -= 40;
      return s;
    }

    var chosenVoice = null;
    function populateVoices(){
      var vs = (speechSynthesis.getVoices() || []).slice();
      if (!vs.length || !voiceSel) return;
      vs.sort(function(a,b){ return voiceScore(b) - voiceScore(a); });
      var saved = localStorage.getItem(VKEY);
      voiceSel.innerHTML = '';
      vs.forEach(function(v){
        var o = document.createElement('option');
        o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')';
        voiceSel.appendChild(o);
      });
      // choix : sauvegarde valide, sinon la mieux notee
      var pick = vs.find(function(v){ return v.voiceURI === saved; }) || vs[0];
      chosenVoice = pick; voiceSel.value = pick.voiceURI;
    }
    function pickVoice(){ return chosenVoice; }
    if (voiceSel) voiceSel.addEventListener('change', function(){
      var vs = speechSynthesis.getVoices() || [];
      chosenVoice = vs.find(function(v){ return v.voiceURI === voiceSel.value; }) || null;
      if (chosenVoice) localStorage.setItem(VKEY, chosenVoice.voiceURI);
      // applique immediatement si en lecture
      if (playing){ var at = idx; speakFrom(at); }
    });

    function setStatus(){
      var total = blocks.length;
      var pct = total ? Math.round((idx/total)*100) : 0;
      status.textContent = playing ? ('Lecture… ' + pct + '%') : (paused ? ('En pause · ' + pct + '%') : '');
    }

    function clearHi(){ blocks.forEach(function(b){ b.classList.remove('speaking'); }); }

    function speakFrom(i){
      speechSynthesis.cancel();
      idx = Math.max(0, Math.min(i, blocks.length - 1));
      playing = true; paused = false;
      playBtn.innerHTML = '⏸ Pause'; stopBtn.disabled = false;
      startKeepAlive();
      next();
    }

    function next(){
      clearHi();
      if (idx >= blocks.length){ stopAll(); status.textContent = 'Terminé.'; return; }
      var el = blocks[idx];
      el.classList.add('speaking');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var u = new SpeechSynthesisUtterance(el.textContent.replace(/\s+/g,' ').trim());
      u.lang = 'fr-FR'; var v = pickVoice(); if (v) u.voice = v;
      u.rate = 1.0; u.pitch = 1.0;
      u.onend = function(){ if (playing && !paused){ idx++; setStatus(); next(); } };
      u.onerror = function(){ if (playing && !paused){ idx++; next(); } };
      setStatus();
      speechSynthesis.speak(u);
    }

    // Contournement d'un bug (pause a ~15 s) : relance discrete.
    function startKeepAlive(){ stopKeepAlive(); keepAlive = setInterval(function(){
      if (playing && !paused){ try { speechSynthesis.pause(); speechSynthesis.resume(); } catch(e){} }
    }, 9000); }
    function stopKeepAlive(){ if (keepAlive){ clearInterval(keepAlive); keepAlive = null; } }

    function stopAll(){
      speechSynthesis.cancel(); stopKeepAlive(); clearHi();
      playing = false; paused = false; playBtn.innerHTML = '▶ Écouter'; stopBtn.disabled = true; setStatus();
    }

    playBtn.addEventListener('click', function(){
      if (!playing){ speakFrom(idx || 0); }
      else if (!paused){ paused = true; playing = false; speechSynthesis.pause(); stopKeepAlive(); playBtn.innerHTML = '▶ Reprendre'; setStatus(); }
      else { paused = false; playing = true; playBtn.innerHTML = '⏸ Pause'; startKeepAlive(); speechSynthesis.resume(); setStatus();
             // Safari : si resume ne relance pas, on repart du bloc courant.
             setTimeout(function(){ if (playing && !speechSynthesis.speaking) next(); }, 400); }
    });
    stopBtn.addEventListener('click', function(){ idx = 0; stopAll(); status.textContent = ''; });

    // Toucher un paragraphe = lire a partir de la.
    body.addEventListener('click', function(e){
      var el = e.target.closest('p, h1, h2, h3, blockquote, li'); if (!el) return;
      var i = blocks.indexOf(el); if (i < 0) return;
      speakFrom(i);
    });

    // Precharge les voix (iOS/Chrome les chargent en async).
    populateVoices();
    if (typeof speechSynthesis.onvoiceschanged !== 'undefined') speechSynthesis.onvoiceschanged = populateVoices;
    setTimeout(populateVoices, 400);
  }

  // ---------- Taille du texte ----------
  function wireSize(){
    var body = document.getElementById('lv-body');
    var KEY = 'livre-fs';
    var fs = parseFloat(localStorage.getItem(KEY) || '1.12');
    function apply(){ body.style.setProperty('--livre-fs', fs.toFixed(2) + 'rem'); localStorage.setItem(KEY, fs); }
    apply();
    var minus = document.getElementById('lv-minus'), plus = document.getElementById('lv-plus');
    if (minus) minus.addEventListener('click', function(){ fs = Math.max(0.9, fs - 0.08); apply(); });
    if (plus)  plus.addEventListener('click', function(){ fs = Math.min(1.7, fs + 0.08); apply(); });
  }
})();
</script>
