<svg width="400" height="450" viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="hGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#dabb70"/>
            <stop offset="40%" stop-color="#c8a050"/>
            <stop offset="100%" stop-color="#7a4c0a"/>
        </linearGradient>
        <filter id="hGlow">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="halo" cx="50%" cy="42%">
            <stop offset="0%" stop-color="#c8a050" stop-opacity="0.12"/>
            <stop offset="60%" stop-color="#c8a050" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#c8a050" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Mystical halo -->
    <circle cx="200" cy="185" r="140" fill="url(#halo)"/>

    <!-- Thin circle frame -->
    <circle cx="200" cy="185" r="155" fill="none" stroke="#c8a050" stroke-width="1" opacity="0.2"/>

    <!-- The H -->
    <text x="200" y="225" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="170" fill="url(#hGrad)" filter="url(#hGlow)">H</text>

    <!-- Gold ornamental line -->
    <line x1="80" y1="248" x2="320" y2="248" stroke="#c8a050" stroke-width="1" opacity="0.35"/>

    <!-- Gold dots on line -->
    <circle cx="92" cy="248" r="2.5" fill="#c8a050" opacity="0.3"/>
    <circle cx="308" cy="248" r="2.5" fill="#c8a050" opacity="0.3"/>

    <!-- Diamond accent (amethyst) -->
    <polygon points="200,256 208,266 200,276 192,266" fill="#5a2888" opacity="0.6"/>

    <!-- Name -->
    <text x="200" y="310" text-anchor="middle" font-family="'Cinzel', serif" font-size="24" fill="#c8a050" letter-spacing="10" opacity="0.7">HYBÉLIOR</text>
</svg>
