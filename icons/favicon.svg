<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="outerG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#dabb70"/>
            <stop offset="100%" stop-color="#a07828"/>
        </linearGradient>
        <radialGradient id="gemG" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#9a5cc8"/>
            <stop offset="100%" stop-color="#4a1870"/>
        </radialGradient>
        <filter id="gemGlow">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="180" height="180" rx="36" fill="#e8dcc4"/>
    <!-- Outer diamond -->
    <polygon points="90,14 166,90 90,166 14,90" fill="none" stroke="url(#outerG)" stroke-width="2.5"/>
    <!-- Middle diamond -->
    <polygon points="90,36 144,90 90,144 36,90" fill="none" stroke="#c8a050" stroke-width="1.2" opacity="0.35"/>
    <!-- Inner diamond (amethyst) -->
    <polygon points="90,56 124,90 90,124 56,90" fill="none" stroke="#7a42b0" stroke-width="2" opacity="0.6"/>
    <!-- Cross lines -->
    <line x1="90" y1="14" x2="90" y2="166" stroke="#c8a050" stroke-width="0.6" opacity="0.15"/>
    <line x1="14" y1="90" x2="166" y2="90" stroke="#c8a050" stroke-width="0.6" opacity="0.15"/>
    <!-- Corner dots -->
    <circle cx="90" cy="14" r="4" fill="#c8a050" opacity="0.7"/>
    <circle cx="166" cy="90" r="4" fill="#c8a050" opacity="0.7"/>
    <circle cx="90" cy="166" r="4" fill="#c8a050" opacity="0.7"/>
    <circle cx="14" cy="90" r="4" fill="#c8a050" opacity="0.7"/>
    <!-- Center gem glow -->
    <circle cx="90" cy="90" r="18" fill="#5a2888" opacity="0.12"/>
    <circle cx="90" cy="90" r="11" fill="#5a2888" opacity="0.2"/>
    <!-- Center gem -->
    <circle cx="90" cy="90" r="7" fill="url(#gemG)" filter="url(#gemGlow)"/>
</svg>
