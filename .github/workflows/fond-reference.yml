# Fond de référence — exécute scripts/assemble-fond.py à chaque mise à jour
# de la PR qui le contient, et pousse le résultat sur la branche fond-reference.
name: Fond de référence

on:
  pull_request:
    paths: ['scripts/assemble-fond.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assembler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow + requests
        run: pip install --quiet pillow requests
      - name: Assembler le fond
        run: python scripts/assemble-fond.py
      - name: Pousser sur la branche fond-reference
        run: |
          mkdir fond && mv fond-reference.jpg HybeliorMap.dzi fond/
          cd fond
          git init -b fond-reference
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fond de référence assemblé depuis les tuiles publiques"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            fond-reference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
