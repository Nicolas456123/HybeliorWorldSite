<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hybelior — Le Monde</title>
  <meta name="theme-color" content="#0d0b09" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23c9a24b' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23c9a24b'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700;900&display=swap');
    @font-face {
      font-family: 'Copperplate Gothic';
      src: url('/fonts/Copperplate-Gothic-Std-33-BC.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg: #0d0b09; --bg2: #14110d;
      --panel: rgba(27, 24, 20, .72); --panel-solid: #1b1814;
      --line: #33291c; --line-soft: rgba(201, 162, 75, .18);
      --ink: #ece4d4; --dim: #b3a68f; --faint: #83775f;
      --gold: #c9a24b; --gold-soft: #e0c274; --gold-deep: #8a6a24;
      --glow: rgba(201, 162, 75, .28);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(1200px 700px at 50% -10%, #191410 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--ink);
      font: 16px/1.65 'Raleway', -apple-system, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    a { color: var(--gold-soft); text-decoration: none; }
    a:hover { color: #f0d894; }

    /* Voûte céleste (canvas plein écran, derrière tout) */
    #ciel { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 22px 90px; }

    /* ── Typographie de titre ─────────────────────────────── */
    .titre-monde {
      font-family: 'Cinzel', 'Copperplate Gothic', serif;
      text-align: center; text-transform: uppercase;
      font-size: clamp(44px, 8vw, 92px); font-weight: 700;
      letter-spacing: clamp(6px, 2.2vw, 26px);
      margin: 0; padding-left: clamp(6px, 2.2vw, 26px); /* compense letter-spacing */
      background: linear-gradient(180deg, #f4e3b2 0%, var(--gold) 55%, #7c5c1e 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 26px var(--glow));
    }
    h2.section {
      font-family: 'Cinzel', serif; font-weight: 600; color: var(--gold-soft);
      font-size: 21px; letter-spacing: 3px; text-transform: uppercase;
      display: flex; align-items: center; gap: 16px; margin: 54px 0 22px;
    }
    h2.section::before, h2.section::after {
      content: ''; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, var(--line-soft), transparent);
    }
    .ornement { text-align: center; color: var(--gold-deep); letter-spacing: 10px; margin: 14px 0; font-size: 13px; }

    /* ── Seuil (hero) ─────────────────────────────────────── */
    .seuil { padding: 92px 0 10px; text-align: center; }
    .seuil .devise {
      color: var(--dim); font-style: italic; font-weight: 300;
      font-size: clamp(15px, 2.2vw, 19px); letter-spacing: 1px; margin: 20px 0 0;
    }
    .seuil .compte { color: var(--faint); font-size: 13px; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; }

    /* ── Recherche ────────────────────────────────────────── */
    .quete { max-width: 640px; margin: 40px auto 8px; position: relative; }
    .quete input {
      width: 100%; padding: 16px 22px 16px 52px; border-radius: 999px;
      border: 1px solid var(--line-soft); outline: none;
      background: var(--panel); color: var(--ink);
      font: inherit; font-size: 17px;
      box-shadow: 0 8px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(201,162,75,.04);
      transition: border-color .25s, box-shadow .25s;
      backdrop-filter: blur(6px);
    }
    .quete input:focus { border-color: var(--gold); box-shadow: 0 8px 44px rgba(0,0,0,.5), 0 0 24px var(--glow); }
    .quete .loupe { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--gold-deep); }
    .quete .resultats {
      position: absolute; left: 0; right: 0; top: calc(100% + 10px); z-index: 30;
      background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 22px 60px rgba(0,0,0,.65); display: none; text-align: left;
    }
    .quete .resultats.on { display: block; }
    .quete .resultats .r {
      display: flex; gap: 12px; align-items: baseline; padding: 11px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .quete .resultats .r:hover { background: rgba(201,162,75,.07); }
    .quete .resultats .r .nom { color: var(--ink); font-weight: 600; }
    .quete .resultats .r .apercu { color: var(--faint); font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Badges ───────────────────────────────────────────── */
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-soft);
      border: 1px solid var(--line-soft); background: rgba(201,162,75,.06); white-space: nowrap;
    }

    /* ── Portes (cartes) ──────────────────────────────────── */
    .portes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .porte {
      position: relative; display: block; padding: 26px 24px 22px; border-radius: var(--radius);
      background: var(--panel); border: 1px solid var(--line);
      transition: transform .3s, border-color .3s, box-shadow .3s;
      backdrop-filter: blur(4px); overflow: hidden; cursor: pointer;
    }
    .porte::before {
      content: ''; position: absolute; inset: 6px; border: 1px solid rgba(201,162,75,.10);
      border-radius: 8px; pointer-events: none; transition: border-color .3s;
    }
    .porte:hover { transform: translateY(-4px); border-color: var(--gold-deep); box-shadow: 0 16px 44px rgba(0,0,0,.5), 0 0 30px rgba(201,162,75,.10); }
    .porte:hover::before { border-color: rgba(201,162,75,.30); }
    .porte .glyphe { font-size: 26px; color: var(--gold); margin-bottom: 10px; filter: drop-shadow(0 0 8px var(--glow)); }
    .porte h3 { margin: 0 0 6px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 18px; letter-spacing: 1.5px; color: var(--ink); }
    .porte p { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.5; }
    .porte .nombre {
      position: absolute; top: 18px; right: 18px; font-family: 'Cinzel', serif;
      color: var(--gold-deep); font-size: 13px; letter-spacing: 1px;
    }

    /* ── Boutons ──────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px; border-radius: 999px;
      border: 1px solid var(--gold-deep); background: linear-gradient(180deg, rgba(201,162,75,.14), rgba(201,162,75,.05));
      color: var(--gold-soft); font: inherit; font-size: 15px; letter-spacing: 1.5px; cursor: pointer;
      transition: box-shadow .25s, transform .2s, border-color .25s;
    }
    .btn:hover { box-shadow: 0 0 26px var(--glow); transform: translateY(-2px); border-color: var(--gold); color: #f2dda0; }
    .centre { text-align: center; }

    /* ── Fil (breadcrumb) ─────────────────────────────────── */
    .fil { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 26px 0 6px; color: var(--faint); font-size: 13.5px; }
    .fil a { color: var(--dim); } .fil a:hover { color: var(--gold-soft); }
    .fil .sep { color: var(--gold-deep); }

    /* ── Fiche ────────────────────────────────────────────── */
    .fiche-tete { margin: 26px 0 8px; }
    .fiche-tete h1 {
      font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 2.5px;
      font-size: clamp(30px, 5vw, 46px); margin: 6px 0 10px; color: var(--ink);
      text-shadow: 0 0 30px rgba(201,162,75,.12);
    }
    .fiche-tete .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .lede {
      font-size: clamp(16.5px, 2.2vw, 19px); line-height: 1.75; color: var(--dim);
      font-style: italic; font-weight: 300; border-left: 2px solid var(--gold-deep);
      padding: 4px 0 4px 20px; margin: 22px 0 8px; max-width: 62rem;
    }
    /* Situation dans le temps, sous le titre d'une fiche. */
    .epoque-fiche { margin: 12px 0 0; font-size: 14px; letter-spacing: .5px; }
    .epoque-fiche .quand { color: var(--gold-soft); font-family: Cinzel, serif; }
    .epoque-fiche .dit { color: var(--faint); font-style: italic; }
    .panneau {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 26px 30px; margin: 22px 0; backdrop-filter: blur(4px);
    }
    .colonnes { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
    @media (max-width: 940px) { .colonnes { grid-template-columns: 1fr; } }

    /* corps markdown */
    .corps { line-height: 1.75; font-weight: 300; overflow-x: auto; }
    .corps h1, .corps h2, .corps h3 { font-family: 'Cinzel', serif; font-weight: 600; color: var(--gold-soft); letter-spacing: 1px; margin: 1.5em 0 .5em; line-height: 1.3; }
    .corps h1 { font-size: 1.45rem; } .corps h2 { font-size: 1.22rem; } .corps h3 { font-size: 1.05rem; color: var(--ink); }
    .corps strong { color: var(--ink); font-weight: 600; }
    .corps table { border-collapse: collapse; margin: .8em 0; font-size: .93em; }
    .corps th, .corps td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
    .corps th { color: var(--gold-soft); font-weight: 600; background: rgba(201,162,75,.05); }
    .corps blockquote { border-left: 3px solid var(--gold-deep); margin: .8em 0; padding: 2px 0 2px 16px; color: var(--dim); }
    .corps code { background: rgba(201,162,75,.10); padding: .12em .4em; border-radius: 5px; font-size: .9em; }
    .corps hr { border: none; border-top: 1px solid var(--line); margin: 1.6em 0; }
    .corps img { max-width: 100%; }
    .corps > p:first-of-type::first-letter {
      font-family: 'Cinzel', serif; font-size: 3.1em; float: left; line-height: .85;
      padding: 4px 10px 0 0; color: var(--gold);
    }

    /* constellation */
    .constellation { position: relative; }
    .constellation canvas { width: 100%; height: 320px; display: block; border-radius: 8px; cursor: pointer; }
    .constellation .legende { color: var(--faint); font-size: 12px; text-align: center; margin-top: 8px; letter-spacing: 1px; }

    /* frise des faits */
    .frise { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
    .frise::before { content: ''; position: absolute; left: 86px; top: 6px; bottom: 6px; width: 1px; background: var(--line-soft); }
    .frise li { display: flex; gap: 20px; padding: 7px 0; align-items: baseline; }
    .frise .an { width: 72px; text-align: right; color: var(--gold); font-family: 'Cinzel', serif; font-size: 13.5px; flex-shrink: 0; }
    .frise .puce { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-deep); flex-shrink: 0; position: relative; top: -1px; box-shadow: 0 0 8px var(--glow); }
    .frise .quoi { color: var(--dim); font-size: 14.5px; } .frise .quoi b { color: var(--ink); font-weight: 600; }

    /* liens / chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,.02); color: var(--dim); font-size: 13.5px; cursor: pointer;
      transition: border-color .2s, color .2s, box-shadow .2s;
    }
    .chip:hover { border-color: var(--gold-deep); color: var(--gold-soft); box-shadow: 0 0 14px rgba(201,162,75,.12); }
    .groupe-rel { margin: 14px 0; }
    .groupe-rel .etiquette { color: var(--faint); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

    /* ── Collections ──────────────────────────────────────── */
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 18px; }
    .carte-e {
      padding: 18px 20px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
      cursor: pointer; transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    .carte-e:hover { transform: translateY(-3px); border-color: var(--gold-deep); box-shadow: 0 12px 34px rgba(0,0,0,.45); }
    .carte-e h4 { margin: 0 0 6px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 16.5px; color: var(--ink); letter-spacing: .8px; }
    .carte-e p { margin: 0; color: var(--faint); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .filtre-ligne { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
    .filtre-ligne input {
      flex: 1; min-width: 220px; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--panel); color: var(--ink); font: inherit; font-size: 14.5px; outline: none;
    }
    .filtre-ligne input:focus { border-color: var(--gold-deep); }

    /* ── Ères (chronologie) ───────────────────────────────── */
    .eres { position: relative; margin-top: 30px; }
    .eres::before { content: ''; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg, transparent, var(--gold-deep) 8%, var(--gold-deep) 92%, transparent); }
    .ere { position: relative; padding: 6px 0 34px 62px; }
    .ere .astre {
      position: absolute; left: 8px; top: 14px; width: 21px; height: 21px; border-radius: 50%;
      border: 1px solid var(--gold); background: radial-gradient(circle at 35% 35%, #f0d894, var(--gold-deep));
      box-shadow: 0 0 18px var(--glow);
    }
    .ere h3 { margin: 0 0 2px; font-family: 'Cinzel', serif; font-weight: 600; font-size: 20px; letter-spacing: 1.5px; color: var(--gold-soft); cursor: pointer; }
    .ere h3:hover { color: #f0d894; }
    .ere .portee { color: var(--faint); font-size: 13px; letter-spacing: 1px; margin-bottom: 8px; }
    .ere p { margin: 0; color: var(--dim); font-size: 14.5px; max-width: 60rem; }
    .ere .echos { margin-top: 10px; }
    .ere .echos .quoi { display: block; color: var(--faint); font-size: 13px; padding: 2px 0; }
    .ere .echos .quoi b { color: var(--dim); font-weight: 500; }

    /* ── Divers ───────────────────────────────────────────── */
    .saviez {
      margin: 60px auto 0; max-width: 760px; text-align: center; padding: 22px 30px;
      border: 1px solid var(--line-soft); border-radius: var(--radius); background: rgba(201,162,75,.03);
      color: var(--dim); font-style: italic; font-weight: 300; cursor: pointer; transition: border-color .3s;
    }
    .saviez:hover { border-color: var(--gold-deep); }
    .saviez .de { display: block; margin-top: 8px; font-style: normal; font-size: 12.5px; color: var(--gold-deep); letter-spacing: 2px; text-transform: uppercase; }
    .pied { margin-top: 80px; text-align: center; color: var(--faint); font-size: 12.5px; letter-spacing: 1px; }
    .pied a { color: var(--faint); } .pied a:hover { color: var(--gold-soft); }
    .charge { text-align: center; color: var(--faint); padding: 60px 0; letter-spacing: 3px; font-size: 13px; text-transform: uppercase; }
    .vue { animation: lever .45s ease both; }
    @keyframes lever { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .retour-haut { position: fixed; right: 22px; bottom: 22px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .retour-haut.on { opacity: 1; pointer-events: auto; }

    /* ── Carte plein écran ────────────────────────────────── */
    .carte-pleine { width: 100vw; margin-left: calc(50% - 50vw); padding: 0 10px; }
    .carte-scene { position: relative; }
    .carte-scene canvas { width: 100%; height: calc(100vh - 210px); min-height: 420px; display: block; border-radius: 10px; cursor: grab; background: rgba(20,16,12,.35); border: 1px solid var(--line); }
    .carte-controles {
      position: absolute; top: 12px; left: 12px; z-index: 5; max-width: 300px;
      background: rgba(20,17,13,.88); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; backdrop-filter: blur(6px);
      max-height: calc(100% - 24px); overflow-y: auto;
    }
    .carte-controles.replie { max-width: none; padding: 6px 10px; }
    .carte-controles .titre-bloc {
      color: var(--gold-soft); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; margin: 10px 0 6px; cursor: default;
    }
    .carte-controles .titre-bloc:first-child { margin-top: 0; }
    .carte-controles .chips { gap: 6px; margin-top: 4px; }
    .carte-controles .chip { padding: 4px 11px; font-size: 12.5px; }
    .carte-controles .plier { float: right; cursor: pointer; color: var(--faint); font-size: 12px; padding: 2px 6px; }
    .carte-controles .plier:hover { color: var(--gold-soft); }
    .carte-hud {
      position: absolute; right: 12px; top: 12px; z-index: 5; display: flex; gap: 8px;
    }
    .carte-hud .chip { background: rgba(20,17,13,.88); backdrop-filter: blur(6px); }
    .retour-carte {
      position: fixed; left: 22px; bottom: 22px; z-index: 25;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    /* ── Tactile & mobile (iPhone) ────────────────────────── */
    .carte-scene canvas, .panneau canvas, .constellation canvas { touch-action: none; }
    @media (max-width: 640px) {
      #app { padding: 0 12px 70px; }
      .seuil { padding: 46px 0 8px; }
      .quete input { font-size: 16px; padding: 13px 18px 13px 46px; }
      .portes { grid-template-columns: 1fr; gap: 12px; }
      .porte { padding: 20px 18px 16px; }
      .panneau { padding: 18px 16px; }
      .lede { font-size: 15.5px; padding-left: 14px; }
      .frise::before { left: 60px; }
      .frise .an { width: 50px; font-size: 11px; }
      .frise li { gap: 12px; }
      .colonnes { gap: 14px; }
      .carte-pleine { padding: 0 6px; }
      .carte-scene canvas { height: calc(100dvh - 250px); min-height: 340px; }
      .carte-controles { left: 6px; right: 6px; top: 6px; max-width: none; padding: 8px 10px; }
      .carte-hud { top: auto; bottom: 10px; right: 8px; }
      .etiq-temps { min-width: 0 !important; font-size: 11px !important; }
      .retour-carte { left: 12px; bottom: 12px; padding: 10px 18px; }
      .retour-haut { display: none; }
      .fiche-tete h1 { font-size: 26px; letter-spacing: 1.5px; }
      h2.section { font-size: 16px; letter-spacing: 2px; }
    }
  </style>
</head>
<body>
  <canvas id="ciel"></canvas>
  <div id="app"><div class="charge">Le voile se lève…</div></div>
  <button class="btn retour-haut" id="retourHaut" title="Remonter">↑</button>
  <script src="/vendor/marked.min.js"></script>
  <script src="/js/monde.js"></script>
</body>
</html>
