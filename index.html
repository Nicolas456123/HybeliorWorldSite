<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hybélior</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="site-nav">
    <a href="#accueil" class="site-logo">Hybélior</a>
    <ul class="nav-links">
        <li><a href="#accueil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Accueil</span>
        </a></li>
        <li><a href="#carte">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            <span>Carte</span>
        </a></li>
        <li><a href="#lore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Lore</span>
        </a></li>
        <li><a href="#gameplay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Gameplay</span>
        </a></li>
        <li><a href="#frise">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Frise</span>
        </a></li>
    </ul>
</nav>

<div class="site-layout">
    <aside id="site-sidebar" class="site-sidebar">
        <nav id="global-subtab-nav" class="subtab-nav"></nav>
        <div class="toc-title">Sommaire</div>
        <ul class="toc-list" id="sidebar-toc-list"></ul>
        <div class="toc-progress">
            <div class="toc-progress-fill" id="sidebar-toc-progress"></div>
        </div>
    </aside>
    <div id="page-container" class="page-container"></div>
</div>

<!-- Lore reader modal -->
<div id="lore-modal" class="lore-modal" role="dialog" aria-modal="true" aria-label="Lecteur de lore" hidden>
    <div class="lore-modal-backdrop"></div>
    <div class="lore-modal-panel">
        <div class="lore-modal-header">
            <h2 class="lore-modal-title" id="lore-modal-title"></h2>
            <div class="lore-modal-tabs">
                <button class="lore-tab active" data-tab="pays">Description</button>
                <button class="lore-tab" data-tab="histoires" id="lore-tab-histoires">Histoire</button>
            </div>
            <button class="lore-modal-close" aria-label="Fermer">&times;</button>
        </div>
        <div class="lore-modal-body" id="lore-modal-body">
            <div class="lore-modal-loading">Chargement…</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="/openseadragon-bin-5.0.0/openseadragon.min.js"></script>
<script src="/openseadragon-bin-5.0.0/openseadragon-svg-overlay.js"></script>
<script src="/js/map.js"></script>
<script src="/js/subtabs.js"></script>
<script src="/js/router.js"></script>
<script src="/js/lore-reader.js"></script>
</body>
</html>
