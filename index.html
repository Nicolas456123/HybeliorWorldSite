<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hybelior World Map</title>
    <script src="./openseadragon-bin-5.0.0/openseadragon.min.js"></script>
    <script src="./openseadragon-bin-5.0.0/openseadragon-svg-overlay.js"></script>
    <style>
        /* Importation de la police Copperplate-Gothic-Std-29-AB */
        @font-face {
            font-family: 'Copperplate Gothic Std';
            src: url('./Font/Copperplate-Gothic-Std-33-BC.ttf') format('truetype');
        }

    // Gestionnaires d'événements
    function initEventHandlers() {

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Style pour les boutons */
        .controls {
            position: absolute;
            top: 50px;
            left: 0;
            z-index: 1000;
            width: 220px;
            transform: translateX(calc(-100% + 20px));
            transition: transform 0.3s ease;
        }
        .controls:hover {
            transform: translateX(0);
        }
        .controls button {
            display: block;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .controls input[type="text"] {
            width: 200px;
            color: black;
            background-color: white;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        /* Contrôles de grille */
        .grid-controls {
            background-color: rgba(255,255,255,0.9);
            padding: 5px;
            border-radius: 3px;
            margin-bottom: 10px;
        }
        .grid-controls label {
            font-size: 11px;
            display: block;
            margin-bottom: 3px;
        }
        .grid-controls input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        .grid-controls input[type="number"] {
            width: 100%;
            padding: 3px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .grid-controls select {
            width: 100%;
            padding: 3px;
            margin-bottom: 5px;
        }

        /* Style pour la fenêtre d'information */
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 300px;
            max-height: calc(100vh - 20px);
            padding: 15px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-family: 'Copperplate Gothic Std', sans-serif;
            display: none;
            z-index: 1001;
            overflow: hidden;
        }  
        
        /* Section fixe (entête) */
        .info-panel-header {
            position: sticky;
            top: 0;
            background-color: white;
            padding: 0px;
            border-bottom: 1px solid #ccc;
            z-index: 10;
        }
        
        /* Contenu déroulant */
        .info-panel-content {
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 0px;
            text-align: justify;
        }

        .info-panel-content details {
            margin-bottom: 5px;
        }

        .info-panel-content summary {
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Titre (restant fixé en haut) */
        .info-panel-header h2 {
            font-family: 'Verdana', sans-serif;
            margin-top: 0;
            font-size: 20px;
            color: #333;
        }
        
        /* Texte du contenu */
        .info-panel-content p {
            font-family: 'Verdana', sans-serif;
            font-size: 14px;
            color: #666;
            white-space: pre-line;
        }
            
        .suggestions-list {
            border: 1px solid #ccc;
            background-color: white;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 200px;
            z-index: 1000;
        }

        .suggestions-list div {
            padding: 8px;
            cursor: pointer;
        }

        .suggestions-list div:hover {
            background-color: #f0f0f0;
        }
            
        #bordersElement {
            position: absolute;
            z-index: 10;
        }

        /* Timeline container at bottom */
        #timelineContainer {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 1002;
            font-family: 'Verdana', sans-serif;
            text-align: center;
        }

        #timeline {
            width: 80%;
        }

        /* Grille overlay */
        .grid-overlay {
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>

<body>
<div id="openseadragon1" style="width: 100vw; height: 100vh; position: relative;">
    <!-- Barre de recherche et boutons de contrôle -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Rechercher un nom...">
        <div id="suggestions" class="suggestions-list"></div>
        <button id="searchButton">Rechercher</button>
        <button id="toggleText">Afficher/Masquer textes</button>
        <button id="toggleBorders">Afficher les frontières</button>
        <button id="measureDistance">Mesurer distance</button>
        <button id="measureArea">Mesurer surface</button>
        
        <!-- Contrôles de grille -->
        <div class="grid-controls">
            <button id="toggleGrid">Afficher/Masquer grille</button>
            <label for="gridSizeInput">Taille grille:</label>
            <input type="number" id="gridSizeInput" min="5" max="300" value="10">
            <label for="gridTextSize">Taille texte: <span id="gridTextSizeValue">20%</span></label>
            <input type="range" id="gridTextSize" min="1" max="100" value="20" step="1">
            <label for="gridLineWidth">Épaisseur ligne: <span id="gridLineWidthValue">10%</span></label>
            <input type="range" id="gridLineWidth" min="1" max="50" value="10" step="1">
            <label for="originSelector">Origine:</label>
            <select id="originSelector">
                <option value="top-left">Haut-Gauche</option>
                <option value="top-right">Haut-Droite</option>
                <option value="bottom-left">Bas-Gauche</option>
                <option value="bottom-right">Bas-Droite</option>
            </select>
        </div>
    </div>

    <!-- Fenêtre d'information pour afficher les détails de la ville -->
    <div id="infoPanel" class="info-panel">
        <div class="info-panel-header">
            <h2 id="cityName">Nom de la ville</h2>
            <span id="closeInfoPanel" style="position:absolute; top:10px; right:10px; cursor:pointer; font-weight:bold;">&times;</span>
        </div>
        <div class="info-panel-content">
            <div id="cityInfo"></div>
        </div>
    </div>
</div>

<!-- Timeline Slider for Historical Borders -->
<div id="timelineContainer">
    <input type="range" id="timeline" min="0" max="2" value="0" step="1">
    <span id="timelineLabel"></span>
</div>

<script type="text/javascript">
    // Configuration globale
    const CONFIG = {
        worldWidthKm: 1000,
        wrapWorld: true, // Activer le wrapping du monde
        csvFiles: [
            { path: "./Data/DT_Continents.csv", fontSize: "0.03", storage: "continentsElements", xOffset: 0.03, yOffset: 0.02, zoomRange: [1, 2] },
            { path: "./Data/DT_Pays.csv", fontSize: "0.01", storage: "paysElements", xOffset: 0.015, yOffset: 0.01, zoomRange: [2, 4] },
            { path: "./Data/DT_Region.csv", fontSize: "0.004", storage: "regionElements", xOffset: 0.005, yOffset: 0.002, zoomRange: [4, 10] },
            { path: "./Data/DT_Capitales.csv", fontSize: "0.0015", storage: "capitalesElements", xOffset: 0, yOffset: 0, zoomRange: [10, Infinity] },
            { path: "./Data/DT_Cites.csv", fontSize: "0.0011", storage: "citesElements", xOffset: 0, yOffset: 0, zoomRange: [14, Infinity] },
            { path: "./Data/DT_Villes.csv", fontSize: "0.0006", storage: "villesElements", xOffset: 0, yOffset: 0, zoomRange: [16, Infinity] },
            { path: "./Data/DT_Villages.csv", fontSize: "0.0004", storage: "villagesElements", xOffset: 0, yOffset: 0, zoomRange: [18, Infinity] }
        ]
    };

    // Variables globales
    let viewer;
    let svgOverlay;
    let bordersLayer;
    let measureLayer;
    let gridLayer;
    
    // Stockage des éléments
    const elementStorage = {};
    const allNames = [];
    const allTextElements = [];
    const allRectElements = [];
    
    // États
    let textVisibilityEnabled = true;
    let measureMode = null;
    let measurePoints = [];
    let currentGridSize = 10;
    let gridVisible = false;

    // Initialisation du viewer OpenSeadragon
    function initViewer() {
        viewer = OpenSeadragon({
            id: "openseadragon1",
            prefixUrl: "./images/",
            tileSources: "./HybeliorFull/HybeliorMap.dzi",
            wrapHorizontal: false,
            wrapVertical: false,
            constrainDuringPan: false,
            showNavigationControl: true
        });
        
        svgOverlay = viewer.svgOverlay();
        initLayers();
        initEventHandlers();
        loadCSVData();
        
        if (CONFIG.wrapWorld) {
            initWorldWrapping();
        }
    }

    // Initialisation des couches SVG
    function initLayers() {
        // Couche pour les frontières
        bordersLayer = createSVGGroup('bordersLayer');
        bordersLayer.style.display = 'none';
        
        // Couche pour les mesures
        measureLayer = createSVGGroup('measureLayer');
        
        // Couche pour la grille
        gridLayer = createSVGGroup('gridLayer');
        gridLayer.classList.add('grid-overlay');
        gridLayer.style.display = 'none';
        
        // Exemple de frontière
        createSampleBorder();
        
        // Timeline
        initTimeline();
    }

    function createSVGGroup(id) {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute('id', id);
        svgOverlay.node().appendChild(group);
        return group;
    }

    function createSampleBorder() {
        const sampleBorder = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        sampleBorder.setAttribute('points', '0.45,0.45 0.55,0.45 0.55,0.55 0.45,0.55');
        sampleBorder.setAttribute('stroke', 'red');
        sampleBorder.setAttribute('fill', 'transparent');
        bordersLayer.appendChild(sampleBorder);

        // Événements hover
        sampleBorder.addEventListener('mouseover', () => {
            sampleBorder.setAttribute('fill', 'rgba(255,0,0,0.3)');
        });
        sampleBorder.addEventListener('mouseout', () => {
            sampleBorder.setAttribute('fill', 'transparent');
        });

        // Timeline pour les frontières
        const borderShapes = {
            0: '0.45,0.45 0.55,0.45 0.55,0.55 0.45,0.55',
            1: '0.40,0.45 0.60,0.45 0.60,0.55 0.40,0.55',
            2: '0.40,0.40 0.60,0.40 0.60,0.60 0.40,0.60'
        };

        window.updateBorders = function() {
            const val = parseInt(document.getElementById('timeline').value, 10);
            const points = borderShapes[val];
            if (points) {
                sampleBorder.setAttribute('points', points);
            }
        };
    }

    function initTimeline() {
        const timelineYears = ['1000', '1500', '2000'];
        const timeline = document.getElementById('timeline');
        const timelineLabel = document.getElementById('timelineLabel');

        function updateTimeline() {
            const val = parseInt(timeline.value, 10);
            timelineLabel.textContent = timelineYears[val];
            if (window.updateBorders) window.updateBorders();
        }

        updateTimeline();
        timeline.addEventListener('input', updateTimeline);
    }

    // Gestion du wrapping du monde
    function initWorldWrapping() {
        // Gestionnaire pour repositionner automatiquement quand on sort des limites
        viewer.addHandler('pan', function(event) {
            const center = viewer.viewport.getCenter();
            let newCenter = { x: center.x, y: center.y };
            let moved = false;

            // Wrapping horizontal
            if (center.x > 1) {
                newCenter.x = center.x - 1;
                moved = true;
            } else if (center.x < 0) {
                newCenter.x = center.x + 1;
                moved = true;
            }

            // Wrapping vertical
            if (center.y > 1) {
                newCenter.y = center.y - 1;
                moved = true;
            } else if (center.y < 0) {
                newCenter.y = center.y + 1;
                moved = true;
            }

            if (moved) {
                viewer.viewport.panTo(new OpenSeadragon.Point(newCenter.x, newCenter.y), true);
            }
        });
    }

    // Fonction pour dupliquer les éléments sur toutes les copies du monde
    function duplicateElementsForWrapping(originalElements) {
        if (!CONFIG.wrapWorld) return originalElements;
        
        const duplicatedElements = [...originalElements];
        
        // Créer des copies pour les 8 positions adjacentes
        const offsets = [
            {x: -1, y: -1}, {x: 0, y: -1}, {x: 1, y: -1},
            {x: -1, y: 0},                 {x: 1, y: 0},
            {x: -1, y: 1},  {x: 0, y: 1},  {x: 1, y: 1}
        ];

        originalElements.forEach(element => {
            offsets.forEach(offset => {
                const duplicatedElement = duplicateElement(element, offset);
                if (duplicatedElement) {
                    duplicatedElements.push(duplicatedElement);
                }
            });
        });
        
        return duplicatedElements;
    }

    function duplicateElement(element, offset) {
        const newCoord = {
            x: element.coord.x + offset.x,
            y: element.coord.y + offset.y
        };

        // Créer les nouveaux éléments SVG
        const newTextElement = element.text.cloneNode(true);
        const newRectElement = element.rect.cloneNode(true);

        // Mettre à jour les positions
        const currentX = parseFloat(newTextElement.getAttribute('x'));
        const currentY = parseFloat(newTextElement.getAttribute('y'));
        newTextElement.setAttribute('x', currentX + offset.x);
        newTextElement.setAttribute('y', currentY + offset.y);

        const rectX = parseFloat(newRectElement.getAttribute('x'));
        const rectY = parseFloat(newRectElement.getAttribute('y'));
        newRectElement.setAttribute('x', rectX + offset.x);
        newRectElement.setAttribute('y', rectY + offset.y);

        // Ajouter au SVG
        svgOverlay.node().appendChild(newRectElement);
        svgOverlay.node().appendChild(newTextElement);

        // Copier les gestionnaires d'événements
        if (element.clickHandler) {
            const tracker = new OpenSeadragon.MouseTracker({
                element: newRectElement,
                clickHandler: element.clickHandler
            });
        }

        // Ajouter aux listes globales
        allTextElements.push(newTextElement);
        allRectElements.push(newRectElement);

        return {
            name: element.name,
            coord: newCoord,
            text: newTextElement,
            rect: newRectElement,
            zoomRange: element.zoomRange,
            clickHandler: element.clickHandler
        };
    }
        // Fermeture du panneau d'info
        document.getElementById('closeInfoPanel').addEventListener('click', () => {
            document.getElementById('infoPanel').style.display = 'none';
        });

        // Recherche
        initSearchHandlers();

        // Boutons de contrôle
        document.getElementById('toggleText').addEventListener('click', toggleTextVisibility);
        document.getElementById('toggleBorders').addEventListener('click', toggleBorders);
        document.getElementById('measureDistance').addEventListener('click', () => startMeasure('distance'));
        document.getElementById('measureArea').addEventListener('click', () => startMeasure('area'));
        document.getElementById('toggleGrid').addEventListener('click', toggleGrid);

        // Contrôles de grille
        initGridControls();

        // Événements de zoom
        viewer.addHandler('zoom', updateTextVisibility);
        viewer.addHandler('canvas-click', handleCanvasClick);
        viewer.addHandler('canvas-double-click', handleCanvasDoubleClick);
    }

    function initSearchHandlers() {
        const searchInput = document.getElementById('searchInput');
        const suggestionsContainer = document.getElementById('suggestions');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            suggestionsContainer.innerHTML = '';

            if (query.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            const suggestions = allNames.filter(name => 
                name && name.toLowerCase().includes(query)
            ).slice(0, 10); // Limiter à 10 suggestions

            if (suggestions.length > 0) {
                suggestionsContainer.style.display = 'block';
                suggestions.forEach(suggestion => {
                    const suggestionElement = document.createElement('div');
                    suggestionElement.textContent = suggestion;
                    suggestionElement.addEventListener('click', () => {
                        searchInput.value = suggestion;
                        suggestionsContainer.style.display = 'none';
                        performSearch(suggestion);
                    });
                    suggestionsContainer.appendChild(suggestionElement);
                });
            } else {
                suggestionsContainer.style.display = 'none';
            }
        });

        document.getElementById('searchButton').addEventListener('click', () => {
            performSearch(searchInput.value);
        });
    }

    function initGridControls() {
        const gridSizeSlider = document.getElementById('gridSize');
        const gridTextSizeSlider = document.getElementById('gridTextSize');
        const originSelector = document.getElementById('originSelector');

        gridSizeSlider.addEventListener('input', function() {
            currentGridSize = parseInt(this.value);
            document.getElementById('gridSizeValue').textContent = currentGridSize;
            if (gridVisible) updateGrid();
        });

        gridTextSizeSlider.addEventListener('input', function() {
            const textSizePercent = parseInt(this.value);
            document.getElementById('gridTextSizeValue').textContent = textSizePercent + '%';
            if (gridVisible) updateGrid();
        });

        // Initialiser les valeurs affichées
        document.getElementById('gridSizeValue').textContent = currentGridSize;
        document.getElementById('gridTextSizeValue').textContent = '20%';

        originSelector.addEventListener('change', function() {
            if (gridVisible) updateGrid();
        });
    }

    // Fonctions utilitaires
    function convertCoordinates(x, y) {
        return {
            x: (x + 527.5) / 1047,
            y: (y + 535) / 1047
        };
    }

    function calculateGridCoordinates(gridX, gridY) {
        const origin = document.getElementById('originSelector').value;
        const maxX = currentGridSize - 1;
        const maxY = currentGridSize - 1;
        
        switch(origin) {
            case 'top-left': return { x: gridX, y: gridY };
            case 'top-right': return { x: maxX - gridX, y: gridY };
            case 'bottom-left': return { x: gridX, y: maxY - gridY };
            case 'bottom-right': return { x: maxX - gridX, y: maxY - gridY };
            default: return { x: gridX, y: gridY };
        }
    }

    function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let insideQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (insideQuotes) {
                if (c === '"') {
                    if (i + 1 < text.length && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        insideQuotes = false;
                    }
                } else {
                    field += c;
                }
            } else {
                if (c === '"') {
                    insideQuotes = true;
                } else if (c === ',') {
                    row.push(field);
                    field = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
        }
        
        if (field.length > 0 || row.length > 0) {
            row.push(field);
            rows.push(row);
        }
        
        const header = rows.shift();
        return rows.map(r => {
            const obj = {};
            for (let j = 0; j < header.length; j++) {
                obj[header[j]] = r[j];
            }
            return obj;
        });
    }

    // Chargement des données CSV
    function loadCSVData() {
        CONFIG.csvFiles.forEach(config => {
            elementStorage[config.storage] = [];
            loadCSVFile(config);
        });
    }

    function loadCSVFile(config) {
        fetch(config.path)
            .then(response => response.text())
            .then(text => {
                const data = parseCSV(text);
                const originalElements = [];
                
                data.forEach(item => {
                    const element = processCSVItem(item, config);
                    if (element) {
                        originalElements.push(element);
                        elementStorage[config.storage].push(element);
                    }
                });

                // Dupliquer les éléments pour le wrapping du monde
                if (CONFIG.wrapWorld && originalElements.length > 0) {
                    const duplicatedElements = duplicateElementsForWrapping(originalElements);
                    elementStorage[config.storage] = duplicatedElements;
                }
            })
            .catch(err => console.error('CSV load error for', config.path, err));
    }

    function processCSVItem(item, config) {
        const x = parseFloat(item.Coord_X);
        const y = parseFloat(item.Coord_Y);
        const name = item[''];

        if (isNaN(x) || isNaN(y) || !name) {
            return null;
        }

        const convertedCoord = convertCoordinates(x, y);
        if (isNaN(convertedCoord.x) || isNaN(convertedCoord.y)) {
            return null;
        }

        const elements = createTextAndRect(name, convertedCoord, config, item);
        
        // Créer le gestionnaire de clic
        const clickHandler = function(event) {
            event.preventDefaultAction = true;
            showInfoPanel(name, item);
        };

        const element = {
            name: name,
            coord: convertedCoord,
            text: elements.text,
            rect: elements.rect,
            zoomRange: config.zoomRange,
            clickHandler: clickHandler
        };

        // Appliquer le gestionnaire de clic
        const tracker = new OpenSeadragon.MouseTracker({
            element: elements.rect,
            clickHandler: clickHandler
        });

        allNames.push(name);
        allTextElements.push(elements.text);
        allRectElements.push(elements.rect);

        return element;
    }

    function createTextAndRect(name, coord, config, item) {
        const fontSize = parseFloat(config.fontSize);
        const strokeWidth = fontSize * 0.06;

        // Création du texte
        const textElement = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textElement.setAttribute("x", coord.x + config.xOffset);
        textElement.setAttribute("y", coord.y + config.yOffset);
        textElement.setAttribute("fill", "white");
        textElement.setAttribute("stroke", "black");
        textElement.setAttribute("stroke-width", strokeWidth);
        textElement.setAttribute("font-size", fontSize);
        textElement.setAttribute("text-anchor", "middle");
        textElement.setAttribute("font-family", "Copperplate Gothic Std, sans-serif");
        textElement.setAttribute("pointer-events", "none");
        textElement.textContent = name;

        // Création du rectangle de collision
        const textWidth = name.length * fontSize * 0.6;
        const textHeight = fontSize * 1.1;

        const rectElement = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rectElement.setAttribute("x", coord.x + config.xOffset - textWidth / 2);
        rectElement.setAttribute("y", coord.y + config.yOffset - textHeight + (fontSize * 0.3));
        rectElement.setAttribute("width", textWidth);
        rectElement.setAttribute("height", textHeight);
        rectElement.setAttribute("fill", "transparent");
        rectElement.setAttribute("pointer-events", "all");

        // Ajout des éléments au SVG
        svgOverlay.node().appendChild(rectElement);
        svgOverlay.node().appendChild(textElement);

        return { text: textElement, rect: rectElement };
    }

    function showInfoPanel(name, item) {
        document.getElementById('cityName').textContent = name;
        
        const infoContent = `
            <p>${item['Description'] || 'Non disponible'}</p>
            <details>
                <summary>Gouvernement</summary>
                <p>${item['Gouvernement'] || 'Non disponible'}</p>
            </details>
            <details>
                <summary>Culture</summary>
                <p>${item['Culture'] || 'Non disponible'}</p>
            </details>
            <details>
                <summary>Histoire Marquante</summary>
                <p>${item['Histoire marquante'] || 'Non disponible'}</p>
            </details>
        `;
        
        document.getElementById('cityInfo').innerHTML = infoContent;
        document.getElementById('infoPanel').style.display = 'block';
    }

    // Gestion de la visibilité
    function updateTextVisibility() {
        if (!textVisibilityEnabled) {
            allTextElements.forEach(el => el.style.display = 'none');
            allRectElements.forEach(el => el.style.display = 'none');
            return;
        }

        const zoomLevel = viewer.viewport.getZoom();

        Object.values(elementStorage).forEach(elements => {
            elements.forEach(element => {
                const [minZoom, maxZoom] = element.zoomRange;
                const display = (zoomLevel >= minZoom && zoomLevel < maxZoom) ? 'block' : 'none';
                element.text.style.display = display;
                element.rect.style.display = display;
            });
        });
    }

    function toggleTextVisibility() {
        textVisibilityEnabled = !textVisibilityEnabled;
        updateTextVisibility();
    }

    function toggleBorders() {
        bordersLayer.style.display = bordersLayer.style.display === 'none' ? 'block' : 'none';
    }

    // Fonction de recherche
    function performSearch(query) {
        const lowerQuery = query.toLowerCase();
        let found = false;
        let closestElement = null;
        let minDistance = Infinity;

        // Obtenir le centre actuel de la vue
        const viewCenter = viewer.viewport.getCenter();

        Object.values(elementStorage).forEach((elements, index) => {
            elements.forEach(element => {
                if (element.name && element.name.toLowerCase() === lowerQuery) {
                    found = true;
                    
                    // Calculer la distance au centre de la vue pour trouver l'élément le plus proche
                    const dx = element.coord.x - viewCenter.x;
                    const dy = element.coord.y - viewCenter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestElement = { element, index };
                    }
                }
            });
        });

        if (found && closestElement) {
            const point = new OpenSeadragon.Point(closestElement.element.coord.x, closestElement.element.coord.y);
            viewer.viewport.panTo(point);
            
            // Zoom adaptatif selon le type
            const zoomLevels = [1.9, 3.9, 9.9, 13.9, 15.9, 17.9, 19.9];
            viewer.viewport.zoomTo(zoomLevels[closestElement.index] || 4);
        }

        if (!found) {
            alert("Aucun résultat trouvé pour " + query);
        }
    }

    // Gestion de la grille
    function toggleGrid() {
        gridVisible = !gridVisible;
        if (gridVisible) {
            createGrid();
            gridLayer.style.display = 'block';
        } else {
            gridLayer.style.display = 'none';
        }
    }

    function createGrid() {
        // Vider la grille existante
        while (gridLayer.firstChild) {
            gridLayer.removeChild(gridLayer.firstChild);
        }

        const textSizePercent = parseInt(document.getElementById('gridTextSize').value);
        const lineWidthPercent = parseInt(document.getElementById('gridLineWidth').value);
        const tileSize = 1 / currentGridSize; // Taille d'un tile
        const textSize = (textSizePercent / 100) * tileSize; // 100% = taille d'un tile, 1% = 1% d'un tile
        const lineWidth = (lineWidthPercent / 100) * tileSize; // Épaisseur de ligne proportionnelle au tile

        // Optimisation pour les grandes grilles
        const isLargeGrid = currentGridSize > 125;
        const labelStep = isLargeGrid ? Math.ceil(currentGridSize / 50) : 1; // Afficher moins de labels sur les grandes grilles

        // Déterminer les copies à créer pour le wrapping
        const worldCopies = CONFIG.wrapWorld ? [
            {x: -1, y: -1}, {x: 0, y: -1}, {x: 1, y: -1},
            {x: -1, y: 0},  {x: 0, y: 0},  {x: 1, y: 0},
            {x: -1, y: 1},  {x: 0, y: 1},  {x: 1, y: 1}
        ] : [{x: 0, y: 0}];

        worldCopies.forEach(worldOffset => {
            // Créer les lignes de grille pour chaque copie du monde
            for (let i = 0; i <= currentGridSize; i++) {
                // Lignes horizontales
                const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                hLine.setAttribute('x1', worldOffset.x);
                hLine.setAttribute('y1', worldOffset.y + i / currentGridSize);
                hLine.setAttribute('x2', worldOffset.x + 1);
                hLine.setAttribute('y2', worldOffset.y + i / currentGridSize);
                hLine.setAttribute('stroke', 'rgba(255,255,255,0.5)');
                hLine.setAttribute('stroke-width', lineWidth);
                gridLayer.appendChild(hLine);

                // Lignes verticales
                const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                vLine.setAttribute('x1', worldOffset.x + i / currentGridSize);
                vLine.setAttribute('y1', worldOffset.y);
                vLine.setAttribute('x2', worldOffset.x + i / currentGridSize);
                vLine.setAttribute('y2', worldOffset.y + 1);
                vLine.setAttribute('stroke', 'rgba(255,255,255,0.5)');
                vLine.setAttribute('stroke-width', lineWidth);
                gridLayer.appendChild(vLine);
            }

            // Créer les étiquettes de grille (optimisées pour les grandes grilles)
            if (!isLargeGrid || textSize > 0.0001) { // Ne pas afficher les labels si trop petits
                for (let x = 0; x < currentGridSize; x += labelStep) {
                    for (let y = 0; y < currentGridSize; y += labelStep) {
                        const coords = calculateGridCoordinates(x, y);
                        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        
                        label.setAttribute("x", worldOffset.x + (x + 0.5) / currentGridSize);
                        label.setAttribute("y", worldOffset.y + (y + 0.5) / currentGridSize);
                        label.setAttribute("fill", "yellow");
                        label.setAttribute("font-size", textSize);
                        label.setAttribute("text-anchor", "middle");
                        label.setAttribute("dominant-baseline", "middle");
                        label.setAttribute("font-family", "Verdana, sans-serif");
                        label.setAttribute("pointer-events", "none");
                        label.textContent = `${coords.x},${coords.y}`;
                        
                        gridLayer.appendChild(label);
                    }
                }
            }
        });

        // Afficher un message d'optimisation si nécessaire
        if (isLargeGrid) {
            console.log(`Grille optimisée (${currentGridSize}x${currentGridSize}): labels affichés avec un pas de ${labelStep}`);
        }
    }

    function updateGrid() {
        if (gridVisible) {
            createGrid();
        }
    }

    // Outils de mesure
    function startMeasure(mode) {
        measureMode = mode;
        resetMeasure();
    }

    function resetMeasure() {
        measurePoints = [];
        while (measureLayer.firstChild) {
            measureLayer.removeChild(measureLayer.firstChild);
        }
    }

    function distanceKm(p1, p2) {
        const dx = (p2.x - p1.x) * CONFIG.worldWidthKm;
        const dy = (p2.y - p1.y) * CONFIG.worldWidthKm;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function polygonArea(points) {
        let area = 0;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
            area += (points[j].x * points[i].y) - (points[i].x * points[j].y);
        }
        area = Math.abs(area / 2);
        return area * CONFIG.worldWidthKm * CONFIG.worldWidthKm;
    }

    function showLabel(text, coord) {
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", coord.x);
        label.setAttribute("y", coord.y);
        label.setAttribute("fill", "yellow");
        label.setAttribute("font-size", "0.02");
        label.setAttribute("font-family", "Verdana, sans-serif");
        label.setAttribute("pointer-events", "none");
        label.textContent = text;
        measureLayer.appendChild(label);
    }

    function handleCanvasClick(event) {
        if (!measureMode) return;
        event.preventDefaultAction = true;
        
        const webPoint = event.position;
        const point = viewer.viewport.pointFromPixel(webPoint);
        measurePoints.push(point);

        if (measureMode === 'distance' && measurePoints.length === 2) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1', measurePoints[0].x);
            line.setAttribute('y1', measurePoints[0].y);
            line.setAttribute('x2', measurePoints[1].x);
            line.setAttribute('y2', measurePoints[1].y);
            line.setAttribute('stroke', 'yellow');
            line.setAttribute('stroke-width', '0.005');
            measureLayer.appendChild(line);

            const dist = distanceKm(measurePoints[0], measurePoints[1]);
            const midX = (measurePoints[0].x + measurePoints[1].x) / 2;
            const midY = (measurePoints[0].y + measurePoints[1].y) / 2;
            const dx = measurePoints[1].x - measurePoints[0].x;
            const dy = measurePoints[1].y - measurePoints[0].y;
            const len = Math.sqrt(dx*dx + dy*dy);
            const offset = 0.02;
            const offX = -dy/len * offset;
            const offY = dx/len * offset;
            showLabel(dist.toFixed(2) + ' km', { x: midX + offX, y: midY + offY });
            measureMode = null;
        }
    }

    function handleCanvasDoubleClick() {
        if (measureMode === 'area' && measurePoints.length > 2) {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('points', measurePoints.map(p => p.x + ',' + p.y).join(' '));
            poly.setAttribute('stroke', 'yellow');
            poly.setAttribute('fill', 'rgba(255,255,0,0.3)');
            poly.setAttribute('stroke-width', '0.003');
            
            // Vider la couche et ajouter le polygone
            while (measureLayer.firstChild) {
                measureLayer.removeChild(measureLayer.firstChild);
            }
            measureLayer.appendChild(poly);

            const area = polygonArea(measurePoints);
            showLabel(area.toFixed(2) + ' km²', measurePoints[0]);
            measureMode = null;
        }
    }

    // Initialisation
    document.addEventListener('DOMContentLoaded', initViewer);
</script>
