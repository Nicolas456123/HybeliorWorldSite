<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hybelior World Map</title>
    <script src="./openseadragon-bin-5.0.0/openseadragon.min.js"></script>
    <script src="./openseadragon-bin-5.0.0/openseadragon-svg-overlay.js"></script>
    <style>
        /* Importation de la police Copperplate-Gothic-Std-29-AB */
        @font-face {
            font-family: 'Copperplate Gothic Std';
            src: url('./Font/Copperplate-Gothic-Std-33-BC.ttf') format('truetype');
        }

        /* Style pour les boutons */
        .controls {
            position: absolute;
            top: 50px;
            left: 0;
            z-index: 1000;
            width: 220px;
            transform: translateX(calc(-100% + 20px));
            transition: transform 0.3s ease;
        }
        .controls:hover {
            transform: translateX(0);
        }
        .controls button {
            display: block;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
	.controls input[type="text"], .controls input[type="number"] {
            width: 200px;
            color: black;
            background-color: white;
            padding: 8px;
        }
        .controls input[type="number"] {
            width: 80px;
        }
        /* Style pour la fenêtre d'information */
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 300px;
	    /*height: auto; /* Hauteur automatique en fonction du contenu */
            max-height: calc(100vh - 20px); /* Hauteur maximale de 600px */
            padding: 15px; /* On retire le padding ici pour mieux gérer dans les sous-div */
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-family: 'Copperplate Gothic Std', sans-serif;
            display: none; /* Caché par défaut */
            z-index: 1001; /* S'assurer que la fenêtre est au-dessus des autres éléments */
	    overflow: hidden; /* Empêcher le débordement */
        }  
	/* Section fixe (entête) */
	.info-panel-header {
	    position: sticky;
	    top: 0;
	    background-color: white;
	    padding: 0px;
	    border-bottom: 1px solid #ccc;
	    z-index: 10; /* Assurez-vous qu'il est au-dessus du contenu défilant */
	}
	
	/* Contenu déroulant */
        .info-panel-content {
            max-height: calc(100vh - 60px); /* Ajuster en fonction de l'en-tête */
            overflow-y: auto; /* Barre de défilement verticale si nécessaire */
            padding: 0px;
            text-align: justify; /* Justifier le texte */
        }

        .info-panel-content details {
            margin-bottom: 5px;
        }

        .info-panel-content summary {
            font-weight: bold;
            cursor: pointer;
        }
	
	/* Titre (restant fixé en haut) */
	.info-panel-header h2 {
	    font-family: 'Verdana', sans-serif; /* Police pour le titre */
	    margin-top: 0;
	    font-size: 20px;
	    color: #333;
	}
	
	/* Texte du contenu */
	.info-panel-content p {
	    font-family: 'Verdana', sans-serif; /* Police pour les paragraphes */
	    font-size: 14px;
	    color: #666;
     white-space: pre-line; /* Conserve les sauts de ligne dans le texte */
	}
	    
	.suggestions-list {
		border: 1px solid #ccc;
		background-color: white;
		max-height: 150px;
		overflow-y: auto;
		display: none; /* Caché par défaut */
		position: absolute;
		width: 200px;
		z-index: 1000;
	}

	.suggestions-list div {
		padding: 8px;
		cursor: pointer;
	}

	.suggestions-list div:hover {
		background-color: #f0f0f0;
	}
		
        #bordersElement {
                position: absolute;
                z-index: 10; /* Assurez-vous que la carte a un z-index inférieur */
        }

        /* Timeline container at bottom */
        #timelineContainer {
                position: fixed;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgba(255,255,255,0.8);
                padding: 10px;
                border-radius: 5px;
                z-index: 1002;
                font-family: 'Verdana', sans-serif;
                text-align: center;
        }

        #timeline {
                width: 80%;
        }
    </style>
</head>

<body>
<div id="openseadragon1" style="width: calc(100% - 20px); height: calc(100% - 20px); position: relative;">
    <!-- Barre de recherche et boutons de contrôle -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Rechercher un nom...">
            <div id="suggestions" class="suggestions-list"></div> <!-- Conteneur pour les suggestions -->
            <button id="searchButton">Rechercher</button>
            <button id="toggleText">Afficher/Masquer textes</button>
            <button id="toggleBorders">Afficher les frontières</button>
            <button id="toggleGrid">Afficher quadrillage</button>
            <div style="margin-bottom: 10px;">
                <label style="color: white; font-size: 12px;">Tuiles (2-10000):</label>
                <input type="number" id="gridSize" min="2" max="10000" value="16" style="width: 80px; margin-left: 5px;">
                <button id="updateGrid" style="margin-left: 5px; padding: 5px;">MAJ</button>
            </div>
            <button id="measureDistance">Mesurer distance</button>
            <button id="measureArea">Mesurer surface</button>
        </div>

    <!-- Fenêtre d'information pour afficher les détails de la ville -->
    <div id="infoPanel" class="info-panel">
        <!-- Section fixe avec le titre et le bouton de fermeture -->
        <div class="info-panel-header">
            <h2 id="cityName">Nom de la ville</h2>
            <span id="closeInfoPanel" style="position:absolute; top:10px; right:10px; cursor:pointer; font-weight:bold;">&times;</span>
        </div>
        <!-- Section déroulante avec le contenu -->
        <div class="info-panel-content">
            <div id="cityInfo"></div>
        </div>
    </div>
</div>

<!-- Timeline Slider for Historical Borders -->
<div id="timelineContainer">
    <input type="range" id="timeline" min="0" max="2" value="0" step="1">
    <span id="timelineLabel"></span>
</div>


<script type="text/javascript">
    var viewer = OpenSeadragon({
        id: "openseadragon1",
        prefixUrl: "./images/",
        tileSources: "./HybeliorFull/HybeliorMap.dzi"
    });
    
    document.getElementById('closeInfoPanel').addEventListener('click', function() {
        document.getElementById('infoPanel').style.display = 'none';
    });
	
    // Ajouter l'overlay SVG
    var svgOverlay = viewer.svgOverlay();

    // Couche pour les frontières
    var bordersLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
    bordersLayer.setAttribute('id', 'bordersLayer');
    bordersLayer.style.display = 'none';
    svgOverlay.node().appendChild(bordersLayer);

    // Canvas pour le quadrillage (plus rapide que SVG)
    var gridCanvas = document.createElement('canvas');
    gridCanvas.style.position = 'absolute';
    gridCanvas.style.top = '0';
    gridCanvas.style.left = '0';
    gridCanvas.style.pointerEvents = 'none';
    gridCanvas.style.zIndex = '10';
    gridCanvas.style.display = 'none';
    document.getElementById('openseadragon1').appendChild(gridCanvas);
    var gridCtx = gridCanvas.getContext('2d');

    // Variables pour le quadrillage
    var currentGridSize = 16;
    var gridVisible = false;
    var gridUpdateTimeout = null;

    // Exemple de polygone de frontière
    var sampleBorder = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    sampleBorder.setAttribute('points', '0.45,0.45 0.55,0.45 0.55,0.55 0.45,0.55');
    sampleBorder.setAttribute('stroke', 'red');
    sampleBorder.setAttribute('fill', 'transparent');
    bordersLayer.appendChild(sampleBorder);

    // Formes de frontière selon la période historique
    var borderShapes = {
        0: '0.45,0.45 0.55,0.45 0.55,0.55 0.45,0.55',
        1: '0.40,0.45 0.60,0.45 0.60,0.55 0.40,0.55',
        2: '0.40,0.40 0.60,0.40 0.60,0.60 0.40,0.60'
    };

    var timelineYears = ['1000', '1500', '2000'];

    var timeline = document.getElementById('timeline');
    var timelineLabel = document.getElementById('timelineLabel');

    function updateBorders() {
        var val = parseInt(timeline.value, 10);
        var points = borderShapes[val];
        if (points) {
            sampleBorder.setAttribute('points', points);
        }
        timelineLabel.textContent = timelineYears[val];
    }

    // Initial display
    updateBorders();
    timeline.addEventListener('input', updateBorders);

    sampleBorder.addEventListener('mouseover', function() {
        sampleBorder.setAttribute('fill', 'rgba(255,0,0,0.3)');
    });
    sampleBorder.addEventListener('mouseout', function() {
        sampleBorder.setAttribute('fill', 'transparent');
    });

    // Fonction pour redimensionner et positionner le canvas
    function updateCanvasSize() {
        var containerElement = document.getElementById('openseadragon1');
        var rect = containerElement.getBoundingClientRect();
        
        gridCanvas.width = rect.width;
        gridCanvas.height = rect.height;
        gridCanvas.style.width = rect.width + 'px';
        gridCanvas.style.height = rect.height + 'px';
    }

    // Fonction pour dessiner le quadrillage sur canvas (ultra-rapide)
    function drawGrid() {
        if (!gridVisible) return;
        
        updateCanvasSize();
        
        // Effacer le canvas
        gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
        
        var viewport = viewer.viewport;
        var zoom = viewport.getZoom();
        var bounds = viewport.getBounds();
        
        // Calculer l'épaisseur des lignes selon le zoom
        var lineWidth = Math.max(0.5, 3 / zoom);
        // Pour les gros quadrillages, garder une épaisseur minimale plus importante
        if (currentGridSize >= 500) {
            lineWidth = Math.max(1, lineWidth);
        }
        lineWidth = Math.min(lineWidth, 4); // Limiter l'épaisseur max
        
        gridCtx.strokeStyle = '#00ff00';
        gridCtx.lineWidth = lineWidth;
        gridCtx.globalAlpha = 0.7;
        
        var stepSize = 1.0 / currentGridSize;
        
        // Calculer les limites visibles en coordonnées de grille
        var startX = Math.max(0, Math.floor(bounds.x / stepSize));
        var endX = Math.min(currentGridSize, Math.ceil((bounds.x + bounds.width) / stepSize) + 1);
        var startY = Math.max(0, Math.floor(bounds.y / stepSize));
        var endY = Math.min(currentGridSize, Math.ceil((bounds.y + bounds.height) / stepSize) + 1);
        
        gridCtx.beginPath();
        
        // Dessiner les lignes verticales
        for (var i = startX; i <= endX; i++) {
            var worldX = i * stepSize;
            var pixelPos = viewport.viewportToWindowCoordinates(new OpenSeadragon.Point(worldX, 0));
            var x = pixelPos.x;
            
            gridCtx.moveTo(x, 0);
            gridCtx.lineTo(x, gridCanvas.height);
        }
        
        // Dessiner les lignes horizontales
        for (var j = startY; j <= endY; j++) {
            var worldY = j * stepSize;
            var pixelPos = viewport.viewportToWindowCoordinates(new OpenSeadragon.Point(0, worldY));
            var y = pixelPos.y;
            
            gridCtx.moveTo(0, y);
            gridCtx.lineTo(gridCanvas.width, y);
        }
        
        gridCtx.stroke();
        
        // Dessiner les numéros si le zoom est suffisant
        var visibleCells = (endX - startX) * (endY - startY);
        // Seuil plus permissif pour les gros quadrillages
        var zoomThreshold = currentGridSize >= 500 ? currentGridSize / 500 : currentGridSize / 200;
        var shouldShowNumbers = zoom > zoomThreshold && visibleCells < 3000;
        
        if (shouldShowNumbers) {
            // Calculer la taille d'une case en pixels
            var stepSizeInPixels = viewport.viewportToWindowCoordinates(new OpenSeadragon.Point(stepSize, 0)).x - 
                                   viewport.viewportToWindowCoordinates(new OpenSeadragon.Point(0, 0)).x;
            
            // Largeur et hauteur de case disponibles (avec marge de sécurité)
            var maxWidth = Math.abs(stepSizeInPixels) * 0.9;
            var maxHeight = Math.abs(stepSizeInPixels) * 0.7;
            
            // Taille de police de départ
            var fontSize = Math.max(6, Math.min(30, 400 / currentGridSize * Math.pow(zoom, 0.3)));
            
            gridCtx.font = fontSize + 'px Verdana';
            
            // Test avec un texte représentatif de la longueur max possible
            var sampleText = (currentGridSize-1) + ";" + (currentGridSize-1);
            var textWidth = gridCtx.measureText(sampleText).width;
            
            // Réduire la taille si le texte dépasse
            while (textWidth > maxWidth && fontSize > 4) {
                fontSize--;
                gridCtx.font = fontSize + 'px Verdana';
                textWidth = gridCtx.measureText(sampleText).width;
            }
            
            // Vérifier aussi la hauteur (approximative)
            while (fontSize > maxHeight && fontSize > 4) {
                fontSize--;
            }
            
            // Ne pas afficher si trop petit
            if (fontSize < 5) {
                return;
            }
            
            gridCtx.font = fontSize + 'px Verdana';
            gridCtx.fillStyle = '#00ff00';
            gridCtx.strokeStyle = '#000000';
            gridCtx.lineWidth = Math.max(0.5, fontSize / 15);
            gridCtx.textAlign = 'center';
            gridCtx.textBaseline = 'middle';
            gridCtx.globalAlpha = 0.9;
            
            // Dessiner les textes des cases visibles
            for (var x = Math.max(0, startX); x < Math.min(currentGridSize, endX); x++) {
                for (var y = Math.max(0, startY); y < Math.min(currentGridSize, endY); y++) {
                    var centerX = (x + 0.5) * stepSize;
                    var centerY = (y + 0.5) * stepSize;
                    
                    var pixelCenter = viewport.viewportToWindowCoordinates(new OpenSeadragon.Point(centerX, centerY));
                    
                    // Vérifier si le texte est visible
                    if (pixelCenter.x >= -50 && pixelCenter.x <= gridCanvas.width + 50 &&
                        pixelCenter.y >= -50 && pixelCenter.y <= gridCanvas.height + 50) {
                        
                        var text = x + ';' + y;
                        gridCtx.strokeText(text, pixelCenter.x, pixelCenter.y);
                        gridCtx.fillText(text, pixelCenter.x, pixelCenter.y);
                    }
                }
            }
        }
    }

    // Fonction optimisée pour planifier les mises à jour
    function scheduleGridUpdate(immediate) {
        if (!gridVisible) return;
        
        if (gridUpdateTimeout) {
            clearTimeout(gridUpdateTimeout);
        }
        
        if (immediate) {
            drawGrid();
        } else {
            // Délai minimal pour éviter trop de redraws pendant le zoom
            gridUpdateTimeout = setTimeout(drawGrid, 1);
        }
    }

    // Fonction pour créer/mettre à jour le quadrillage
    function createGrid(gridSize) {
        currentGridSize = gridSize || parseInt(document.getElementById('gridSize').value, 10) || 16;
        if (gridVisible) {
            drawGrid();
        }
    }

    // Fonction vide pour compatibilité (plus utilisée)
    function updateGridStrokeWidth() {
        scheduleGridUpdate(true); // Mise à jour immédiate
    }

    // Arrays pour stocker les éléments par type
    var continentsElements = [];
    var paysElements = [];
    var regionElements = [];
    var capitalesElements = [];
    var citesElements = [];
    var villesElements = [];
    var villagesElements = [];
    var allTextElements = [];  // Pour toggle global
    var allRectElements = [];  // Pour toggle des rectangles
    // Variable pour stocker tous les noms (pays, continents, etc.)
    var allNames = [];
    // État d'activation de l'affichage des textes
    var textVisibilityEnabled = true;

    // Fonction de conversion des coordonnées pour les adapter à OpenSeadragon
    function convertCoordinates(x, y) {
        return {
            x: (x + 527.5) / 1047,  // Ajustement des coordonnées
            y: (y + 535) / 1047
        };
    }

    // Analyse simple du CSV sans bibliothèque externe
    function parseCSV(text) {
        var rows = [];
        var row = [];
        var field = '';
        var insideQuotes = false;
        for (var i = 0; i < text.length; i++) {
            var c = text[i];
            if (insideQuotes) {
                if (c === '"') {
                    if (i + 1 < text.length && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        insideQuotes = false;
                    }
                } else {
                    field += c;
                }
            } else {
                if (c === '"') {
                    insideQuotes = true;
                } else if (c === ',') {
                    row.push(field);
                    field = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
        }
        if (field.length > 0 || row.length > 0) {
            row.push(field);
            rows.push(row);
        }
        var header = rows.shift();
        return rows.map(function(r) {
            var obj = {};
            for (var j = 0; j < header.length; j++) {
                obj[header[j]] = r[j];
            }
            return obj;
        });
    }

    function addTextAndRectFromCSV(filePath, fontSize, storageArray, xOffset, yOffset) {
        fetch(filePath)
            .then(function(resp) { return resp.text(); })
            .then(function(text) {
                var data = parseCSV(text);
                data.forEach(function(item) {
                    var x = parseFloat(item.Coord_X);
                    var y = parseFloat(item.Coord_Y);
                    
                    if (isNaN(x) || isNaN(y)) {
                        console.error("Invalid coordinate:", x, y);
                        return; // Ignorer cet élément si les coordonnées ne sont pas valides
                    }
                    					
                    var convertedCoord = convertCoordinates(x, y);
                    
                    if (isNaN(convertedCoord.x) || isNaN(convertedCoord.y)) {
                        console.error("Converted coordinates are invalid:", convertedCoord);
                        return; // Ignorer cet élément si les coordonnées converties ne sont pas valides
                    }
					
					// Assurez-vous que 'nom' est bien récupéré
					var name = item[''];
					console.log("Processing: " + name);  // Log pour vérifier le nom

					if (!name) {
						console.error("No name found for item with coordinates:", x, y);
						return; // Ignorer cet élément si le nom est indéfini ou vide
					}

                    // Calcul dynamique de l'épaisseur du contour en fonction de la taille du texte
                    var strokeWidth = fontSize * 0.06;
                    
                    // Création et configuration de l'élément texte SVG
                    var textElement = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    textElement.setAttribute("x", convertedCoord.x + xOffset);
					textElement.setAttribute("y", convertedCoord.y + yOffset);
                    textElement.setAttribute("fill", "white"); // Couleur du texte
                    textElement.setAttribute("stroke", "black"); // Couleur du contour du texte
                    textElement.setAttribute("stroke-width", strokeWidth); // Épaisseur du contour
                    textElement.setAttribute("font-size", fontSize); // Taille de la police
                    textElement.setAttribute("text-anchor", "middle"); // Centrage du texte
                    textElement.setAttribute("font-family", "Copperplate Gothic Std, sans-serif"); // Police personnalisée
                    textElement.setAttribute("pointer-events", "none");
                    textElement.textContent = name;  // Texte provenant du CSV

                    // Calcul de la largeur et de la hauteur du rectangle basé sur le texte
                    var textWidth = item[''].length * fontSize * 0.6; // Ajustez selon votre police
                    var textHeight = fontSize * 1.1; // Ajouter un peu de marge pour le texte

                    // Création et configuration de l'élément rectangle SVG
                    var rectElement = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rectElement.setAttribute("x", convertedCoord.x + xOffset - textWidth / 2);
					rectElement.setAttribute("y", convertedCoord.y + yOffset - textHeight + (fontSize * 0.3));
                    rectElement.setAttribute("width", textWidth);
                    rectElement.setAttribute("height", textHeight);
                    rectElement.setAttribute("fill", "transparent"); // Changez "none" à une couleur si vous voulez le voir
                    rectElement.setAttribute("pointer-events", "all"); // Assure que le rect capte les événements de clic

                    // Ajouter les éléments à l'overlay
                    svgOverlay.node().appendChild(rectElement);
                    svgOverlay.node().appendChild(textElement);
										
			// Ajouter un gestionnaire de clic uniquement au rectangle
			var tracker = new OpenSeadragon.MouseTracker({
				element: rectElement,  // Événements de clic seulement sur le rectangle
				clickHandler: function(event) {
					event.preventDefaultAction = true; // Empêche le zoom
					document.getElementById('cityName').textContent = name; // Nom du pays
					
					// Construire le contenu de l'info-bulle avec les informations supplémentaires
                                            var infoContent = `
                                                <p>${item['Description'] || 'Non disponible'}</p>
                                                <details>
                                                    <summary>Gouvernement</summary>
                                                    <p>${item['Gouvernement'] || 'Non disponible'}</p>
                                                </details>
                                                <details>
                                                    <summary>Culture</summary>
                                                    <p>${item['Culture'] || 'Non disponible'}</p>
                                                </details>
                                                <details>
                                                    <summary>Histoire Marquante</summary>
                                                    <p>${item['Histoire marquante'] || 'Non disponible'}</p>
                                                </details>
                                            `;
					document.getElementById('cityInfo').innerHTML = infoContent; // Remplir l'info-bulle avec les détails du pays
					document.getElementById('infoPanel').style.display = 'block'; // Afficher la fenêtre d'information
				}
			});

                    // Stocker les éléments pour une gestion facile
                    storageArray.push({name: name, coord: convertedCoord, text: textElement, rect: rectElement});
					allNames.push(name); // Ajouter le nom à la liste de tous les noms
                    allTextElements.push(textElement);
                    allRectElements.push(rectElement);
                });
            })
            .catch(function(err) { console.error('CSV parse error', err); });
    }
	// Ajouter les textes et rectangles pour les continents, pays, régions et autres en fonction de leur niveau de zoom
	addTextAndRectFromCSV("./Data/DT_Continents.csv", "0.03", continentsElements, 0.03, 0.02);
	addTextAndRectFromCSV("./Data/DT_Pays.csv", "0.01", paysElements, 0.015, 0.01);
	addTextAndRectFromCSV("./Data/DT_Region.csv", "0.004", regionElements, 0.005, 0.002);	
	addTextAndRectFromCSV("./Data/DT_Villes.csv", "0.0006", villesElements, 0, 0);
	addTextAndRectFromCSV("./Data/DT_Cites.csv", "0.0011", citesElements, 0, 0); 
	addTextAndRectFromCSV("./Data/DT_Villages.csv", "0.0004", villagesElements, 0, 0);
	addTextAndRectFromCSV("./Data/DT_Capitales.csv", "0.0015", capitalesElements, 0, 0);

	// Gestion de la saisie dans la barre de recherche
	document.getElementById('searchInput').addEventListener('input', function() {
		var query = this.value.toLowerCase();
		var suggestionsContainer = document.getElementById('suggestions');
		suggestionsContainer.innerHTML = ''; // Vider les anciennes suggestions

		if (query.length === 0) {
			suggestionsContainer.style.display = 'none';
			return;
		}

		var suggestions = allNames.filter(function(name) {
			return name && name.toLowerCase().includes(query);  // Vérification que name est défini
		});

		if (suggestions.length > 0) {
			suggestionsContainer.style.display = 'block';
			suggestions.forEach(function(suggestion) {
				var suggestionElement = document.createElement('div');
				suggestionElement.textContent = suggestion;
				suggestionElement.addEventListener('click', function() {
					document.getElementById('searchInput').value = suggestion;
					suggestionsContainer.style.display = 'none';
				});
				suggestionsContainer.appendChild(suggestionElement);
			});
		} else {
			suggestionsContainer.style.display = 'none';
		}
	});

	// Fonction de recherche et de zoom
	document.getElementById('searchButton').addEventListener('click', function() {
		var query = document.getElementById('searchInput').value.toLowerCase();
		var found = false;

		[continentsElements, paysElements, regionElements, capitalesElements, citesElements, villesElements, villagesElements].forEach(function(elementsArray, index) {
			elementsArray.forEach(function(element) {
				if (element.name && element.name.toLowerCase() === query) {
					found = true;
					// Utilisation des coordonnées de l'image pour centrer la vue
					var point = new OpenSeadragon.Point(element.coord.x, element.coord.y);
					viewer.viewport.panTo(point);  // Centre la vue sur le point

					// Ajuster le niveau de zoom en fonction du type d'élément
					var zoomLevel;
			                    switch (index) {
			                        case 0: // Continents
			                            zoomLevel = 1.9;
			                            break;
			                        case 1: // Pays
			                            zoomLevel = 3.9;
			                            break;
			                        case 2: // Régions
			                            zoomLevel = 9.9;
			                            break;
			                        case 3: // Capitales
			                            zoomLevel = 13.9;
			                            break;
			                        case 4: // Cités
			                            zoomLevel = 15.9;
			                            break;
			                        case 5: // Villes
			                            zoomLevel = 17.9;
			                            break;
			                        case 6: // Villages
			                            zoomLevel = 19.9;
			                            break;
			                        default:
			                            zoomLevel = 4;
			                            break;
			                    }
				viewer.viewport.zoomTo(zoomLevel); // Appliquer le niveau de zoom	
				}
			});
		});

		if (!found) {
			alert("Aucun résultat trouvé pour " + query);
		}
	});


    // Fonction pour afficher/masquer les éléments en fonction du zoom
    function updateTextVisibility() {
        if (!textVisibilityEnabled) {
            allTextElements.forEach(function(textElement) {
                textElement.style.display = 'none';
            });
            allRectElements.forEach(function(rectElement) {
                rectElement.style.display = 'none';
            });
            return;
        }

        var zoomLevel = viewer.viewport.getZoom();

        // Gestion de la visibilité pour les continents
        continentsElements.forEach(function(element) {
            var display = (zoomLevel >= 1 && zoomLevel < 2) ? 'block' : 'none';
            element.text.style.display = display;
            element.rect.style.display = display;
        });

        // Gestion de la visibilité pour les pays
        paysElements.forEach(function(element) {
            var display = (zoomLevel >= 2 && zoomLevel < 4) ? 'block' : 'none';
            element.text.style.display = display;
            element.rect.style.display = display;
        });

        // Gestion de la visibilité pour les régions
        regionElements.forEach(function(element) {
            var display = (zoomLevel >= 4 && zoomLevel < 10) ? 'block' : 'none';
            element.text.style.display = display;
            element.rect.style.display = display;
        });
	    // Affichage des capitales (anciennement cités)
	    capitalesElements.forEach(function(element) {
	        var display = (zoomLevel >= 10) ? 'block' : 'none';
	        element.text.style.display = display;
	        element.rect.style.display = display;
	    });
	
	    // Affichage des cités (anciennement villes)
	    citesElements.forEach(function(element) {
	        var display = (zoomLevel >= 14) ? 'block' : 'none';
	        element.text.style.display = display;
	        element.rect.style.display = display;
	    });
	
	    // Affichage des villes (anciennement villages)
	    villesElements.forEach(function(element) {
	        var display = (zoomLevel >= 16) ? 'block' : 'none';
	        element.text.style.display = display;
	        element.rect.style.display = display;
	    });
	
	    // Affichage des villages (nouvelle catégorie)
	    villagesElements.forEach(function(element) {
	        var display = (zoomLevel >= 18) ? 'block' : 'none';
	        element.text.style.display = display;
	        element.rect.style.display = display;
	    });
    }

    // Écouter les événements de zoom et mettre à jour la visibilité
    viewer.addHandler('zoom', function() {
        updateTextVisibility();
        scheduleGridUpdate(true); // Immédiat pour le zoom aussi
    });

    // Écouter les événements de déplacement pour le quadrillage (immédiat)
    viewer.addHandler('pan', function() {
        scheduleGridUpdate(true); // Mise à jour immédiate pour les mouvements
    });

    // Écouter pendant l'animation pour une synchronisation parfaite
    viewer.addHandler('animation', function() {
        if (gridVisible) {
            drawGrid(); // Dessin direct pendant l'animation
        }
    });

    // Écouter les événements d'animation pour le quadrillage
    viewer.addHandler('animation-finish', function() {
        scheduleGridUpdate(true); // Immédiat à la fin d'animation
    });

    // Redimensionner le canvas quand la fenêtre change
    viewer.addHandler('resize', function() {
        scheduleGridUpdate(true); // Immédiat pour le redimensionnement
    });

    // Initialement mettre à jour la visibilité (au cas où le zoom est déjà correct au démarrage)
    updateTextVisibility();

    // Gestion des boutons pour activer/désactiver l'image et le texte
    document.getElementById('toggleText').addEventListener('click', function() {
        textVisibilityEnabled = !textVisibilityEnabled;
        updateTextVisibility();
    });

    document.getElementById('toggleBorders').addEventListener('click', function() {
        if (bordersLayer.style.display === 'none') {
            bordersLayer.style.display = 'block';
        } else {
            bordersLayer.style.display = 'none';
        }
    });

    // Gestion du bouton pour afficher/masquer le quadrillage
    document.getElementById('toggleGrid').addEventListener('click', function() {
        if (gridCanvas.style.display === 'none') {
            gridVisible = true;
            gridCanvas.style.display = 'block';
            drawGrid(); // Dessiner le quadrillage
        } else {
            gridVisible = false;
            gridCanvas.style.display = 'none';
            // Effacer le canvas pour libérer la mémoire
            gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
        }
    });

    // Gestion du bouton de mise à jour du quadrillage
    document.getElementById('updateGrid').addEventListener('click', function() {
        var gridSize = parseInt(document.getElementById('gridSize').value, 10);
        if (gridSize >= 2 && gridSize <= 10000) {
            createGrid(gridSize);
            if (gridCanvas.style.display === 'none') {
                gridVisible = true;
                gridCanvas.style.display = 'block';
            }
        } else {
            alert('Le nombre de tuiles doit être entre 2 et 10 000');
        }
    });

    // Permettre la mise à jour en appuyant sur Entrée dans le champ
    document.getElementById('gridSize').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('updateGrid').click();
        }
    });

    // ----------- Mesure de distances et de surfaces -----------
    var worldWidthKm = 1000; // Largeur approximative du monde en kilomètres
    var measureMode = null; // 'distance' ou 'area'
    var measurePoints = [];
    var measureLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
    measureLayer.setAttribute('id', 'measureLayer');
    svgOverlay.node().appendChild(measureLayer);

    function resetMeasure() {
        measurePoints = [];
        while (measureLayer.firstChild) {
            measureLayer.removeChild(measureLayer.firstChild);
        }
    }

    function clearLayer() {
        while (measureLayer.firstChild) {
            measureLayer.removeChild(measureLayer.firstChild);
        }
    }

    function distanceKm(p1, p2) {
        var dx = (p2.x - p1.x) * worldWidthKm;
        var dy = (p2.y - p1.y) * worldWidthKm;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function polygonArea(points) {
        var area = 0;
        for (var i = 0, j = points.length - 1; i < points.length; j = i++) {
            area += (points[j].x * points[i].y) - (points[i].x * points[j].y);
        }
        area = Math.abs(area / 2);
        return area * worldWidthKm * worldWidthKm;
    }

    function showLabel(text, coord) {
        var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", coord.x);
        label.setAttribute("y", coord.y);
        label.setAttribute("fill", "yellow");
        label.setAttribute("font-size", "0.02");
        label.setAttribute("font-family", "Verdana, sans-serif");
        label.setAttribute("pointer-events", "none");
        label.textContent = text;
        measureLayer.appendChild(label);
    }


    document.getElementById('measureDistance').addEventListener('click', function() {
        measureMode = 'distance';
        resetMeasure();
    });

    document.getElementById('measureArea').addEventListener('click', function() {
        measureMode = 'area';
        resetMeasure();
    });


    viewer.addHandler('canvas-click', function(event) {
        if (!measureMode) return;
        event.preventDefaultAction = true;
        var webPoint = event.position;
        var point = viewer.viewport.pointFromPixel(webPoint);
        measurePoints.push(point);

        if (measureMode === 'distance' && measurePoints.length === 2) {
            var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute('x1', measurePoints[0].x);
            line.setAttribute('y1', measurePoints[0].y);
            line.setAttribute('x2', measurePoints[1].x);
            line.setAttribute('y2', measurePoints[1].y);
            line.setAttribute('stroke', 'yellow');
            line.setAttribute('stroke-width', '0.005');
            measureLayer.appendChild(line);

            var dist = distanceKm(measurePoints[0], measurePoints[1]);
            var midX = (measurePoints[0].x + measurePoints[1].x) / 2;
            var midY = (measurePoints[0].y + measurePoints[1].y) / 2;
            var dx = measurePoints[1].x - measurePoints[0].x;
            var dy = measurePoints[1].y - measurePoints[0].y;
            var len = Math.sqrt(dx*dx + dy*dy);
            var offset = 0.02;
            var offX = -dy/len * offset;
            var offY = dx/len * offset;
            showLabel(dist.toFixed(2) + ' km', { x: midX + offX, y: midY + offY });
            measureMode = null;
        } else if (measureMode === 'area') {
            // Points are collected on single click; polygon will be drawn on double-click
        }
    });

    viewer.addHandler('canvas-double-click', function() {
        if (measureMode === 'area' && measurePoints.length > 2) {
            var poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute('points', measurePoints.map(function(p){ return p.x + ',' + p.y; }).join(' '));
            poly.setAttribute('stroke', 'yellow');
            poly.setAttribute('fill', 'rgba(255,255,0,0.3)');
            poly.setAttribute('stroke-width', '0.003');
            clearLayer();
            measureLayer.appendChild(poly);

            var area = polygonArea(measurePoints);
            showLabel(area.toFixed(2) + ' km²', measurePoints[0]);
            measureMode = null;
        }
    });


</script>
